<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVS Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAFB; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6474; --line:#E2E4EA;
  --artery:#B3202E; --artery-soft:#FBEDEE; --vein:#2C5AA0; --vein-soft:#EDF2FA;
  --ok:#1E7A4F; --ok-soft:#E8F4EE; --partial:#A86400; --partial-soft:#FBF2E2;
  --grid:rgba(179,32,46,.08); --grid-strong:rgba(179,32,46,.17);
  --font:"Anuphan","Leelawadee UI","Segoe UI","Noto Sans Thai","Thonburi",system-ui,sans-serif;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141B; --surface:#191E28; --ink:#E7E9EF; --muted:#9AA3B2; --line:#2A303C;
    --artery:#E25562; --artery-soft:#38191E; --vein:#77A2E6; --vein-soft:#1B2538;
    --ok:#4DB886; --ok-soft:#15302A; --partial:#E3A443; --partial-soft:#33281A;
    --grid:rgba(226,85,98,.10); --grid-strong:rgba(226,85,98,.22);
  }
}
:root[data-theme="dark"]{
  --paper:#11141B; --surface:#191E28; --ink:#E7E9EF; --muted:#9AA3B2; --line:#2A303C;
  --artery:#E25562; --artery-soft:#38191E; --vein:#77A2E6; --vein-soft:#1B2538;
  --ok:#4DB886; --ok-soft:#15302A; --partial:#E3A443; --partial-soft:#33281A;
  --grid:rgba(226,85,98,.10); --grid-strong:rgba(226,85,98,.22);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.65;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--vein);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:12px}
.titlebar .sub{display:block}
.resetbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 12px;font-weight:600;font-size:.9rem;color:var(--ink)}
.resetbtn:hover{border-color:var(--artery);color:var(--artery)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:var(--r-md);padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:20;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.titlebar h1{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-.01em}
.hublink{display:inline-block;margin-bottom:2px;font-size:.85rem;color:var(--muted);text-decoration:none}
.hublink:hover{color:var(--ink)}
.titlebar .sub{color:var(--muted);font-size:.88rem}
nav.tabs{display:flex;gap:4px;margin-top:8px}
nav.tabs button{background:none;border:0;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--artery)}

/* question number navigator */
.qnav{display:flex;gap:8px;align-items:flex-start;margin:10px 0 4px}
.qrow{display:flex;gap:6px;overflow-x:auto;flex:1;padding:3px 2px 6px;scrollbar-width:thin}
.qnav.open .qrow{flex-wrap:wrap;overflow:visible;max-height:40vh;overflow-y:auto}
.qc{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem;color:var(--ink)}
.qc.answered{background:var(--line)}
.qc.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qc.wrong{background:var(--artery);border-color:var(--artery);color:#fff}
.qc.partial{background:var(--partial);border-color:var(--partial);color:#fff}
.qc.flag{background:var(--vein);border-color:var(--vein);color:#fff}
.qc.flag-ring{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--vein)}
.qc.cur{outline:2px solid var(--ink);outline-offset:2px}
.qexp{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;padding:0 10px;font-size:.85rem;margin-top:3px}
.qlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);padding-bottom:10px}
.qlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 8px;font-size:.92rem;max-width:100%}
.timer{margin-left:auto;font-weight:600;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:600}
.btn.primary{background:var(--artery);border-color:var(--artery);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.qnum{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.qnum small{font-size:.9rem;color:var(--muted);font-weight:500}
.flag{background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px;font-size:.85rem;color:var(--muted)}
.flag[aria-pressed="true"]{border-color:var(--partial);color:var(--partial);background:var(--partial-soft)}
.stem{margin:10px 0 16px;white-space:normal}
.case{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--vein);border-radius:var(--r-sm);padding:12px 14px;margin:10px 0 18px}
.case .lbl{font-size:.82rem;color:var(--vein);font-weight:600}
figure{margin:12px 0 16px}
.oldkey{margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:.9rem}
.oldkey b{display:block;margin-bottom:4px}
.keyrow{margin-top:6px;padding:8px 10px;border-radius:var(--r-sm);font-size:.93rem}
.keyrow .kl{display:block;font-weight:700;font-size:.82rem;letter-spacing:.01em}
.keyrow.src{background:var(--surface);border:1px solid var(--line)}
.keyrow.src .kl{color:var(--muted)}
.keyrow.new{background:var(--vein-soft);border-left:4px solid var(--vein)}
.keyrow.new .kl{color:var(--vein)}
.keyrow .kt{white-space:pre-line}
.keyrow ul{margin:2px 0 0;padding-left:20px}
.more{margin-top:6px;font-size:.92rem}
.more summary{cursor:pointer;color:var(--vein);font-weight:600;font-size:.85rem}
.kwds{margin-top:6px;font-size:.78rem;color:var(--muted)}
figure img{display:block;width:100%;max-width:760px;height:auto;max-height:75vh;object-fit:contain;object-position:left top;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;cursor:zoom-in}
figure img.zoom{position:fixed;inset:0;margin:auto;width:auto;max-width:96vw;max-height:96vh;object-position:center;border:0;background:transparent;z-index:1000;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(0,0,0,.8)}
figcaption{font-size:.85rem;color:var(--muted)}

.opts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--artery);background:var(--artery-soft)}
.opt.wrong .k{background:var(--artery);border-color:var(--artery);color:#fff}
.opt:disabled{cursor:default}

.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.item .prompt{font-weight:600;margin-bottom:8px}
.item .hint{font-size:.85rem;color:var(--muted);margin-bottom:6px}
textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:8px 10px;resize:vertical}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px}
.checks label.correct{border-color:var(--ok);background:var(--ok-soft)}
.checks label.wrong{border-color:var(--artery);background:var(--artery-soft)}
.verdict{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:.95rem}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--artery-soft)} .verdict.part{background:var(--partial-soft)}
.verdict b{display:block}
.override{display:inline-flex;gap:6px;margin-top:8px}
.override button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:3px 10px;font-size:.85rem}
.override button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.explain{margin-top:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.explain h3{margin:0 0 6px;font-size:1rem}
.disagree{display:inline-block;font-size:.8rem;color:var(--artery);background:var(--artery-soft);padding:1px 8px;border-radius:4px;margin-left:6px}
.unverified{display:inline-block;font-size:.8rem;color:var(--partial);background:var(--partial-soft);padding:1px 8px;border-radius:4px;margin-left:6px}
.refs{margin-top:12px;display:grid;gap:6px}
.ref{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:.93rem}
.ref a{color:var(--vein)}
.hot{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--artery-soft);color:var(--artery);font-weight:600}
.tier{font-size:.78rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:8px 0 4px}
.chain .st{background:var(--vein-soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-weight:600;font-size:.93rem}
.chain .st.ans{background:var(--ok-soft);border-color:var(--ok)}
.chain .ar{color:var(--muted);font-weight:700}
ol.steps{margin:6px 0 0;padding-left:22px;font-size:.93rem}
ol.steps li{margin:2px 0}
.explain h4{margin:14px 0 4px;font-size:.95rem}
.answerline{padding:10px 12px;border-left:4px solid var(--ok,#1a7f4b);background:rgba(26,127,75,.07);border-radius:var(--r-sm)}
.answerline p{margin:0 0 2px}
ul.kc,ol.kc{margin:4px 0;padding-left:1.3em}
ul.kc li,ol.kc li{margin:3px 0}
.trap{margin-top:8px;padding:8px 10px;border-radius:var(--r-sm);background:rgba(217,119,6,.10);border-left:4px solid #d97706}
.trap b{display:block;margin-bottom:2px}
.auditnote{color:var(--muted);font-size:.85rem;margin-top:12px}
.why{display:block;font-size:.85rem;color:var(--muted);margin-top:3px}
.opt.correct .why,.opt.wrong .why{color:var(--ink)}
.doubt{margin-top:12px;border:1px dashed var(--line);background:none;border-radius:var(--r-sm);padding:4px 10px;font-size:.85rem;color:var(--muted)}
.doubt[aria-pressed="true"]{border-style:solid;border-color:var(--partial);color:var(--partial);background:var(--partial-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0 40px}

/* guide + summary */
section.panel h2{font-size:1.25rem;margin:22px 0 6px;letter-spacing:-.01em}
section.panel p.lead{color:var(--muted);margin:0 0 14px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:8px 0 10px}
.bar span{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.read{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px}
.read .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.read .where{font-weight:700;color:var(--ink)}
.read a.where{color:var(--vein)}
.read .meta{font-size:.88rem;color:var(--muted);margin-top:4px}
.jump{border:0;background:var(--vein-soft);color:var(--vein);border-radius:4px;padding:0 7px;margin:2px 3px 0 0;font-size:.85rem}
.tierhead{display:flex;align-items:center;gap:10px;margin:20px 0 8px}
.tierhead .dot{width:10px;height:10px;border-radius:50%}
.tierhead h3{margin:0;font-size:1.02rem}
.repbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--vein-soft);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin:16px 0 4px}
.repbar b{font-size:1rem}
.repbar .rp{color:var(--muted);font-size:.9rem}
.repbar .btn{margin-left:auto;padding:5px 12px;font-size:.88rem}
.meter{flex-basis:100%;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok)}
.qc.again{background:var(--artery-soft);border-color:var(--artery);color:var(--artery)}
.lcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);margin:12px 0;overflow:hidden}
.lcard>.lh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.lcard>.lh .ln{font-weight:700;font-size:1.05rem}
.lcard>.lh .lm{color:var(--muted);font-size:.88rem}
.topic{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.topic .pg{font-weight:700;font-size:.95rem;line-height:1.4}
.topic .pg a{color:var(--vein)}
.topic .pg .td{display:block;margin-top:6px;width:8px;height:8px;border-radius:50%}
.topic .hd{font-weight:600}
.topic .sm{color:var(--muted);font-size:.9rem}
.topic ul.focus{margin:6px 0 2px;padding-left:18px;font-size:.93rem}
.topic ul.focus li{margin:2px 0}
.topic ul.focus .yr{color:var(--muted);font-size:.82rem;margin-left:4px}
.topic.support .hd,.topic.support .pg{color:var(--muted);font-weight:500}
.topic.other{background:var(--paper)}
.subhead{padding:8px 14px;font-size:.82rem;color:var(--muted);background:var(--paper);border-top:1px solid var(--line)}
.big{font-size:2.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-md);padding:14px}
.hidden{display:none!important}
@media (max-width:560px){ body{font-size:16px} .timer{margin-left:0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="titlebar"><div><a class="hublink hidden" id="hubLink" href="#">← รวมข้อสอบ</a><h1 id="title">CVS Quiz</h1><span class="sub" id="subtitle"></span></div><button class="resetbtn" id="resetBtn" title="ล้างคำตอบทั้งหมดของชุดนี้"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>รีเซ็ต</button></div>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="quiz">ทำข้อสอบ</button>
      <button role="tab" aria-selected="false" data-tab="guide">Guidereader</button>
      <button role="tab" aria-selected="false" data-tab="summary">สรุปผล</button>
    </nav>
    <div class="qnav" id="qnav"><div class="qrow" id="qrow" aria-label="เลขข้อ"></div><button class="qexp" id="qexp" aria-expanded="false">ดูทั้งหมด</button></div>
    <div class="qlegend"><span><i style="background:var(--ok)"></i>ถูก</span><span><i style="background:var(--artery)"></i>ผิด</span><span><i style="background:var(--partial)"></i>ถูกบางส่วน</span><span><i style="background:var(--vein)"></i>ปักธง</span><span><i style="background:var(--line)"></i>ตอบแล้ว รอตรวจ</span><span id="qdone"></span></div>
  </div>
</header>

<main class="wrap">
  <section id="tab-quiz" class="panel">
    <div id="repbar" class="repbar hidden"></div>
    <div class="toolbar" id="toolbar">
      <div class="seg" role="group" aria-label="โหมด">
        <button data-mode="practice" aria-pressed="true">ฝึก (เฉลยทันที)</button>
        <button data-mode="exam" aria-pressed="false">จับเวลา</button>
      </div>
      <select id="filterLecture" aria-label="กรองตาม Lecture"></select>
      <select id="filterStatus" aria-label="กรองตามสถานะ">
        <option value="all">ทุกข้อ</option>
        <option value="wrong">เฉพาะข้อที่ผิด</option>
        <option value="flagged">เฉพาะข้อที่ปักธง</option>
        <option value="blank">ยังไม่ได้ทำ</option>
      </select>
      <span class="timer" id="timer"></span>
    </div>
    <div id="question"></div>
    <div class="nav">
      <button class="btn" id="prev">ข้อก่อนหน้า</button>
      <button class="btn primary hidden" id="submitAll">ส่งคำตอบทั้งหมด</button>
      <button class="btn" id="next">ข้อถัดไป</button>
    </div>
  </section>

  <section id="tab-guide" class="panel hidden"></section>
  <section id="tab-summary" class="panel hidden"></section>

ty benefit", "lecture_guess": ["L08", "CC4"]}}, {"id": "49-MCQ-036", "n": 36, "type": "MCQ", "stem": "A 72-year-old male who present abrupt onset of abdominal pain has been proven by a computerized tomography to have an abdominal aortic aneurysm. Two hours after hospital - admission, the patient develops hypotension. On examination, the femoral pulses cannot be - palpated. Which is the most likely pathophysiology of shock in this patient? ✗", "options": [{"key": "A", "text": "Perforation of the tunica adventitia and leak of blood into the peritoneal cavity", "why": "ถูก — AAA rupture ทะลุทุกชั้น → เลือดออก (ส่วนใหญ่ retroperitoneum) → hypovolemic shock"}, {"key": "B", "text": "Renal infarction", "why": "ไม่ทำ shock"}, {"key": "C", "text": "Ischemia of the spinal cord", "why": "ไม่ทำ shock"}, {"key": "D", "text": "Penetration of blood through the tunica intima of the aorta", "why": "= aortic dissection (เลือดเข้า media)"}, {"key": "E", "text": "Cerebral ischemia", "why": "ไม่ใช่"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• AAA rupture: ทะลุ adventitia → retroperitoneal/peritoneal hemorrhage → hypovolemic shock\n• Dissection: เลือดเข้าทาง intimal tear แยกชั้น media\nTrap: rupture ส่วนใหญ่ไป retroperitoneum แต่ A ยังเป็นตัวเลือกที่ดีที่สุด", "explanation": "AAA rupture → เลือดออกมาก → hypovolemic shock + femoral pulse หาย", "refs": [{"lecture": "L14", "pages": [74, 75], "focus": "AAA และ rupture", "confidence": "high", "hotspot": {"tier": 1, "years": [49, 50, 51, 52], "rank": 31}}], "tags": {"discipline": "pathology", "bloom": "apply", "topic": "AAA rupture", "lecture_guess": ["L14"]}}, {"id": "49-MCQ-037", "n": 37, "type": "MCQ", "stem": "A man was stabbed at the 3rd right intercostal space, just lateral to the sternum. Which structure is most likely affected?", "options": [{"key": "A", "text": "Right atrium", "why": "ถูก — ขอบขวาหัวใจ (3rd–6th costal cartilage ข้าง sternum) = RA"}, {"key": "B", "text": "Right ventricle", "why": "อยู่หลัง sternum/ซ้ายล่าง"}, {"key": "C", "text": "Left atrium", "why": "อยู่ด้านหลังสุด"}, {"key": "D", "text": "Left ventricle", "why": "ด้านซ้าย"}, {"key": "E", "text": "Arch of aorta", "why": "สูงกว่า (manubrium)"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Right border: RA (3rd–6th right costal cartilage)\n• Sternal front: RV; left border: LV; posterior: LA\nTrap: RV คือคำตอบถ้าแทงตรงกลาง sternum", "explanation": "แทงที่ right 3rd ICS ข้าง sternum → right atrium", "refs": [{"lecture": "L01", "pages": [13, 14], "focus": "Surfaces/borders: right border = RA", "confidence": "high", "hotspot": {"tier": 1, "years": [49, 50, 51, 52], "rank": 9}}], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Surface anatomy of the heart", "lecture_guess": ["L01"]}}, {"id": "49-MCQ-040", "n": 40, "type": "MCQ", "stem": "Which organ have the highest arteriovenous oxygen difference?", "options": [{"key": "A", "text": "Kidney", "why": "a-vO2 diff ต่ำ (~14 mL/L) เพราะ flow สูง"}, {"key": "B", "text": "Liver", "why": "~34 mL/L"}, {"key": "C", "text": "Brain", "why": "~62 mL/L"}, {"key": "D", "text": "Skeletal muscle", "why": "~60 mL/L ขณะพัก"}, {"key": "E", "text": "Heart muscle", "why": "ถูก — ~114 mL/L สูงสุด (O2 extraction ~70–75%)"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Myocardium extract O2 ~70–75% แม้ขณะพัก → เพิ่ม O2 ได้โดยเพิ่ม coronary flow เท่านั้น\n• ไต flow สูงมาก → a-vO2 diff ต่ำ\nTrap: ขณะออกกำลังหนัก skeletal muscle อาจสูงพอๆ กัน", "explanation": "หัวใจ extract O2 สูงสุด → a-vO2 difference สูงสุด", "refs": [{"lecture": "L17", "pages": [37, 37], "focus": "Oxygen extraction ของแต่ละอวัยวะ", "confidence": "medium", "hotspot": {"tier": 1, "years": [49, 50, 51, 52], "rank": 15}}], "tags": {"discipline": "physiology", "bloom": "recall", "topic": "Ar Ax//9k="}, {"id": "49-MCQ-048", "n": 48, "type": "MCQ", "stem": "Which is sign of early stage of heart failure?", "options": [{"key": "A", "text": "Subpleural edema", "why": "interstitial stage"}, {"key": "B", "text": "Larger upper lobe vessels (cephalization)", "why": "ถูก — PCWP ~13–18 → redistribution เป็นอาการแรก"}, {"key": "C", "text": "Bat-wing appearance", "why": "alveolar edema (PCWP > 25)"}, {"key": "D", "text": "Kerley A, Kerley B lines", "why": "interstitial edema (18–25)"}, {"key": "E", "text": "Increased interstitial markings", "why": "interstitial"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• PCWP 13–18: cephalization\n• 18–25: interstitial edema (Kerley B, peribronchial cuffing, subpleural)\n• > 25: alveolar edema (bat-wing)\nTrap: Kerley B ไม่ใช่สัญญาณแรก", "explanation": "CXR HF ระยะแรก = cephalization (upper lobe diversion)", "refs": [{"lecture": "L12", "pages": [41, 41], "focus": "Pulmonary venous hypertension stages: cephalization ก่อน", "confidence": "high", "hotspot": {"tier": 1, "years": [49, 50, 51, 52], "rank": 30}}], "tags": {"discipline": "clinical", "bloom": "recall", "topic": "CXR in heart failure", "lecture_guess": ["L12"]}}, {"id": "49-MCQ-049", "n": 49, "type": "MCQ", "stem": "A 60-year-old man present with substernal chest pain for 2 hours. Physical examination shows BP 100/60 mm Hg , PR 70 bpm, O2sat 98%, heart: normal S1S2 and no murmur, lung: clear. ECG show as figure (จำไม่ได้) Which of the following statement should be the most appropriate next step management?", "options": [{"key": "A", "text": "NSS 500 mL IV loading", "why": "ทำหลังยืนยัน RV infarct"}, {"key": "B", "text": "O2 5 L/min", "why": "O2 sat 98% ไม่ต้องให้"}, {"key": "C", "text": "Give 5 mg nitrate sublingual", "why": "BP 100/60 เสี่ยง RV infarct → ห้าม nitrate ก่อนประเมิน"}, {"key": "D", "text": "Perform V3R and V4R leads", "why": "เสนอ — สงสัย inferior MI + BP ต่ำ → ตรวจ right-sided leads หา RV infarct"}, {"key": "E", "text": "LMWH is the drug of choice", "why": "STEMI ต้อง reperfusion เป็นหลัก"}], "answer": "D", "answer_verified": false, "answer_status": "drafted", "explanation_style": "principle", "audit_note": "ต้นฉบับไม่ได้วงเฉลย และไม่มีภาพ ECG (ผู้จำ 'จำไม่ได้')", "key_concept": "• RV infarct: hypotension + JVP ↑ + ปอดใส; ST ↑ V4R\n• ห้าม nitrate/morphine/diuretic (preload dependent) → ให้ IV fluid\n• O2 เฉพาะ SpO2 < 90%\nTrap: ECG ในต้นฉบับจำไม่ได้ — คำตอบนี้ตั้งบนข้อสันนิษฐาน inferior STEMI", "explanation": "Inferior STEMI + BP ต่ำ ปอดใส → ตรวจ V3R/V4R หา RV infarction ก่อนให้ nitrate", "refs": [{"lecture": "CC2", "pages": [58, 58], "focus": "Inferior STEMI + RV infarction: V3R/V4R", "confidence": "high", "hotspot": {"tier": 2, "years": [49, 51], "rank": 113}}], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "RV infarction", "lecture_guess": ["CC3", "CC2"]}}, {"id": "49-MCQ-050", "n": 50, "type": "MCQ", "stem": "A 56-year-old woman with left breast cancer underwent mastectomy with axillary lymph node dissection. Six months later she has persistent left arm non-pitting edema, afebrile, without redness or tenderness. What is the mechanism?", "options": [{"key": "A", "text": "Lymphatic obstruction", "why": "ถูก — ตัด axillary node → lymphedema (non-pitting, ไม่มีอักเสบ)"}, {"key": "B", "text": "Over water intake", "why": "ไม่ทำ edema แขนข้างเดียว"}, {"key": "C", "text": "Increased interstitial oncotic pressure", "why": "เป็นผลตามมาของ lymphedema ไม่ใช่สาเหตุต้น"}, {"key": "D", "text": "Increased capillary hydrostatic pressure", "why": "จะ pitting และไม่ใช่ข้างเดียว"}, {"key": "E", "text": "Increased vascular permeability", "why": "ต้องมีอักเสบ แดง เจ็บ"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Lymphedema: protein สะสมใน interstitium → fibrosis → non-pitting\n• สาเหตุ: ผ่าตัด/ฉายแสง node, filariasis, มะเร็ง\nTrap: πi ↑ เกิดตามหลัง lymph อุด var $ = function(s, r){ return (r||document).querySelector(s); };

/* ---------- state ---------- */
function freshState(mode){ return {mode:mode||"practice", idx:0, answers:{}, checked:{}, flags:{}, doubts:{}, overrides:{}, started:Date.now(), submitted:false, filterLecture:"all", filterStatus:"all"}; }
var S = load() || freshState();
S.doubts = S.doubts || {};
var CTX = null;
function repOn(){ return !!(S.rep && S.rep.active); }
function X(){ return CTX || (repOn() ? S.rep : S); }
function withMain(fn){ CTX = S; try{ return fn(); } finally { CTX = null; } }
function instant(){ return S.mode === "practice" || repOn(); }
function load(){ try{ var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function txt(s){ return esc(s).replace(/\n/g,"<br>"); }
function norm(s){ return String(s||"").toLowerCase().replace(/[\s.,;:!?()\-–_/'"]+/g,""); }
function lecName(id){ return LEC[id] ? id + " " + LEC[id].title : id; }
function pagesStr(p){ if(!p||!p.length) return ""; return p[0]===p[p.length-1] ? "หน้า " + p[0] : "หน้า " + p[0] + "–" + p[p.length-1]; }
/* viewer links reuse one tab (the viewer listens for hashchange) */
function lt(){ return META.viewer ? "cvs-lecture" : "_blank"; }
function pdfHref(id, p){
  var L = LEC[id]; if(!L || !L.file) return null;
  if(META.viewer) return META.viewer + "#lecture=" + encodeURIComponent(L.file) + (p && p.length ? "&page=" + p[0] : "");
  if(!META.lecture_base) return null;
  var href = META.lecture_base + encodeURI(L.file);
  if(/\.pdf$/i.test(L.file) && p && p.length) href += "#page=" + p[0];
  return href;
}
function lecturesOf(q){ return (q.refs||[]).map(function(r){ return r.lecture; }); }

/* ---------- scoring ---------- */
function autoMatch(item, text){
  var t = norm(text); if(!t) return false;
  var acc = item.accepted || [];
  for(var i=0;i<acc.length;i++){ var a = norm(acc[i]); if(a && (t.indexOf(a)>=0 || a.indexOf(t)>=0 && t.length>=4)) return true; }
  var kw = item.keywords_all || [];
  if(kw.length && kw.every(function(k){ return t.indexOf(norm(k))>=0; })) return true;
  return false;
}
function itemScore(q, item){
  var a = (X().answers[q.id]||{})[item.id];
  if(item.format === "select"){
    var sel = (a && a.sel) || [], ans = item.answer || [];
    if(!sel.length || !ans.length) return 0;
    if(item.max_answers && sel.length > item.max_answers) return 0;
    var hit = sel.filter(function(k){ return ans.indexOf(k)>=0; }).length;
    return hit / ans.length;
  }
  var ov = (X().overrides[q.id]||{})[item.id];
  if(ov === 1 || ov === 0) return ov;
  return autoMatch(item, a && a.text) ? 1 : 0;
}
function qScore(q){
  if(q.type === "MCQ"){ if(!q.answer) return null; return X().answers[q.id] === q.answer ? 1 : 0; }
  var it = q.items || []; if(!it.length) return null;
  var s = 0; it.forEach(function(i){ s += itemScore(q, i); }); return s / it.length;
}
function answered(q){
  var a = X().answers[q.id]; if(a == null) return false;
  if(q.type === "MCQ") return true;
  return Object.keys(a).some(function(k){ var v=a[k]; return (v.text && v.text.trim()) || (v.sel && v.sel.length); });
}
function status(q){
  if(!answered(q)) return "blank";
  if(!X().checked[q.id]) return "answered";
  var sc = qScore(q); if(sc == null) return "answered";
  return sc >= 0.999 ? "ok" : sc <= 0.001 ? "wrong" : "partial";
}

var QMAP = {}; QS.forEach(function(q){ QMAP[q.id] = q; });
function curQ(){ return repOn() ? QMAP[S.rep.queue[0]] : visible()[S.idx]; }

/* ---------- filtering ---------- */
function visible(){
  return QS.filter(function(q){
    if(S.filterLecture !== "all" && lecturesOf(q).indexOf(S.filterLecture) < 0) return false;
    var st = status(q);
    if(S.filterStatus === "wrong" && !(st === "wrong" || st === "partial")) return false;
    if(S.filterStatus === "flagged" && !S.flags[q.id]) return false;
    if(S.filterStatus === "blank" && st !== "blank") return false;
    return true;
  });
}

/* ---------- question number navigator ---------- */
function renderGrid(){
  var v = visible(), row = $("#qrow");
  row.innerHTML = v.map(function(q, i){
    var st = status(q), cls = "qc";
    var graded = st === "ok" || st === "wrong" || st === "partial";
    if(graded) cls += " " + st; else if(S.flags[q.id]) cls += " flag"; else if(st === "answered") cls += " answered";
    if(graded && S.flags[q.id]) cls += " flag-ring";
    if(i === S.idx) cls += " cur";
    return '<button class="'+cls+'" data-goto="'+i+'" title="'+esc(q.type)+'">'+esc(q.n || i+1)+'</button>';
  }).join("");
  /* scroll only the number row sideways: scrollIntoView also moved the page while typing in KF/OSPE */
  var cur = row.querySelector(".cur");
  if(cur && !$("#qnav").classList.contains("open")){
    var rr = row.getBoundingClientRect(), cr = cur.getBoundingClientRect();
    row.scrollLeft += (cr.left + cr.width/2) - (rr.left + rr.width/2);
  }
  var done = QS.filter(function(q){ return status(q) !== "blank"; }).length;
  $("#qdone").textContent = "ทำแล้ว " + done + "/" + QS.length;
}
$("#qrow").addEventListener("click", function(e){
  var b = e.target.closest("[data-goto]"); if(!b || repOn()) return;
  S.idx = +b.dataset.goto; showTab("quiz"); render();
});
$("#qexp").onclick = function(){ var n = $("#qnav"), o = n.classList.toggle("open"); this.setAttribute("aria-expanded", o); this.textContent = o ? "ย่อ" : "ดูทั้งหมด"; };

/* ---------- question rendering ---------- */
function figureHTML(q){ return q.image ? '<figure><img onclick="this.classList.toggle(\'zoom\')" title="กดเพื่อขยาย" src="'+esc(q.image)+'" alt="'+esc(q.image_caption||"ภาพประกอบโจทย์")+'">'+(q.image_caption?'<figcaption>'+txt(q.image_caption)+'</figcaption>':'')+'</figure>' : ""; }

function refsHTML(q){
  if(!q.refs || !q.refs.length) return "";
  return '<div class="refs">' + q.refs.map(function(r){
    var href = pdfHref(r.lecture, r.pages);
    var where = esc(lecName(r.lecture)) + " " + pagesStr(r.pages);
    var hot = r.hotspot ? (r.hotspot.years.length >= 2 ? '<span class="hot">ออกซ้ำ ' + r.hotspot.years.length + ' ปี</span>' : '<span class="tier">เคยออกปี ' + r.hotspot.years.join(", ") + '</span>') + '<span class="tier">Tier ' + r.hotspot.tier + '</span>' : "";
    return '<div class="ref"><span>อ่านเพิ่ม:</span>' + (href ? '<a href="'+esc(href)+'" target="'+lt()+'" rel="noopener">'+where+'</a>' : '<b>'+where+'</b>') + hot + (r.note ? '<span style="color:var(--muted)">'+esc(r.note)+'</span>' : '') + '</div>';
  }).join("") + '</div>';
}
function chainHTML(m){
  if(!m || !m.length) return "";
  var steps = m.map(function(x){ return typeof x === "string" ? {s:x} : x; });
  var h = '<div class="chain">' + steps.map(function(x, i){ return (i ? '<span class="ar">→</span>' : '') + '<span class="st'+(x.answer?' ans':'')+'">'+esc(x.s)+'</span>'; }).join("") + '</div>';
  if(steps.some(function(x){ return x.note; })) h += '<ol class="steps">' + steps.map(function(x, i){ return x.note ? '<li value="'+(i+1)+'"><b>'+esc(x.s)+'</b> — '+txt(x.note)+'</li>' : ''; }).join("") + '</ol>';
  return h;
}
function badgeHTML(q){
  if(q.answer_status === "source_disagree") return '<span class="disagree">เฉลยต้นฉบับอาจคลาดเคลื่อน</span>';
  if(q.answer_status === "corrected") return '<span class="disagree">แก้เฉลยจากต้นฉบับแล้ว</span>';
  if(q.answer_verified === false || q.answer_status === "drafted") return '<span class="unverified">เฉลยยังไม่ยืนยัน</span>';
  return "";
}
/* key_concept -> readable blocks: "(1) … (2) …" or "a; b; c" become a list, "Trap:" becomes a warning box,
   explicit "\n• " lines are kept as bullets */
function listHTML(parts, ordered){ return '<'+(ordered?'ol':'ul')+' class="kc">' + parts.map(function(p){ return '<li>'+txt(p.trim())+'</li>'; }).join("") + '</'+(ordered?'ol':'ul')+'>'; }
function kcHTML(s){
  s = String(s||""); var trap = "", m = s.match(/\s*(?:Classic trap|Trap|จุดที่มักสับสน|จุดหลอก)\s*:\s*/i);
  if(m){ trap = s.slice(m.index + m[0].length); s = s.slice(0, m.index); }
  var body;
  if(/\n\s*[•\-]/.test(s)){
    var lines = s.split(/\n/).map(function(x){ return x.replace(/^\s*[•\-]\s*/, ""); }).filter(function(x){ return x.trim(); });
    body = listHTML(lines);
  } else if((s.match(/\(\d\)/g)||[]).length >= 2){
    var pre = s.split(/\(\d\)\s*/), head = pre.shift();
    body = (head.trim() ? '<div>'+txt(head.trim().replace(/[:：]\s*$/,""))+'</div>' : '') + listHTML(pre.filter(function(x){ return x.trim(); }).map(function(x){ return x.replace(/[;,]\s*$/,""); }), true);
  } else if(s.split(/;\s+/).length >= 3){
    body = listHTML(s.split(/;\s+/));
  } else body = '<div>'+txt(s.trim())+'</div>';
  if(trap) body += '<div class="trap"><b>⚠️ จุดที่มักสับสน</b> '+txt(trap.trim())+'</div>';
  return body;
}
function explainHTML(q, extra){
  var h = '<div class="explain"><h3>คำอธิบาย'+badgeHTML(q)+'</h3>';
  if(q.explanation || extra) h += '<div class="answerline">'+(extra||"")+(q.explanation?'<div>'+txt(q.explanation)+'</div>':'')+'</div>';
  if(q.source_answer) h += '<div class="keyrow src"><span class="kl">เฉลยต้นฉบับ: '+esc(q.source_answer)+' (ไม่ใช้)</span>'+(q.source_answer_note ? kcHTML(q.source_answer_note) : '')+'</div>';
  if(q.mechanism && q.mechanism.length) h += '<h4>ลำดับกลไก</h4>' + chainHTML(q.mechanism);
  if(q.key_concept) h += '<h4>หลักการ</h4>' + kcHTML(q.key_concept);
  if(q.audit_note) h += '<p class="auditnote">หมายเหตุการตรวจเฉลย: '+txt(q.audit_note)+'</p>';
  h += refsHTML(q);
  h += '<button class="doubt" id="doubtBtn" aria-pressed="'+!!S.doubts[q.id]+'">'+(S.doubts[q.id] ? 'ทำเครื่องหมายว่าเฉลยน่าสงสัยแล้ว' : 'เฉลยข้อนี้น่าสงสัย')+'</button>';
  return h + '</div>';
}

function renderMCQ(q){
  var chosen = X().answers[q.id], reveal = !!X().checked[q.id];
  var h = '<div class="stem">'+txt(q.stem)+'</div>' + figureHTML(q) + '<ul class="opts">';
  (q.options||[]).forEach(function(o){
    var cls = "";
    if(reveal){ if(o.key === q.answer) cls = "correct"; else if(o.key === chosen) cls = "wrong"; }
    h += '<li><button class="opt '+cls+'" data-opt="'+esc(o.key)+'" aria-pressed="'+(chosen===o.key)+'" '+(reveal?"disabled":"")+'><span class="k">'+esc(o.key)+'</span><span>'+txt(o.text)+(reveal && o.why ? '<span class="why">'+txt(o.why)+'</span>' : '')+'</span></button></li>';
  });
  h += '</ul>';
  if(reveal) h += explainHTML(q, q.answer ? '<p><b>ตอบ '+esc(q.answer)+(q.source_answer ? ' (เฉลยใหม่)' : q.answer_status === "drafted" ? ' (ร่างเฉลย — ไม่มีเฉลยต้นฉบับ)' : '')+'</b></p>' : '');
  return h;
}

function renderItems(q){
  var reveal = !!X().checked[q.id], A = X().answers[q.id] || {}, h = "";
  (q.items||[]).forEach(function(it, n){
    var a = A[it.id] || {};
    h += '<div class="item"><div class="prompt">'+(n+1)+'. '+txt(it.prompt)+'</div>';
    if(it.format === "select"){
      h += '<div class="hint">เลือกได้ไม่เกิน '+(it.max_answers||"—")+' ข้อ (เลือกเกินได้ 0 คะแนน)</div><div class="checks">';
      (it.options||[]).forEach(function(o){
        var on = (a.sel||[]).indexOf(o.key) >= 0, cls = "";
        if(reveal){ if((it.answer||[]).indexOf(o.key) >= 0) cls = "correct"; else if(on) cls = "wrong"; }
        h += '<label class="'+cls+'"><input type="checkbox" data-item="'+esc(it.id)+'" value="'+esc(o.key)+'" '+(on?"checked":"")+' '+(reveal?"disabled":"")+'><span>'+txt(o.text)+'</span></label>';
      });
      h += '</div>';
    } else {
      h += '<textarea data-item="'+esc(it.id)+'" placeholder="พิมพ์คำตอบ" '+(reveal?"readonly":"")+'>'+esc(a.text||"")+'</textarea>';
    }
    if(reveal){
      var sc = itemScore(q, it), cls2 = sc>=.999 ? "ok" : sc<=.001 ? "bad" : "part";
      var ans = it.format === "select"
        ? (it.options||[]).filter(function(o){ return (it.answer||[]).indexOf(o.key)>=0; }).map(function(o){ return o.text; }).join(", ")
        : (it.accepted||[]).join(" / ");
      h += '<div class="verdict '+cls2+'"><b>'+(sc>=.999?"ถูก":sc<=.001?"ยังไม่ถูก":"ถูกบางส่วน ("+Math.round(sc*100)+"%)")+'</b>' + keyHTML(it, ans, q)
        + (it.mechanism?chainHTML(it.mechanism):'')
        + (it.explanation && it.explanation !== it.key_text ? (it.source_key || it.new_key ? '<details class="more"><summary>อธิบายเพิ่ม</summary>'+kcHTML(it.explanation)+'</details>' : '<div style="margin-top:4px">'+kcHTML(it.explanation)+'</div>') : '');
      if(it.format !== "select"){
        var ov = (X().overrides[q.id]||{})[it.id];
        h += '<div class="override" role="group" aria-label="ตัดสินเอง"><span style="font-size:.85rem;color:var(--muted)">ตัดสินเอง:</span>'
          + '<button data-ov="1" data-item="'+esc(it.id)+'" aria-pressed="'+(ov===1)+'">ถูก</button>'
          + '<button data-ov="0" data-item="'+esc(it.id)+'" aria-pressed="'+(ov===0)+'">ผิด</button>'
          + '<button data-ov="auto" data-item="'+esc(it.id)+'" aria-pressed="'+(ov==null)+'">อัตโนมัติ</button></div>';
      }
      h += '</div>';
    }
    h += '</div>';
  });
  if(instant() && !reveal) h += '<button class="btn primary" id="checkQ" style="margin-top:8px">ตรวจคำตอบข้อนี้</button>';
  if(reveal) h += explainHTML(q);
  return h;
}

/* KF/OSPE key: original wording first; a new key (if the original is wrong) goes underneath */
function keyHTML(it, ans, q){
  var h = "";
  if(it.source_key) h += '<div class="keyrow src"><span class="kl">เฉลยต้นฉบับ'+(it.new_key ? ' (ไม่ใช้)' : '')+'</span><div class="kt">'+txt(it.source_key)+'</div></div>';
  if(it.new_key) h += '<div class="keyrow new"><span class="kl">เฉลยใหม่</span><div class="kt">'+txt(it.new_key)+'</div>'+(it.new_key_reason ? kcHTML(it.new_key_reason) : '')+'</div>';
  if(!it.source_key && !it.new_key){
    var k = it.format === "select" ? ans : (it.key_text || "");
    var drafted = it.key_drafted || it.status === "drafted" || q.answer_status === "drafted";
    if(k) h += '<div class="keyrow src"><span class="kl">'+(drafted ? 'เฉลย (ร่าง — ไม่มีเฉลยต้นฉบับ)' : 'เฉลย')+'</span><div class="kt">'+txt(k)+'</div></div>';
  }
  if(it.format !== "select" && (it.accepted||[]).length) h += '<div class="kwds">คำที่ระบบใช้ตรวจอัตโนมัติ: '+esc((it.accepted||[]).join(" / "))+'</div>';
  return h;
}
function renderKF(q){ return '<div class="case"><div class="lbl">สถานการณ์</div>'+txt(q.case||q.stem)+'</div>' + figureHTML(q) + renderItems(q); }
function renderOSPE(q){ return '<div class="case"><div class="lbl">สถานี '+esc(q.station||"")+'</div>'+txt(q.stem||"")+'</div>' + figureHTML(q) + renderItems(q); }

function render(){
  var inRep = repOn();
  $("#repbar").classList.toggle("hidden", !inRep);
  $("#toolbar").classList.toggle("hidden", inRep);
  document.querySelectorAll(".qlegend > span:not(#qdone)").forEach(function(el){ el.classList.toggle("hidden", inRep); });
  if(inRep){ renderRep(); return; }
  $("#prev").classList.remove("hidden"); $("#next").classList.remove("hidden"); $("#next").textContent = "ข้อถัดไป";
  var v = visible(), box = $("#question");
  if(S.idx >= v.length) S.idx = Math.max(0, v.length-1);
  renderGrid();
  if(!v.length){ box.innerHTML = '<div class="empty">ไม่มีข้อที่ตรงกับตัวกรองนี้ เปลี่ยนตัวกรองด้านบนเพื่อดูข้ออื่น</div>'; save(); return; }
  var q = v[S.idx];
  var body = q.type === "MCQ" ? renderMCQ(q) : q.type === "KF" ? renderKF(q) : renderOSPE(q);
  box.innerHTML = '<div class="qhead"><div class="qnum">ข้อ '+esc(q.n||S.idx+1)+' <small>'+esc(q.type)+' · '+(S.idx+1)+'/'+v.length+'</small></div>'
    + '<button class="flag" id="flagBtn" aria-pressed="'+!!S.flags[q.id]+'">ปักธงไว้ทบทวน</button></div>' + body;
  $("#prev").disabled = S.idx === 0;
  $("#next").disabled = S.idx >= v.length-1;
  $("#submitAll").classList.toggle("hidden", !(S.mode === "exam" && !S.submitted));
  save();
}

/* ---------- events ---------- */
$("#question").addEventListener("click", function(e){
  var q = curQ(); if(!q) return;
  var opt = e.target.closest("[data-opt]");
  if(opt && q.type === "MCQ" && !X().checked[q.id]){
    X().answers[q.id] = opt.dataset.opt;
    if(instant()) X().checked[q.id] = true;
    render(); return;
  }
  if(e.target.id === "checkQ"){ X().checked[q.id] = true; render(); return; }
  if(e.target.id === "flagBtn"){ S.flags[q.id] = !S.flags[q.id]; render(); return; }
  if(e.target.id === "doubtBtn"){ if(S.doubts[q.id]) delete S.doubts[q.id]; else S.doubts[q.id] = 1; render(); return; }
  var ov = e.target.closest("[data-ov]");
  if(ov){
    X().overrides[q.id] = X().overrides[q.id] || {};
    var val = ov.dataset.ov; if(val === "auto") delete X().overrides[q.id][ov.dataset.item]; else X().overrides[q.id][ov.dataset.item] = +val;
    render();
  }
});
$("#question").addEventListener("change", function(e){
  var q = curQ(); if(!q) return;
  var el = e.target; if(!el.dataset.item) return;
  X().answers[q.id] = X().answers[q.id] || {};
  var a = X().answers[q.id][el.dataset.item] = X().answers[q.id][el.dataset.item] || {};
  if(el.type === "checkbox"){ a.sel = a.sel || []; if(el.checked){ if(a.sel.indexOf(el.value)<0) a.sel.push(el.value); } else a.sel = a.sel.filter(function(k){ return k !== el.value; }); }
  renderGrid(); save();
});
$("#question").addEventListener("input", function(e){
  var q = curQ(); if(!q) return;
  var el = e.target; if(el.tagName !== "TEXTAREA") return;
  X().answers[q.id] = X().answers[q.id] || {};
  (X().answers[q.id][el.dataset.item] = X().answers[q.id][el.dataset.item] || {}).text = el.value;
  renderGrid(); save();
});
$("#prev").onclick = function(){ if(repOn()) return; if(S.idx>0){ S.idx--; render(); window.scrollTo(0,0); } };
$("#next").onclick = function(){ if(repOn()){ repNext(); return; } if(S.idx<visible().length-1){ S.idx++; render(); window.scrollTo(0,0); } };
$("#submitAll").onclick = function(){
  var blank = QS.filter(function(q){ return !answered(q); }).length;
  if(blank && !confirm("ยังไม่ได้ตอบ "+blank+" ข้อ ส่งคำตอบเลยไหม?")) return;
  QS.forEach(function(q){ X().checked[q.id] = true; }); S.submitted = true; S.finished = Date.now();
  render(); showTab("summary");
};
document.querySelectorAll(".seg [data-mode]").forEach(function(b){
  b.onclick = function(){
    if(b.dataset.mode === S.mode) return;
    var hasWork = Object.keys(X().answers).length > 0;
    if(hasWork && !confirm("เปลี่ยนโหมดจะเริ่มทำชุดนี้ใหม่ คำตอบเดิมจะถูกล้าง ดำเนินการต่อไหม?")) return;
    var d = S.doubts; S = freshState(b.dataset.mode); S.doubts = d; syncControls(); render();
  };
});
$("#filterLecture").onchange = function(){ S.filterLecture = this.value; S.idx = 0; render(); };
$("#filterStatus").onchange = function(){ S.filterStatus = this.value; S.idx = 0; render(); };
document.addEventListener("keydown", function(e){
  if(/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) return;
  if(!$("#tab-quiz").classList.contains("hidden")){
    if(e.key === "ArrowRight" || (e.key === "Enter" && repOn())) $("#next").click();
    else if(e.key === "ArrowLeft") $("#prev").click();
    else {
      var q = repOn() ? QMAP[S.rep.queue[0]] : visible()[S.idx]; if(!q || q.type !== "MCQ") return;
      var k = e.key.toUpperCase(), map = {"1":"A","2":"B","3":"C","4":"D","5":"E"}; k = map[k] || k;
      var b = document.querySelector('[data-opt="'+k+'"]'); if(b && !b.disabled) b.click();
    }
  }
});

/* ---------- timer ---------- */
setInterval(function(){
  var t = $("#timer");
  if(S.mode !== "exam" || repOn()){ t.textContent = ""; return; }
  var end = S.finished || Date.now(), sec = Math.floor((end - S.started)/1000);
  var lim = META.time_limit_min ? META.time_limit_min*60 : 0;
  var show = lim ? Math.max(0, lim - sec) : sec;
  t.textContent = (lim ? "เหลือ " : "เวลา ") + Math.floor(show/60) + ":" + ("0"+show%60).slice(-2);
  if(lim && sec >= lim && !S.submitted){ QS.forEach(function(q){ X().checked[q.id] = true; }); S.submitted = true; S.finished = S.started + lim*1000; render(); showTab("summary"); }
}, 1000);

/* ---------- repeat mode: loop until every question is answered correctly ---------- */
var REINSERT = 2; // a missed question comes back after this many other questions
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function notYet(){ return withMain(function(){ return QS.filter(function(q){ return status(q) !== "ok"; }).map(function(q){ return q.id; }); }); }
function startRep(ids){
  if(!ids.length) return;
  S.rep = {active:true, ids:ids.slice(), queue:shuffle(ids.slice()), answers:{}, checked:{}, overrides:{}, misses:{}, cleared:[], attempts:0, started:Date.now()};
  showTab("quiz"); render();
}
function exitRep(){ if(S.rep) S.rep.active = false; render(); showTab("summary"); }
function repNext(){
  var R = S.rep, id = R.queue[0], q = QMAP[id]; if(!q) return;
  if(!R.checked[id]){ toast(q.type === "MCQ" ? "เลือกคำตอบก่อน" : "กดตรวจคำตอบก่อนไปข้อถัดไป"); return; }
  R.attempts++;
  R.queue.shift();
  if(qScore(q) >= 0.999){ R.cleared.push(id); }
  else { R.misses[id] = (R.misses[id]||0) + 1; R.queue.splice(Math.min(REINSERT, R.queue.length), 0, id); }
  delete R.answers[id]; delete R.checked[id]; delete R.overrides[id];
  render(); window.scrollTo(0,0);
}
function renderRep(){
  var R = S.rep, total = R.ids.length, done = R.cleared.length, box = $("#question");
  $("#repbar").innerHTML = '<b>โหมดทำซ้ำ</b><span class="rp">ผ่านแล้ว '+done+'/'+total+'  เหลือ '+R.queue.length+' ข้อ  ตอบไปแล้ว '+R.attempts+' ครั้ง</span><button class="btn" id="repExit">ออกจากโหมดทำซ้ำ</button><div class="meter"><span style="width:'+(done/total*100)+'%"></span></div>';
  $("#repExit").onclick = exitRep;
  var curId = R.queue[0];
  $("#qrow").innerHTML = R.ids.map(function(id){
    var q = QMAP[id], cls = "qc";
    if(R.cleared.indexOf(id) >= 0) cls += " ok"; else if(R.misses[id]) cls += " again";
    if(id === curId) cls += " cur";
    if(S.flags[id]) cls += R.cleared.indexOf(id) >= 0 ? " flag-ring" : "";
    return '<button class="'+cls+'" disabled title="'+(R.misses[id] ? 'พลาด '+R.misses[id]+' ครั้ง' : '')+'">'+esc(q.n || id)+'</button>';
  }).join("");
  $("#qdone").textContent = "โหมดทำซ้ำ: เขียว = ผ่าน, ชมพู = เคยพลาด";
  $("#prev").classList.add("hidden"); $("#submitAll").classList.add("hidden");
  if(!R.queue.length){
    var miss = R.ids.filter(function(id){ return R.misses[id]; }).sort(function(a,b){ return R.misses[b]-R.misses[a]; });
    var h = '<h2>ผ่านครบ '+total+' ข้อ</h2><p class="lead">ตอบทั้งหมด '+R.attempts+' ครั้ง ข้อที่ต้องวนกลับมาหลายรอบคือจุดที่ควรอ่านซ้ำ</p>';
    if(miss.length){
      h += '<div class="tablewrap"><table><thead><tr><th>ข้อ</th><th>พลาดก่อนผ่าน</th><th>อ่าน</th></tr></thead><tbody>' + miss.map(function(id){
        var q = QMAP[id];
        return '<tr><td>ข้อ '+esc(q.n||id)+'</td><td>'+R.misses[id]+' ครั้ง</td><td>'+(q.refs||[]).map(function(r){ return esc(lecName(r.lecture))+' '+pagesStr(r.pages)+(r.focus ? '<div style="color:var(--muted);font-size:.85rem">'+esc(r.focus)+'</div>' : ''); }).join("<br>")+'</td></tr>';
      }).join("") + '</tbody></table></div>';
    }
    h += '<div class="nav">' + (miss.length ? '<button class="btn primary" id="repAgain">วนอีกรอบเฉพาะข้อที่เคยพลาด ('+miss.length+')</button>' : '') + '<button class="btn" id="repDone">กลับไปหน้าสรุปผล</button></div>';
    box.innerHTML = h;
    $("#next").classList.add("hidden");
    if($("#repAgain")) $("#repAgain").onclick = function(){ $("#next").classList.remove("hidden"); startRep(miss); };
    $("#repDone").onclick = function(){ $("#next").classList.remove("hidden"); exitRep(); };
    save(); return;
  }
  $("#next").classList.remove("hidden");
  var q = QMAP[curId];
  var body = q.type === "MCQ" ? renderMCQ(q) : q.type === "KF" ? renderKF(q) : renderOSPE(q);
  box.innerHTML = '<div class="qhead"><div class="qnum">ข้อ '+esc(q.n||"")+' <small>'+esc(q.type)+(R.misses[curId] ? ' · วนกลับมารอบที่ '+(R.misses[curId]+1) : '')+'</small></div>'
    + '<button class="flag" id="flagBtn" aria-pressed="'+!!S.flags[q.id]+'">ปักธงไว้ทบทวน</button></div>' + body;
  var checked = !!R.checked[curId];
  $("#next").textContent = !checked ? "ข้อถัดไป" : (qScore(q) >= 0.999 ? "ถูก ไปข้อถัดไป" : "ไปข้อถัดไป (ข้อนี้จะวนกลับมา)");
  $("#next").disabled = !checked;
  save();
}

/* ---------- reset with undo ---------- */
var toastTimer = null;
function toast(msg, actLabel, act){
  var t = $(".toast"); if(t) t.remove(); clearTimeout(toastTimer);
  t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status");
  t.innerHTML = '<span>'+esc(msg)+'</span>' + (actLabel ? '<button>'+esc(actLabel)+'</button>' : '');
  if(actLabel) t.querySelector("button").onclick = function(){ act(); t.remove(); };
  document.body.appendChild(t); toastTimer = setTimeout(function(){ t.remove(); }, 6000);
}
function resetAll(){
  var prev = JSON.stringify(S), d = S.doubts;
  S = freshState(S.mode); S.doubts = d; syncControls(); showTab("quiz"); render();
  toast("ล้างคำตอบทั้งหมดแล้ว", "เลิกทำ", function(){ S = JSON.parse(prev); syncControls(); render(); });
}
$("#resetBtn").onclick = resetAll;

/* ---------- tabs ---------- */
function showTab(name){
  document.querySelectorAll("nav.tabs button").forEach(function(b){ b.setAttribute("aria-selected", b.dataset.tab === name); });
  ["quiz","guide","summary"].forEach(function(n){ $("#tab-"+n).classList.toggle("hidden", n !== name); });
  if(name === "guide") renderGuide();
  if(name === "summary") renderSummary();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(function(b){ b.onclick = function(){ showTab(b.dataset.tab); }; });
function jumpTo(qid){
  if(S.rep) S.rep.active = false;
  S.filterLecture = "all"; S.filterStatus = "all"; syncControls();
  var i = QS.findIndex(function(q){ return q.id === qid; }); if(i >= 0){ S.idx = i; showTab("quiz"); render(); }
}
document.addEventListener("click", function(e){ var j = e.target.closest("[data-jump]"); if(j) jumpTo(j.dataset.jump); });
function qLabel(qid){ var q = QS.find(function(x){ return x.id === qid; }); return q ? (q.n || qid) : qid; }

/* ---------- guidereader ---------- */
var PALETTE = ["var(--artery)","var(--vein)","var(--ok)","var(--partial)","#7A4FA0","#2F8C8C","#8C6A2F","#A0446E"];
var TIER_TXT = {1:"ต้องอ่าน",2:"ควรอ่าน",3:"อ่านถ้ามีเวลา"}, TIER_COL = {1:"var(--artery)",2:"var(--partial)",3:"var(--muted)"};

function pgLabel(p){ return p[0] === p[1] ? "หน้า " + p[0] : "หน้า " + p[0] + "–" + p[1]; }
function jumps(ids){ return (ids||[]).map(function(id){ return '<button class="jump" data-jump="'+esc(id)+'">ข้อ '+esc(qLabel(id))+'</button>'; }).join(""); }

function topicHTML(lec, t){
  var href = pdfHref(lec, t.pages), cls = "topic" + (t.role === "supporting" ? " support" : "") + (t.in_set === false ? " other" : "");
  var pg = href ? '<a href="'+esc(href)+'" target="'+lt()+'" rel="noopener">'+pgLabel(t.pages)+'</a>' : pgLabel(t.pages);
  var h = '<div class="'+cls+'"><div class="pg">'+pg+'<span class="td" style="background:'+TIER_COL[t.tier]+'" title="Tier '+t.tier+'"></span></div><div>';
  h += '<div class="hd">'+esc(t.heading)+(t.role === "supporting" ? ' <span class="tier">อ่านประกอบ</span>' : '')+'</div>';
  if(t.summary) h += '<div class="sm">'+esc(t.summary)+'</div>';
  if(t.focus && t.focus.length) h += '<ul class="focus">' + t.focus.map(function(f){ return '<li>'+esc(f.text)+'<span class="yr">'+(f.years||[]).join(", ")+'</span></li>'; }).join("") + '</ul>';
  var meta = [];
  if(t.years && t.years.length) meta.push((t.years.length >= 2 ? '<span class="hot">ออกซ้ำ '+t.years.length+' ปี</span>' : '<span class="tier">ออกปี '+t.years.join(", ")+'</span>'));
  meta.push('<span class="tier">Tier '+t.tier+' '+TIER_TXT[t.tier]+'</span>');
  h += '<div class="ref" style="margin-top:6px">'+meta.join("")+'</div>';
  if(t.question_ids && t.question_ids.length) h += '<div class="meta" style="margin-top:4px;font-size:.88rem;color:var(--muted)">ข้อในชุดนี้: '+jumps(t.question_ids)+'</div>';
  return h + '</div></div>';
}

function renderGuide(){ withMain(renderGuideMain); }
function renderGuideMain(){
  var P = $("#tab-guide");
  if(!GUIDE || !GUIDE.lectures){ P.innerHTML = '<h2>Guidereader</h2><div class="empty">ชุดนี้ยังไม่มีข้อมูล guidereader สร้างใหม่ด้วย build_quiz.py พร้อมไฟล์ CVS_analysis.json</div>'; return; }
  var h = '<h2>อ่านอะไรก่อนทำชุดนี้</h2><p class="lead">แยกตาม Lecture เรียงจากสำคัญมากไปน้อย ในแต่ละ Lecture เรียงหัวข้อตามลำดับหน้า ความสำคัญคิดจากข้อสอบปี ' + esc((GUIDE.recent_years||[]).join(", ")) + ' โดยให้น้ำหนักปีล่าสุดมากกว่า</p>';
  h += '<div class="qlegend" style="padding:0 0 4px"><span><i style="background:'+TIER_COL[1]+';border-radius:50%"></i>Tier 1 ต้องอ่าน</span><span><i style="background:'+TIER_COL[2]+';border-radius:50%"></i>Tier 2 ควรอ่าน</span><span><i style="background:'+TIER_COL[3]+';border-radius:50%"></i>Tier 3 ถ้ามีเวลา</span></div>';

  var comp = GUIDE.set_summary || [], total = comp.reduce(function(s,c){ return s + c.count; }, 0) || 1;
  if(comp.length){
    h += '<div class="bar">' + comp.map(function(c,i){ return '<span style="width:'+(c.count/total*100)+'%;background:'+PALETTE[i%PALETTE.length]+'" title="'+esc(lecName(c.lecture))+' '+c.count+' ข้อ"></span>'; }).join("") + '</div>';
  }

  GUIDE.lectures.forEach(function(L){
    var href = pdfHref(L.lecture, null);
    var inset = L.topics.filter(function(t){ return t.in_set !== false; }), other = L.topics.filter(function(t){ return t.in_set === false; });
    h += '<div class="lcard"><div class="lh"><span class="ln">'+(href ? '<a href="'+esc(href)+'" target="'+lt()+'" rel="noopener" style="color:inherit">'+esc(lecName(L.lecture))+'</a>' : esc(lecName(L.lecture)))+'</span>'
      + '<span class="lm">'+L.n_in_set+' ข้อในชุดนี้ · อ่าน '+L.pages_total+' หน้า · '+inset.length+' หัวข้อ</span></div>';
    h += inset.map(function(t){ return topicHTML(L.lecture, t); }).join("");
    if(other.length) h += '<div class="subhead">หัวข้ออื่นใน Lecture นี้ที่ออกบ่อย แต่ไม่อยู่ในชุดนี้</div>' + other.map(function(t){ return topicHTML(L.lecture, t); }).join("");
    h += '</div>';
  });

  if(GUIDE.minimum_set) h += '<p class="lead" style="margin-top:14px">ภาพรวมทั้ง CVS: ชุดหน้าขั้นต่ำ ' + GUIDE.minimum_set.pages_total + ' หน้า ครอบคลุมราว ' + Math.round(GUIDE.minimum_set.coverage*100) + '% ของข้อสอบช่วงปีล่าสุด ดูรายละเอียดใน CVS_analysis</p>';

  /* personal re-read list from wrong answers */
  var miss = {};
  QS.forEach(function(q){ var st = status(q); if(st === "wrong" || st === "partial"){ (q.refs||[]).forEach(function(r){
    var k = r.lecture + "|" + (r.pages||[]).join("-");
    var m = miss[k] = miss[k] || {heading: r.focus || "", pages:[r.pages[0], r.pages[r.pages.length-1]], tier:(r.hotspot||{}).tier || 3, years:(r.hotspot||{}).years || [], focus:[], question_ids:[], lecture:r.lecture};
    m.question_ids.push(q.id);
  }); } });
  var mk = Object.keys(miss);
  h += '<h2>อ่านซ่อมจากข้อที่ผิด</h2>' + (mk.length
    ? '<div class="lcard">' + mk.map(function(k){ var m = miss[k]; m.heading = lecName(m.lecture) + (m.heading ? ": " + m.heading : ""); return topicHTML(m.lecture, m); }).join("") + '</div>'
    : '<div class="empty">ยังไม่มีข้อที่ผิด เมื่อตรวจคำตอบแล้ว หน้าที่ควรอ่านซ่อมจะขึ้นที่นี่</div>');
  P.innerHTML = h;
}

/* ---------- summary ---------- */
function renderSummary(){ withMain(renderSummaryMain); }
function renderSummaryMain(){
  var P = $("#tab-summary"), checked = QS.filter(function(q){ return X().checked[q.id] && qScore(q) != null; });
  var notYetIds = notYet(), notYetN = notYetIds.length;
  var R = S.rep, resume = R && !R.active && R.queue.length ? '<button class="btn primary" id="repResume">ทำโหมดทำซ้ำต่อ (เหลือ '+R.queue.length+' ข้อ)</button>' : '';
  var repBtn = notYetN ? '<button class="btn'+(resume ? '' : ' primary')+'" id="repStart">โหมดทำซ้ำ: วนข้อที่ยังไม่ถูกจนถูกครบ ('+notYetN+' ข้อ)</button>' : '';
  function wireRep(){
    if($("#repStart")) $("#repStart").onclick = function(){ startRep(notYetIds); };
    if($("#repResume")) $("#repResume").onclick = function(){ S.rep.active = true; showTab("quiz"); render(); };
  }
  if(!checked.length){ P.innerHTML = '<h2>สรุปผล</h2><div class="empty">ยังไม่มีข้อที่ตรวจแล้ว ' + (S.mode==="exam" ? 'กด "ส่งคำตอบทั้งหมด" เมื่อทำเสร็จ' : 'ตอบหรือกดตรวจคำตอบในแต่ละข้อก่อน') + ' หรือเริ่มโหมดทำซ้ำเพื่อวนทั้งชุดจนตอบถูกทุกข้อ</div><div class="nav" style="justify-content:flex-start;gap:10px">'+resume+repBtn+'</div>'; wireRep(); return; }
  var sum = 0; checked.forEach(function(q){ sum += qScore(q); });
  var by = {};
  checked.forEach(function(q){ var ls = lecturesOf(q); if(!ls.length) ls = ["ไม่ระบุ"]; ls.forEach(function(l){ var b = by[l] = by[l] || {n:0, s:0, ids:[]}; b.n++; b.s += qScore(q); if(qScore(q) < .999) b.ids.push(q.id); }); });
  var unv = QS.filter(function(q){ return q.answer_verified === false; }).length;
  var h = '<h2>สรุปผล</h2><div class="big">' + (Math.round(sum*10)/10) + ' / ' + checked.length + '</div><p class="lead">' + Math.round(sum/checked.length*100) + '% จากข้อที่ตรวจแล้ว ' + (checked.length < QS.length ? '(ยังไม่ตรวจ ' + (QS.length - checked.length) + ' ข้อ)' : '') + (unv ? ' มี ' + unv + ' ข้อที่เฉลยยังไม่ยืนยัน' : '') + '</p>';
  h += '<div class="tablewrap"><table><thead><tr><th>Lecture</th><th>คะแนน</th><th>ข้อที่ควรทบทวน</th></tr></thead><tbody>' + Object.keys(by).sort(function(a,b){ return by[a].s/by[a].n - by[b].s/by[b].n; }).map(function(l){
    var b = by[l]; return '<tr><td>'+esc(lecName(l))+'</td><td>'+(Math.round(b.s*10)/10)+'/'+b.n+'</td><td>'+b.ids.map(function(id){ return '<button class="jump" data-jump="'+esc(id)+'">ข้อ '+esc(qLabel(id))+'</button>'; }).join("")+'</td></tr>';
  }).join("") + '</tbody></table></div>';
  var dq = QS.filter(function(q){ return S.doubts[q.id]; });
  h += '<h2>เฉลยที่ทำเครื่องหมายว่าน่าสงสัย</h2>' + (dq.length
    ? '<p class="lead">'+dq.length+' ข้อ คัดลอกรายการไปวางใน Claude Code เพื่อตรวจเฉลยซ้ำ</p><p>'+dq.map(function(q){ return '<button class="jump" data-jump="'+esc(q.id)+'">ข้อ '+esc(q.n||q.id)+'</button>'; }).join("")+'</p><button class="btn" id="copyDoubt">คัดลอกรายการ</button> <span id="copied" style="color:var(--muted);font-size:.9rem"></span>'
    : '<div class="empty">ยังไม่มี กด "เฉลยข้อนี้น่าสงสัย" ในกล่องคำอธิบายของข้อที่สงสัย</div>');
  if(R && R.ids && R.ids.length) h += '<p class="lead" style="margin-top:14px">โหมดทำซ้ำล่าสุด: ผ่าน '+R.cleared.length+'/'+R.ids.length+' ข้อ ตอบไป '+R.attempts+' ครั้ง</p>';
  h += '<div class="nav" style="flex-wrap:wrap">'+resume+repBtn+'<button class="btn" id="toGuide">ดูหน้าที่ควรอ่านซ่อม</button><button class="btn" id="restart">เริ่มชุดนี้ใหม่</button></div>';
  P.innerHTML = h;
  wireRep();
  $("#toGuide").onclick = function(){ showTab("guide"); };
  if($("#copyDoubt")) $("#copyDoubt").onclick = function(){
    var t = "ตรวจเฉลยซ้ำ set " + (META.set_id||"") + ":\n" + dq.map(function(q){ return "- " + q.id + " (ข้อ " + (q.n||"") + ") เฉลยปัจจุบัน: " + (q.type === "MCQ" ? q.answer : "ดู items"); }).join("\n");
    var done = function(){ $("#copied").textContent = "คัดลอกแล้ว"; };
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(done, function(){ prompt("คัดลอกข้อความนี้", t); });
    else prompt("คัดลอกข้อความนี้", t);
  };
  $("#restart").onclick = resetAll;
}

/* ---------- init ---------- */
function syncControls(){
  document.querySelectorAll(".seg [data-mode]").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.mode === S.mode); });
  $("#filterLecture").value = S.filterLecture; $("#filterStatus").value = S.filterStatus;
}
window.__quiz = { get S(){ return S; }, QMAP: QMAP }; // for automated testing
(function init(){
  document.title = META.title || "CVS Quiz";
  $("#title").textContent = META.title || "CVS Quiz";
  $("#subtitle").textContent = [META.year, META.type, QS.length + " ข้อ"].filter(Boolean).join("  ");
  var ids = {}; QS.forEach(function(q){ lecturesOf(q).forEach(function(l){ ids[l] = 1; }); });
  $("#filterLecture").innerHTML = '<option value="all">ทุก Lecture</option>' + Object.keys(ids).sort().map(function(l){ return '<option value="'+esc(l)+'">'+esc(lecName(l))+'</option>'; }).join("");
  if(!QS.length){ $("#question").innerHTML = '<div class="empty">ไฟล์นี้ยังไม่มีข้อสอบ สร้างใหม่ด้วย build_quiz.py</div>'; return; }
  syncControls(); render();
})();
})();
</script>
