<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVS Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAFB; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6474; --line:#E2E4EA;
  --artery:#B3202E; --artery-soft:#FBEDEE; --vein:#2C5AA0; --vein-soft:#EDF2FA;
  --ok:#1E7A4F; --ok-soft:#E8F4EE; --partial:#A86400; --partial-soft:#FBF2E2;
  --grid:rgba(179,32,46,.08); --grid-strong:rgba(179,32,46,.17);
  --font:"Anuphan","Leelawadee UI","Segoe UI","Noto Sans Thai","Thonburi",system-ui,sans-serif;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141B; --surface:#191E28; --ink:#E7E9EF; --muted:#9AA3B2; --line:#2A303C;
    --artery:#E25562; --artery-soft:#38191E; --vein:#77A2E6; --vein-soft:#1B2538;
    --ok:#4DB886; --ok-soft:#15302A; --partial:#E3A443; --partial-soft:#33281A;
    --grid:rgba(226,85,98,.10); --grid-strong:rgba(226,85,98,.22);
  }
}
:root[data-theme="dark"]{
  --paper:#11141B; --surface:#191E28; --ink:#E7E9EF; --muted:#9AA3B2; --line:#2A303C;
  --artery:#E25562; --artery-soft:#38191E; --vein:#77A2E6; --vein-soft:#1B2538;
  --ok:#4DB886; --ok-soft:#15302A; --partial:#E3A443; --partial-soft:#33281A;
  --grid:rgba(226,85,98,.10); --grid-strong:rgba(226,85,98,.22);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.65;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--vein);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:12px}
.titlebar .sub{display:block}
.resetbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 12px;font-weight:600;font-size:.9rem;color:var(--ink)}
.resetbtn:hover{border-color:var(--artery);color:var(--artery)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:var(--r-md);padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:20;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.titlebar h1{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-.01em}
.hublink{display:inline-block;margin-bottom:2px;font-size:.85rem;color:var(--muted);text-decoration:none}
.hublink:hover{color:var(--ink)}
.titlebar .sub{color:var(--muted);font-size:.88rem}
nav.tabs{display:flex;gap:4px;margin-top:8px}
nav.tabs button{background:none;border:0;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--artery)}

/* question number navigator */
.qnav{display:flex;gap:8px;align-items:flex-start;margin:10px 0 4px}
.qrow{display:flex;gap:6px;overflow-x:auto;flex:1;padding:3px 2px 6px;scrollbar-width:thin}
.qnav.open .qrow{flex-wrap:wrap;overflow:visible;max-height:40vh;overflow-y:auto}
.qc{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem;color:var(--ink)}
.qc.answered{background:var(--line)}
.qc.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qc.wrong{background:var(--artery);border-color:var(--artery);color:#fff}
.qc.partial{background:var(--partial);border-color:var(--partial);color:#fff}
.qc.flag{background:var(--vein);border-color:var(--vein);color:#fff}
.qc.flag-ring{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--vein)}
.qc.cur{outline:2px solid var(--ink);outline-offset:2px}
.qexp{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;padding:0 10px;font-size:.85rem;margin-top:3px}
.qlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);padding-bottom:10px}
.qlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 8px;font-size:.92rem;max-width:100%}
.timer{margin-left:auto;font-weight:600;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:600}
.btn.primary{background:var(--artery);border-color:var(--artery);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.qnum{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.qnum small{font-size:.9rem;color:var(--muted);font-weight:500}
.flag{background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px;font-size:.85rem;color:var(--muted)}
.flag[aria-pressed="true"]{border-color:var(--partial);color:var(--partial);background:var(--partial-soft)}
.stem{margin:10px 0 16px;white-space:normal}
.case{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--vein);border-radius:var(--r-sm);padding:12px 14px;margin:10px 0 18px}
.case .lbl{font-size:.82rem;color:var(--vein);font-weight:600}
figure{margin:12px 0 16px}
.oldkey{margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:.9rem}
.oldkey b{display:block;margin-bottom:4px}
figure img{display:block;width:100%;max-width:760px;height:auto;max-height:75vh;object-fit:contain;object-position:left top;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;cursor:zoom-in}
figure img.zoom{position:fixed;inset:0;margin:auto;width:auto;max-width:96vw;max-height:96vh;object-position:center;border:0;background:transparent;z-index:1000;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(0,0,0,.8)}
figcaption{font-size:.85rem;color:var(--muted)}

.opts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--artery);background:var(--artery-soft)}
.opt.wrong .k{background:var(--artery);border-color:var(--artery);color:#fff}
.opt:disabled{cursor:default}

.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.item .prompt{font-weight:600;margin-bottom:8px}
.item .hint{font-size:.85rem;color:var(--muted);margin-bottom:6px}
textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:8px 10px;resize:vertical}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px}
.checks label.correct{border-color:var(--ok);background:var(--ok-soft)}
.checks label.wrong{border-color:var(--artery);background:var(--artery-soft)}
.verdict{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:.95rem}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--artery-soft)} .verdict.part{background:var(--partial-soft)}
.verdict b{display:block}
.override{display:inline-flex;gap:6px;margin-top:8px}
.override button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:3px 10px;font-size:.85rem}
.override button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.explain{margin-top:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.explain h3{margin:0 0 6px;font-size:1rem}
.disagree{display:inline-block;font-size:.8rem;color:var(--artery);background:var(--artery-soft);padding:1px 8px;border-radius:4px;margin-left:6px}
.unverified{display:inline-block;font-size:.8rem;color:var(--partial);background:var(--partial-soft);padding:1px 8px;border-radius:4px;margin-left:6px}
.refs{margin-top:12px;display:grid;gap:6px}
.ref{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:.93rem}
.ref a{color:var(--vein)}
.hot{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--artery-soft);color:var(--artery);font-weight:600}
.tier{font-size:.78rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:8px 0 4px}
.chain .st{background:var(--vein-soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-weight:600;font-size:.93rem}
.chain .st.ans{background:var(--ok-soft);border-color:var(--ok)}
.chain .ar{color:var(--muted);font-weight:700}
ol.steps{margin:6px 0 0;padding-left:22px;font-size:.93rem}
ol.steps li{margin:2px 0}
.explain h4{margin:14px 0 4px;font-size:.95rem}
.answerline{padding:10px 12px;border-left:4px solid var(--ok,#1a7f4b);background:rgba(26,127,75,.07);border-radius:var(--r-sm)}
.answerline p{margin:0 0 2px}
ul.kc,ol.kc{margin:4px 0;padding-left:1.3em}
ul.kc li,ol.kc li{margin:3px 0}
.trap{margin-top:8px;padding:8px 10px;border-radius:var(--r-sm);background:rgba(217,119,6,.10);border-left:4px solid #d97706}
.trap b{display:block;margin-bottom:2px}
.auditnote{color:var(--muted);font-size:.85rem;margin-top:12px}
.why{display:block;font-size:.85rem;color:var(--muted);margin-top:3px}
.opt.correct .why,.opt.wrong .why{color:var(--ink)}
.doubt{margin-top:12px;border:1px dashed var(--line);background:none;border-radius:var(--r-sm);padding:4px 10px;font-size:.85rem;color:var(--muted)}
.doubt[aria-pressed="true"]{border-style:solid;border-color:var(--partial);color:var(--partial);background:var(--partial-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0 40px}

/* guide + summary */
section.panel h2{font-size:1.25rem;margin:22px 0 6px;letter-spacing:-.01em}
section.panel p.lead{color:var(--muted);margin:0 0 14px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:8px 0 10px}
.bar span{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.read{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px}
.read .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.read .where{font-weight:700;color:var(--ink)}
.read a.where{color:var(--vein)}
.read .meta{font-size:.88rem;color:var(--muted);margin-top:4px}
.jump{border:0;background:var(--vein-soft);color:var(--vein);border-radius:4px;padding:0 7px;margin:2px 3px 0 0;font-size:.85rem}
.tierhead{display:flex;align-items:center;gap:10px;margin:20px 0 8px}
.tierhead .dot{width:10px;height:10px;border-radius:50%}
.tierhead h3{margin:0;font-size:1.02rem}
.repbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--vein-soft);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin:16px 0 4px}
.repbar b{font-size:1rem}
.repbar .rp{color:var(--muted);font-size:.9rem}
.repbar .btn{margin-left:auto;padding:5px 12px;font-size:.88rem}
.meter{flex-basis:100%;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok)}
.qc.again{background:var(--artery-soft);border-color:var(--artery);color:var(--artery)}
.lcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);margin:12px 0;overflow:hidden}
.lcard>.lh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.lcard>.lh .ln{font-weight:700;font-size:1.05rem}
.lcard>.lh .lm{color:var(--muted);font-size:.88rem}
.topic{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.topic .pg{font-weight:700;font-size:.95rem;line-height:1.4}
.topic .pg a{color:var(--vein)}
.topic .pg .td{display:block;margin-top:6px;width:8px;height:8px;border-radius:50%}
.topic .hd{font-weight:600}
.topic .sm{color:var(--muted);font-size:.9rem}
.topic ul.focus{margin:6px 0 2px;padding-left:18px;font-size:.93rem}
.topic ul.focus li{margin:2px 0}
.topic ul.focus .yr{color:var(--muted);font-size:.82rem;margin-left:4px}
.topic.support .hd,.topic.support .pg{color:var(--muted);font-weight:500}
.topic.other{background:var(--paper)}
.subhead{padding:8px 14px;font-size:.82rem;color:var(--muted);background:var(--paper);border-top:1px solid var(--line)}
.big{font-size:2.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-md);padding:14px}
.hidden{display:none!important}
@media (max-width:560px){ body{font-size:16px} .timer{margin-left:0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header>
  <div class="wrap">
    <div class="titlebar"><div><a class="hublink hidden" id="hubLink" href="#">← รวมข้อสอบ</a><h1 id="title">CVS Quiz</h1><span class="sub" id="subtitle"></span></div><button class="resetbtn" id="resetBtn" title="ล้างคำตอบทั้งหมดของชุดนี้"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>รีเซ็ต</button></div>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="quiz">ทำข้อสอบ</button>
      <button role="tab" aria-selected="false" data-tab="guide">Guidereader</button>
      <button role="tab" aria-selected="false" data-tab="summary">สรุปผล</button>
    </nav>
    <div class="qnav" id="qnav"><div class="qrow" id="qrow" aria-label="เลขข้อ"></div><button class="qexp" id="qexp" aria-expanded="false">ดูทั้งหมด</button></div>
    <div class="qlegend"><span><i style="background:var(--ok)"></i>ถูก</span><span><i style="background:var(--artery)"></i>ผิด</span><span><i style="background:var(--partial)"></i>ถูกบางส่วน</span><span><i style="background:var(--vein)"></i>ปักธง</span><span><i style="background:var(--line)"></i>ตอบแล้ว รอตรวจ</span><span id="qdone"></span></div>
  </div>
</header>

<main class="wrap">
  <section id="tab-quiz" class="panel">
    <div id="repbar" class="repbar hidden"></div>
    <div class="toolbar" id="toolbar">
      <div class="seg" role="group" aria-label="โหมด">
        <button data-mode="practice" aria-pressed="true">ฝึก (เฉลยทันที)</button>
        <button data-mode="exam" aria-pressed="false">จับเวลา</button>
      </div>
      <select id="filterLecture" aria-label="กรองตาม Lecture"></select>
      <select id="filterStatus" aria-label="กรองตามสถานะ">
        <option value="all">ทุกข้อ</option>
        <option value="wrong">เฉพาะข้อที่ผิด</option>
        <option value="flagged">เฉพาะข้อที่ปักธง</option>
        <option value="blank">ยังไม่ได้ทำ</option>
      </select>
      <span class="timer" id="timer"></span>
    </div>
    <div id="question"></div>
    <div class="nav">
      <button class="btn" id="prev">ข้อก่อนหน้า</button>
      <button class="btn primary hidden" id="submitAll">ส่งคำตอบทั้งหมด</button>
      <button class="btn" id="next">ข้อถัดไป</button>
    </div>
  </section>

  <section id="tab-guide" class="panel hidden"></section>
  <section id="tab-summary" class="panel hidden"></section>
</main>

", "key_concept": "โจทย์ต้นฉบับขาดข้อมูลสำคัญ ('ตรวจ traceo…') จึงบอกไม่ได้ว่าบาดเจ็บตำแหน่งใด ให้จำ relation ของ superior mediastinum (หน้าไปหลัง): thymus → brachiocephalic veins/SVC → aortic arch + branches → trachea → esophagus + thoracic duct (ซ้ายหลัง)", "explanation": "ต้นฉบับตอบ thoracic duct แต่โจทย์ไม่ครบ ยืนยันคำตอบไม่ได้", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Superior mediastinum relations", "lecture_guess": ["L01"]}}, {"id": "51-MCQ-002", "n": 2, "type": "MCQ", "stem": "เจ็บอกข้างซ้าย ร้าวไปไหล่ขวา nerve ไหน", "options": [{"key": "A", "text": "intercostal nerve", "why": "Intercostal n. ให้ปวดตามแนวซี่โครง ไม่ร้าวไปไหล่"}, {"key": "B", "text": "vagus nerve", "why": "Vagus นำ visceral pain บางส่วนแต่ไม่ร้าวไปไหล่"}, {"key": "C", "text": "phrenic nerve", "why": "ถูก — phrenic n. (C3–C5) รับความรู้สึกจาก pericardium/diaphragm → ปวดร้าว (referred) ไปไหล่ (dermatome C4)"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "Referred pain ไปไหล่ = phrenic nerve (C3, C4, C5) เพราะ pericardium และ diaphragm ส่ง sensory ผ่าน phrenic ซึ่งมาจาก spinal level เดียวกับผิวหนังบริเวณไหล่ (C4) เช่น pericarditis ปวดร้าวไปสันไหล่ (trapezius ridge)", "explanation": "เจ็บอกร้าวไปไหล่ = referred pain ผ่าน phrenic nerve", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Phrenic nerve referred pain", "lecture_guess": ["L01"]}}, {"id": "51-MCQ-003", "n": 3, "type": "MCQ", "stem": "\"20 YOM was stab . Left 4 th ICS from lateral to sternal Sent to ER. What structure injured?", "options": [{"key": "A", "text": "Aortic arch", "why": "Aortic arch อยู่สูงกว่า (ระดับ sternal angle)"}, {"key": "B", "text": "RA", "why": "RA อยู่ขวาของ sternum"}, {"key": "C", "text": "RV", "why": "ถูกตามกายวิภาค — แทงที่ left 4th ICS ชิดขอบ sternum โดน RV ซึ่งเป็นผิวหน้าหลักของหัวใจ"}, {"key": "D", "text": "LA", "why": "LA อยู่หลังสุด"}, {"key": "E", "text": "LV\"", "why": "เฉลยต้นฉบับ (ผู้เฉลยเขียนว่าไม่แน่ใจ) — LV เป็นขอบซ้าย/apex ต้องแทงไกลไปทางซ้ายกว่า"}], "answer": "E", "answer_verified": false, "answer_status": "source_disagree", "explanation_style": "principle", "proposed_answer": "C", "audit_note": "ไฟล์เฉลยวง E (LV) แต่เขียนกำกับว่า 'ไม่แน่ใจ'; ตามกายวิภาค RV อยู่หลัง left 4th ICS parasternal", "key_concept": "• ผิวหน้า (sternocostal surface) ของหัวใจส่วนใหญ่เป็น RV\n• ขอบขวา = RA\n• ขอบซ้าย/apex (5th ICS midclavicular) = LV\n• แผลแทงที่ left 4th ICS ใกล้ sternum จึงโดน RV มากที่สุด", "explanation": "แทงที่ left 4th ICS ชิด sternum → RV (ห้องที่อยู่หน้าสุด)", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Surfaces of the heart", "lecture_guess": ["L01"]}}, {"id": "51-MCQ-004", "n": 4, "type": "MCQ", "stem": "หญิง 55 years Anterior part of esophagus in mid thorax was compressed ถามว่าอะไรที่มา compress", "options": [{"key": "A", "text": "Right atrium", "why": "RA อยู่ขวา ไม่ติด esophagus"}, {"key": "B", "text": "Right ventricle", "why": "RV อยู่หน้าสุด"}, {"key": "C", "text": "Left atrium", "why": "ถูก — LA อยู่หลังสุด ติดหน้า esophagus"}, {"key": "D", "text": "Left ventricle", "why": "LV อยู่ซ้ายล่าง"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "LA เป็นห้องหลังสุดของหัวใจ ชิด esophagus โดยตรง LA โต (เช่น mitral stenosis) จึงกด esophagus ได้", "explanation": "Esophagus ส่วนกลางอกถูกกดจากด้านหน้า = LA (ข้อนี้ออกซ้ำใน 52_MCQ ข้อ 8)", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Posterior relations of the heart", "lecture_guess": ["L01"]}}, {"id": "51-MCQ-006", "n": 6, "type": "MCQ", "stem": "A tumor on the 9th thoracic vertebrae exerts pressure anterolaterally. Which of the following should be compressed", "options": [{"key": "A", "text": "Phrenic nerve", "why": "Phrenic อยู่ข้าง pericardium"}, {"key": "B", "text": "Vagus nerve", "why": "Vagus อยู่ข้าง esophagus"}, {"key": "C", "text": "Sympathetic trunk", "why": "Sympathetic trunk อยู่บนหัว rib ด้านข้าง ห่างจาก anterolateral surface ของ vertebral body มากกว่า"}, {"key": "D", "text": "Greater splanchnic nerve", "why": "ถูก — greater splanchnic n. (T5–T9) วิ่งบน anterolateral surface ของ vertebral body"}, {"key": "E", "text": "The 9th intercostal nerve", "why": "9th intercostal n. ออกทาง foramen ด้านหลัง-ข้าง"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• ก้อนที่กดไปทาง anterolateral ของ vertebral body ระดับ T5–T9 ชนกับ greater splanchnic nerve\n• ถ้ากดไปทาง posterolateral (foramen) จะโดน spinal/intercostal nerve (เทียบ 52_MCQ ข้อ 5)", "explanation": "Anterolateral ของ T9 = greater splanchnic nerve", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Posterior mediastinum nerves", "lecture_guess": ["L01"]}}, {"id": "51-MCQ-007", "n": 7, "type": "MCQ", "stem": "A 50-year-old man come to the physician because of dyspnea for 3 months, cardiac examination demonstrated systolic ejection murmur at the right 2nd intercostal space, radiating to right common carotid artery. มีรอยโรคที่ไหน", "options": [{"key": "A", "text": "Aortic valve", "why": "ถูก — systolic ejection murmur ที่ right 2nd ICS ร้าวไป carotid = aortic stenosis"}, {"key": "B", "text": "Pulmonary valve", "why": "Pulmonic area = left 2nd ICS ไม่ร้าวไป carotid"}, {"key": "C", "text": "Tricuspid valve", "why": "Tricuspid = LLSB"}, {"key": "D", "text": "Mitral valve", "why": "Mitral = apex ร้าวไป axilla"}, {"key": "E", "text": "Interventricular septum", "why": "VSD = holosystolic ที่ LLSB"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Aortic stenosis: crescendo–decrescendo systolic ejection murmur ที่ right 2nd ICS ร้าวไป carotid\n• อาการ triad = angina, syncope, dyspnea (HF)", "explanation": "Ejection murmur right 2nd ICS ร้าวไป carotid = aortic valve (AS)", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "Murmurs: aortic stenosis", "lecture_guess": ["L01", "L04"]}}, {"id": "51-MCQ-009", "n": 9, "type": "MCQ", "stem": "biopsy found TI: thin TA: bundles of smooth muscle cells collagenous adventitia is well develop what is this vessel", "options": [{"key": "A", "text": "Portal vein", "why": "เสนอ — large vein: intima บาง, adventitia หนามี longitudinal smooth muscle bundles + collagen (portal vein เป็นตัวอย่างคลาสสิก)"}, {"key": "B", "text": "Ulnar artery", "why": "Ulnar artery = muscular artery media หนา"}, {"key": "C", "text": "Internal jugular vein", "why": "IJV ก็เป็น large vein ได้ แต่ portal vein เป็นตัวอย่างที่ตำราใช้"}, {"key": "D", "text": "Radial vein", "why": "เฉลยต้นฉบับ — radial vein เป็น medium vein ไม่มี smooth muscle bundles ใน adventitia"}, {"key": "E", "text": "Intercostal artery", "why": "Intercostal artery = muscular artery"}], "answer": "D", "answer_verified": false, "answer_status": "source_disagree", "explanation_style": "principle", "proposed_answer": "A", "audit_note": "ผู้เฉลยตีความ TA เป็น tunica media แล้วตัด large vein ออก แต่โจทย์บรรยาย adventitia ที่มี smooth muscle bundles ซึ่งเป็นลักษณะของ large vein (ตรงกับ 52_MCQ ข้อ 11 ที่ตอบ portal vein)", "key_concept": "• อ่าน 'TA' ให้ถูก: ถ้าหมายถึง tunica adventitia ที่มี bundles of smooth muscle (longitudinal) + collagen หนา = ลักษณะเฉพาะของ large vein (IVC, portal vein, SVC)\n• Medium vein (radial, brachial) มี media บาง adventitia ปกติ ไม่มี longitudinal bundles\nTrap: artery = media หนาสุด, vein = adventitia หนาสุด", "explanation": "Smooth muscle bundles ใน adventitia ที่หนา = large vein (portal vein)", "refs": [], "tags": {"discipline": "anatomy", "bloom": "understand", "topic": "Histology of large veins", "lecture_guess": ["L06"]}}, {"id": "51-MCQ-011", "n": 11, "type": "MCQ", "stem": "brachial aorta pressure เพิ่ม, femoral pressure ลด, femoral pulse ลด ถามว่า embryonic structure ใดที่ undevolop", "options": [{"key": "A", "text": "aorta duct", "why": "เฉลยต้นฉบับ (ผู้เฉลยเขียนว่าไม่แน่ใจ) — ductus arteriosus มาจาก left 6th arch และ coarctation มักอยู่ใกล้ ductus แต่ตัวที่ 'พัฒนาไม่สมบูรณ์' คือส่วนของ aortic arch"}, {"key": "B", "text": "3th aortic arch", "why": "3rd arch → common/internal carotid"}, {"key": "C", "text": "4th aortic arch", "why": "เสนอ — left 4th arch สร้าง aortic arch ส่วน isthmus; coarctation = ส่วนนี้ตีบ"}, {"key": "D", "text": "6th aortic arch", "why": "6th arch → pulmonary arteries + ductus arteriosus"}, {"key": "E", "text": "7th aortic arch", "why": "7th intersegmental artery → subclavian (ไม่ใช่ pharyngeal arch)"}], "answer": "A", "answer_verified": false, "answer_status": "source_disagree", "explanation_style": "principle", "proposed_answer": "C", "audit_note": "ผู้เฉลยวง A แต่เขียน '(ductus arteriosus)? ไม่แน่ใจ' — ductus มาจาก 6th arch และไม่ใช่โครงสร้างที่ undeveloped ใน coarctation; ความมั่นใจปานกลาง", "key_concept": "• อาการ BP แขนสูง ขาต่ำ femoral pulse เบา = coarctation of aorta (ตีบที่ isthmus ใกล้ ductus arteriosus)\n• Aortic arch derivatives:\n• 3rd = carotid\n• left 4th = arch of aorta (right 4th = proximal right subclavian)\n• 6th = pulmonary arteries + ductus (left)\n• Coarctation จึงสัมพันธ์กับ left 4th arch ที่พัฒนาไม่สมบูรณ์", "explanation": "Coarctation of aorta = aortic arch ส่วนที่มาจาก left 4th aortic arch ตีบ", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Aortic arch derivatives & coarctation", "lecture_guess": ["L05", "L11"]}}, {"id": "51-MCQ-013", "n": 13, "type": "MCQ", "stem": "เด็กสามขวบ CXR หัวใจอยู่ที่ right hemithoracic apexชี้ไปทางขวา ผิดปกติจากอะไร", "options": [{"key": "A", "text": "Bulboventricular loop", "why": "ถูก — bulboventricular (cardiac) looping ผิดปกติ → dextrocardia"}, {"key": "B", "text": "Ventricle formation", "why": "Ventricle formation ผิดปกติไม่ทำให้หัวใจย้ายข้าง"}, {"key": "C", "text": "Heart tube bend ไปทาง ventral", "why": "Ventral bending/folding ผิดปกติ → ectopia cordis"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Heart tube ต้องโค้งไปทางขวา (D-loop) apex จึงชี้ซ้าย\n• looping ผิดปกติ → หัวใจอยู่ขวา apex ชี้ขวา (dextrocardia) (ออกซ้ำใน 52_MCQ ข้อ 13)", "explanation": "Apex ชี้ขวา = bulboventricular looping ผิดปกติ", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Cardiac looping & dextrocardia", "lecture_guess": ["L05", "L11"]}}, {"id": "51-MCQ-014", "n": 14, "type": "MCQ", "stem": "\"A 50-years-old man is diagnosed with erectile dysfunction. Sildenafil (Viagra) is prescribed to him for relieved his symptom. Which of the following vasoactive mediators would primarily be increased in this patient?", "options": [{"key": "A", "text": "Histamine", "why": "Histamine ไม่เกี่ยว"}, {"key": "B", "text": "Nitric oxide", "why": "ถูก — sildenafil เสริมฤทธิ์ NO/cGMP pathway (ยับยั้ง PDE5) → vasodilation"}, {"key": "C", "text": "Endothelin-1", "why": "Endothelin-1 เป็น vasoconstrictor"}, {"key": "D", "text": "Atrial natriuretic peptide", "why": "ANP ไม่เกี่ยว"}, {"key": "E", "text": "Prostacyclin\"", "why": "Prostacyclin ไม่ใช่กลไกของ sildenafil"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Sexual stimulation → NO release", "Guanylyl cyclase → cGMP ↑", {"s": "Sildenafil ยับยั้ง PDE5 → cGMP ไม่ถูกสลาย", "answer": true}, "Smooth muscle relaxation → vasodilation (corpus cavernosum)"], "key_concept": "จริงๆ sildenafil ไม่ได้เพิ่ม NO โดยตรง แต่ทำให้ผลของ NO (cGMP) อยู่นานขึ้น ในตัวเลือกที่ให้มา NO pathway จึงเป็นคำตอบที่ดีที่สุด", "explanation": "Sildenafil ออกฤทธิ์ผ่าน NO–cGMP pathway", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "understand", "topic": "PDE5 inhibitor & NO pathway", "lecture_guess": ["L08"]}}, {"id": "51-MCQ-015", "n": 15, "type": "MCQ", "stem": "subject has neck tumor, partially compressing common carotid artery. What would be acute response?", "options": [{"key": "A", "text": "Decrease heat rate", "why": "ผิด — HR จะเพิ่ม"}, {"key": "B", "text": "Decrease cardiac contractility", "why": "ผิด — contractility เพิ่ม"}, {"key": "C", "text": "Increase parasympathetic activity", "why": "ผิด — parasympathetic ลด"}, {"key": "D", "text": "Increase total peripheral resistance", "why": "ถูก — sympathetic ↑ → arteriolar constriction → TPR ↑"}, {"key": "E", "text": "Increase baroreceptor depolarization", "why": "ผิด — baroreceptor firing ลด"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["ก้อนกด common carotid (ต่ำกว่า sinus)", "Pressure ที่ carotid sinus ↓", "Baroreceptor firing ↓", "Sympathetic ↑ / parasympathetic ↓", {"s": "TPR ↑ (+ HR ↑, contractility ↑)", "answer": true}], "key_concept": "กด common carotid = sinus เห็นความดันต่ำ → reflex เพิ่ม BP (ต่างจาก carotid sinus massage ที่กดตรง sinus → HR ลด) (ออกซ้ำใน 52_MCQ ข้อ 18)", "explanation": "กด common carotid → baroreceptor firing ลด → sympathetic เพิ่ม TPR", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "Baroreceptor reflex", "lecture_guess": ["L10"]}}, {"id": "51-MCQ-018", "n": 18, "type": "MCQ", "stem": "หายใจเข้าลึก Heart rate สูงขึ้น ตอบสนองของ reflex ใด", "options": [{"key": "A", "text": "Baroreceptor", "why": "Baroreceptor ทำให้ HR ลดเมื่อ BP สูง ไม่ใช่กลไกหลักของ HR ↑ ตอนหายใจเข้า"}, {"key": "B", "text": "Chemoreceptor", "why": "Chemoreceptor ตอบสนองต่อ O₂/CO₂ ไม่ใช่การหายใจเข้าธรรมดา"}, {"key": "C", "text": "Bainbridge reflex", "why": "ถูก — หายใจเข้า → venous return ↑ → RA ยืด → Bainbridge reflex → HR ↑"}], "answer": "C", "answer_verified": false, "answer_status": "drafted", "explanation_style": "sequence", "audit_note": "หน้าเฉลยของข้อ 16–47 หายจากไฟล์ (เหลือสไลด์ 'Respiratory arrhythmia' ประกอบ) — ร่างเฉลยเอง", "mechanism": ["หายใจเข้าลึก → intrathoracic pressure ↓", "Venous return เข้า RA ↑", {"s": "Atrial stretch receptors ↑", "note": "Bainbridge (atrial) reflex"}, "Vagal tone ↓ / sympathetic ↑", {"s": "HR ↑ (respiratory sinus arrhythmia)", "answer": true}], "key_concept": "• Respiratory sinus arrhythmia: HR เร็วขึ้นตอนหายใจเข้า ช้าลงตอนหายใจออก (ปกติในเด็กและคนหนุ่มสาว)\n• กลไกหลักคือ vagal tone ลดลงช่วงหายใจเข้า ร่วมกับ Bainbridge reflex จาก venous return ที่เพิ่ม", "explanation": "หายใจเข้าแล้ว HR เพิ่ม = Bainbridge reflex (respiratory sinus arrhythmia)", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Respiratory sinus arrhythmia / Bainbridge reflex", "lecture_guess": ["L10"]}}, {"id": "51-MCQ-019", "n": 19, "type": "MCQ", "stem": "A man’s house on fire , lift heavy thing which will happen during this condition", "options": [{"key": "A", "text": "Decrease heart rate", "why": "HR จะเพิ่ม (fight-or-flight)"}, {"key": "B", "text": "Decrease vasomotor to the muscle", "why": "ถูก — vasoconstrictor (vasomotor) tone ต่อกล้ามเนื้อลดลง → muscle vasodilation รับเลือดมากขึ้น"}, {"key": "C", "text": "Decrease venomotor to the internal organs", "why": "Venomotor tone ต่ออวัยวะภายในจะเพิ่ม (ดันเลือดกลับหัวใจ)"}, {"key": "D", "text": "Increase blood flow to kidney", "why": "Renal flow ลดลง"}, {"key": "E", "text": "Increase parasympathetic tone", "why": "Parasympathetic ลดลง"}], "answer": "B", "answer_verified": false, "answer_status": "drafted", "explanation_style": "sequence", "audit_note": "หน้าเฉลยหาย — ร่างเฉลยเอง", "mechanism": ["ไฟไหม้ + ยกของหนัก (stress + exercise)", "Sympathetic activation (fight-or-flight)", "HR ↑, contractility ↑, venoconstriction ในอวัยวะภายใน", {"s": "กล้ามเนื้อลาย: vasoconstrictor tone ↓ + metabolic vasodilation", "answer": true}, "เลือดไปกล้ามเนื้อมากขึ้น"], "key_concept": "Fight-or-flight: เลือดถูก redistribute จาก splanchnic/ไต/ผิวหนัง (vasoconstriction) ไปยังกล้ามเนื้อลาย (vasodilation จาก metabolites + β2/sympathetic cholinergic)", "explanation": "ยกของหนักตอนตกใจ → เลือดไปกล้ามเนื้อมากขึ้น (vasomotor tone ต่อกล้ามเนื้อลดลง)", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "Sympathetic redistribution of blood flow", "lecture_guess": ["L10", "L17"]}}, {"id": "51-MCQ-020", "n": 20, "type": "MCQ", "stem": "At the resting stage, which of the following organs has the highest blood flow?", "options": [{"key": "A", "text": "Skin", "why": "Skin ~4% ของ CO"}, {"key": "B", "text": "Liver", "why": "ถูก (ปริมาณรวม) — liver + GI (splanchnic) ได้ ~25–27% ของ CO มากที่สุด"}, {"key": "C", "text": "Brain", "why": "Brain ~14% (~750 mL/min)"}, {"key": "D", "text": "Kidneys", "why": "Kidneys ~20–22% (~1,100 mL/min) และสูงสุดเมื่อคิดต่อน้ำหนัก (400 mL/min/100 g)"}, {"key": "E", "text": "Heart muscle", "why": "Heart ~4–5%"}], "answer": "B", "answer_verified": false, "answer_status": "drafted", "explanation_style": "principle", "audit_note": "หน้าเฉลยหาย เหลือตาราง blood flow ที่ผู้เฉลยวงไว้ทั้ง liver/GI (23%) และ kidney (400 mL/min/100 g) — ร่างเป็น liver", "key_concept": "• Resting cardiac output distribution (ตาราง Guyton): splanchnic/liver ~27%, kidneys ~22%, muscle ~15–20%, brain ~14%, heart ~4%, skin ~6%\n• ถ้าถาม 'ต่อ 100 g tissue' คำตอบคือ kidney (สูงสุด) ตามด้วย heart\nTrap: ต้องดูว่าถาม total flow หรือ flow per weight", "explanation": "Blood flow รวมขณะพักสูงสุด = liver/splanchnic (ถ้าต่อน้ำหนัก = kidney)", "refs": [], "tags": {"discipline": "physiology", "bloom": "recall", "topic": "Distribution of cardiac output", "lecture_guess": ["L15"]}}, {"id": "51-MCQ-030", "n": 30, "type": "MCQ", "stem": "หน้าที่ของ atrial systole during physical activity", "options": [{"key": "A", "text": "rapid ventricular filling", "why": "Rapid filling เกิดต้น diastole (passive)"}, {"key": "B", "text": "ventricle systole", "why": "Atrial systole เกิดก่อน ventricular systole"}, {"key": "C", "text": "เกิดช่วง QRS complex", "why": "Atrial systole ตรงกับ P wave ไม่ใช่ QRS"}, {"key": "D", "text": "majority ventricular filling", "why": "การเติมส่วนใหญ่ (70–80%) เป็น passive"}, {"key": "E", "text": "final 20-30 % ventricular filling", "why": "ถูก — atrial kick เติม 20–30% สุดท้ายของ ventricular filling (สำคัญขึ้นเมื่อ HR เร็วตอนออกกำลังกาย)"}], "answer": "E", "answer_verified": false, "answer_status": "drafted", "explanation_style": "principle", "audit_note": "หน้าเฉลยหาย เหลือสไลด์ 'Atrial systole: atrial kick 20–30%' — ร่างเฉลยเอง", "key_concept": "• Atrial systole (หลัง P wave) เติมเลือด 20–30% สุดท้ายก่อน ventricle บีบ\n• ขณะออกกำลังกาย HR เร็ว diastole สั้น atrial kick จึงสำคัญขึ้น (ออกซ้ำใน 52_MCQ ข้อ 28)", "explanation": "Atrial systole = final 20–30% ของ ventricular filling", "refs": [], "tags": {"discipline": "physiology", "bloom": "recall", "topic": "Atrial kick", "lecture_guess": ["L04"]}}, {"id": "51-MCQ-033", "n": 33, "type": "MCQ", "stem": "หญิงมาด้วยอาการ shortness of breath, fatigue,swelling at her legs. สิ่งใดที่ทำให้ cardiac output ของผู้หญิงคนนี้ลดลง", "options": [{"key": "A", "text": "increase preload from fluid retention", "why": "Preload ↑ จะเพิ่ม CO ตาม Frank–Starling (ใน HF ช่วยน้อยแต่ไม่ได้ทำให้ CO ลด)"}, {"key": "B", "text": "increase afterload from hyper tension", "why": "ถูก — afterload ↑ จาก hypertension → ventricle บีบออกยาก SV ↓ → CO ↓"}], "answer": "B", "answer_verified": false, "answer_status": "drafted", "explanation_style": "sequence", "audit_note": "หน้าเฉลยหาย — ร่างเฉลยเอง", "mechanism": ["Hypertension → afterload ↑", "Ventricle ต้องสร้าง pressure สูงขึ้นก่อน aortic valve เปิด", "ESV ↑", {"s": "SV ↓ → CO ↓", "answer": true}, "Fluid retention + edema (HF)"], "key_concept": "• CO = SV × HR\n• SV ขึ้นกับ preload (↑ SV), afterload (↑ → SV ↓) และ contractility\n• Failing heart ไวต่อ afterload มาก ยาลด afterload (ACEi, vasodilator) จึงเพิ่ม CO ได้", "explanation": "Afterload ที่เพิ่มจาก hypertension ทำให้ CO ลด", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "Determinants of cardiac output", "lecture_guess": ["L04", "CC4"]}}, {"id": "51-MCQ-036", "n": 36, "type": "MCQ", "stem": "Which of the following is sufficient for a diagnosis of Q-wave infarction?", "options": [{"key": "A", "text": "Longer than normal duration of Q-wave in lead lll and aVR", "why": "Q ที่ aVR ปกติลึกอยู่แล้ว"}, {"key": "B", "text": "No Q-wave in lead V1 and V2", "why": "การไม่มี Q ใน V1–V2 เป็นปกติ"}, {"key": "C", "text": "Amplitude of Q-wave is 25% higher of the R wave in lead aVF and lll", "why": "ถูก — Q ลึก ≥ 25% ของ R ใน leads ที่ติดกัน (aVF + III) = pathological Q"}, {"key": "D", "text": "Large isolated Q-wave in lead lll with its amplitude varies with respiration", "why": "Q เดี่ยวใน III ที่เปลี่ยนตามการหายใจ = ปกติ (positional)"}, {"key": "E", "text": "Small Q-wave in lead V5 and V6", "why": "Q เล็กใน V5–V6 = septal Q ปกติ"}], "answer": "C", "answer_verified": false, "answer_status": "drafted", "explanation_style": "principle", "audit_note": "โจทย์ต้นฉบับพิมพ์ 'Q-wave infection' (หมายถึง infarction); หน้าเฉลยหายเหลือสไลด์ pathological Q-wave — ร่างเฉลยเอง", "key_concept": "• Pathological Q wave: กว้าง > 0.03–0.04 s และ/หรือลึก > 25% ของ R wave ใน ≥ 2 leads ที่ติดกัน (เช่น II, III, aVF) — บ่งบอก transmural (old) MI\n• Q เล็กใน I, aVL, V5–V6 เป็น septal depolarization ปกติ", "explanation": "Q ลึก ≥ 25% ของ R ใน III + aVF = pathological Q (Q-wave infarction)", "refs": [], "tags": {"discipline": "clinical", "bloom": "understand", "topic": "Pathological Q wave", "lecture_guess": ["L03", "CC2"]}}, {"id": "51-MCQ-037", "n": 37, "type": "MCQ", "stem": "จาก ECG เกิด infarction ที่ wall ส่วนไหน", "options": [{"key": "A", "text": "Anterior", "why": "Anterior = V1–V4"}, {"key": "B", "text": "Inferior", "why": "ถูก — ST elevation ใน II, III, aVF = inferior wall (มักเป็น RCA)"}, {"key": "C", "text": "Posterior", "why": "Posterior = ST depression ใน V1–V3 (mirror)"}, {"key": "D", "text": "Lateral", "why": "Lateral = I, aVL, V5–V6 (ในภาพเป็น reciprocal depression)"}], "answer": "B", "answer_verified": false, "answer_status": "drafted", "explanation_style": "principle", "audit_note": "หน้าเฉลยหาย — ร่างจาก ECG ในโจทย์", ่างเฉลยเอง", "key_concept": "ลำดับ ventricular depolarization: (1) septum ซ้าย → ขวา (septal q ใน V5–V6) (2) apex/free wall ของ LV (R สูงใน V5–V6) (3) posterobasal ventricle (S wave เล็กใน V5–V6)", "explanation": "S wave ใน V5 = depolarization ช่วงท้ายของ basal ventricle", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Sequence of ventricular depolarization", "lecture_guess": ["L02", "L03"]}}, {"id": "51-MCQ-048", "n": 48, "type": "MCQ", "stem": "What is increase in lung volume during exercise?", "options": [{"key": "A", "text": "Tidal volume", "why": "ถูก — tidal volume เพิ่มขึ้น"}, {"key": "B", "text": "Residual volume", "why": "RV แทบไม่เปลี่ยน"}, {"key": "C", "text": "Total lung capacity", "why": "TLC คงที่"}, {"key": "D", "text": "Expiratory reserve volume", "why": "ERV ลดลง (TV ขยายลงมา)"}, {"key": "E", "text": "Inspiration reserve volume", "why": "IRV ลดลง (TV ขยายขึ้นไป)"}], "answer": "A", "answer_verified": false, "answer_status": "drafted", "explanation_style": "principle", "audit_note": "ไฟล์เฉลยไม่มีเครื่องหมายที่ข้อนี้ — ร่างเฉลยเอง (สอดคล้องกับเฉลย 52_MCQ ข้อ 46)", "key_concept": "• ออกกำลังกาย: VE = TV × RR เพิ่มจาก TV ก่อน แล้วจึงเพิ่ม RR\n• TLC คงที่ TV จึงกินพื้นที่ IRV และ ERV (ข้อนี้ออกซ้ำทุกคำใน 52_MCQ ข้อ 46)", "explanation": "ปริมาตรปอดที่เพิ่มขณะออกกำลังกาย = tidal volume", "refs": [], "tags": {"discipline": "physiology", "bloom": "recall", "topic": "Ventilation during exercise", "lecture_guess": ["L17"]}}, {"id": "51-MCQ-050", "n": 50, "type": "MCQ", "stem": "In an unconscious person, passive movement of the limbs increases ventilation. Which receptors are mainly responsible?", "options": [{"key": "A", "text": "corticol reactive", "why": "Central command ต้องมีการสั่งการโดยสมัครใจ คนหมดสติไม่มี"}, {"key": "B", "text": "Propioreceptor", "why": "ถูก — proprioceptors (muscle spindle, joint receptors) ส่งสัญญาณจากการเคลื่อนไหวของแขนขาไปเพิ่มการหายใจ"}, {"key": "C", "text": "Chemoreceptors", "why": "Chemoreceptor ตอบสนองช้า blood gas ยังไม่เปลี่ยน"}, {"key": "D", "text": "peripheral receptor", "why": "Peripheral chemoreceptor เช่นเดียวกัน"}, {"key": "E", "text": "baroreceptors", "why": "Baroreceptor ไม่ได้กระตุ้นการหายใจในกรณีนี้"}], "answer": "B", "answer_verified": false, "answer_status": "drafted", "explanation_style": "principle", "audit_note": "ไฟล์เฉลยไม่มีเครื่องหมายที่ข้อนี้ — ร่างเฉลยเอง; ปรับคำโจทย์ให้อ่านง่ายจากต้นฉบับ 'major reaction increase ventilation in muscle movement of unconscious person'", "key_concept": "การหายใจที่เพิ่มทันทีตอนเริ่มเคลื่อนไหวมาจาก (1) central command (ต้องรู้สึกตัว) และ (2) feed-forward จาก proprioceptors ในกล้ามเนื้อ/ข้อ — ขยับแขนขาให้คนหมดสติ (passive movement) ventilation ยังเพิ่มได้ แสดงว่าเป็นผลของ proprioceptors", "explanation": "ขยับแขนขาคนหมดสติแล้วหายใจเพิ่ม = proprioceptor reflex", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Control of ventilation in exercise", "lecture_guess": ["L17"]}}, {"id": "51-MCQ-052", "n": 52, "type": "MCQ", "stem": "what is the main factor of respiratory compensation at the peak of oxygen ventilatory equation", "options": [{"key": "A", "text": "temperature", "why": "อุณหภูมิมีผลน้อย ไม่ใช่ปัจจัยหลัก"}, {"key": "B", "text": "proprioceptor", "why": "Proprioceptor สำคัญช่วงเริ่มออกกำลังกาย"}, {"key": "C", "text": "oxygen demand", "why": "O₂ demand เพิ่มเป็นสัดส่วนกับ ventilation ช่วงต้น"}, {"key": "D", "text": "physiological demand", "why": "กว้างเกินไป"}, {"key": "E", "text": "blood lactate accumulation", "why": "ถูก — blood lactate สะสม → H⁺ ↑ → กระตุ้น chemoreceptor → respiratory compensation"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["ออกกำลังกายหนักเกิน lactate threshold", "Anaerobic metabolism → lactate + H⁺ ↑", {"s": "Blood lactate accumulation / metabolic acidosis", "answer": true}, "H⁺ + HCO₃⁻ → CO₂ + H₂O", "Carotid body กระตุ้น → hyperventilation (respiratory compensation)"], "key_concept": "หลัง lactate/ventilatory threshold ventilation เพิ่มมากกว่า VO₂ (VE/VO₂ ↑) เพื่อชดเชย metabolic acidosis จาก lactate", "explanation": "Respiratory compensation ช่วงออกกำลังกายหนัก = blood lactate accumulation", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Respiratory compensation in exercise", "lecture_guess": ["L17"]}}, {"id": "51-MCQ-053", "n": 53, "type": "MCQ", "stem": "Which of the following activity increases systolic blood pressure the most?", "options": [{"key": "A", "text": "Canoeing", "why": "Dynamic ระดับปานกลาง"}, {"key": "B", "text": "Walking", "why": "Dynamic ระดับต่ำ"}, {"key": "C", "text": "Swimming", "why": "Dynamic"}, {"key": "D", "text": "Two arm curl with heavy load", "why": "Static แต่มวลกล้ามเนื้อแขนเล็ก"}, {"key": "E", "text": "Two leg curl with heavy load", "why": "ถูก — static/resistance + มวลกล้ามเนื้อขาใหญ่ + น้ำหนักมาก → SBP เพิ่มมากสุด"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "SBP เพิ่มมากเมื่อ (1) มวลกล้ามเนื้อที่ใช้มาก (ขา > แขน) (2) เป็น isometric/high resistance → หลอดเลือดในกล้ามเนื้อถูกบีบ afterload ↑ (3) Valsalva ขณะยกของหนัก → intrathoracic pressure ↑ (ออกซ้ำใน 52_MCQ ข้อ 44)", "explanation": "Two-leg heavy load (static, มวลกล้ามเนื้อใหญ่) เพิ่ม SBP มากที่สุด", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "Static vs dynamic exercise", "lecture_guess": ["L17"]}}, {"id": "51-MCQ-057", "n": 57, "type": "MCQ", "stem": "37 YOM palpitation and sweating. Atrial rate 250beat/min. Vetricular rate 125 b/m. Which drug control ventricular rate?", "options": [{"key": "A", "text": "Digitalis", "why": "Digitalis ชะลอ AV node ได้แต่ช้าและไม่ใช่ first-line ในคนไม่มี HF"}, {"key": "B", "text": "Amiodarone", "why": "Amiodarone ใช้ rhythm control/โรคหัวใจโครงสร้าง ไม่ใช่ตัวเลือกแรกของ rate control"}, {"key": "C", "text": "Propanolol", "why": "ถูก — β-blocker ชะลอ AV node conduction ลด ventricular rate (first-line)"}, {"key": "D", "text": "Procainamide", "why": "Procainamide ไม่ใช้ rate control (อาจเพิ่ม ventricular rate ได้)"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Atrial rate 250 + ventricular rate 125 = atrial flutter with 2:1 AV block\n• Rate control: β-blocker (metoprolol, esmolol, propranolol) หรือ non-DHP CCB (diltiazem, verapamil) ที่ชะลอ AV node\n• digoxin เป็นทางเลือกเสริมใน HF", "explanation": "Atrial flutter 2:1 → rate control ด้วย β-blocker (propranolol)", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Rate control in atrial flutter", "lecture_guess": ["L09"]}}, {"id": "51-MCQ-060", "n": 60, "type": "MCQ", "stem": "65-year-old man with history of angioedema 1 year ago, come with bp 155/90, which drug is the most appropriate used in this patient", "options": [{"key": "A", "text": "minoxidil", "why": "Minoxidil ไม่ใช่ first-line (reflex tachycardia, fluid retention, hirsutism)"}, {"key": "B", "text": "captopril", "why": "ห้าม — ACE inhibitor ในผู้มีประวัติ angioedema"}, {"key": "C", "text": "Verapamil", "why": "Verapamil ไม่ใช่ first-line ทั่วไป"}, {"key": "D", "text": "Propanolol", "why": "β-blocker ไม่ใช่ first-line ถ้าไม่มี compelling indication"}, {"key": "E", "text": "Hydrochlorothiazide", "why": "ถูก — thiazide เป็น first-line และปลอดภัยในประวัติ angioedema"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• ACE inhibitor (และควรระวัง ARB) ห้ามในผู้มีประวัติ angioedema เพราะ bradykinin สะสม\n• first-line HTN = thiazide, CCB, ACEi/ARB", "explanation": "มีประวัติ angioedema → หลีกเลี่ยง ACEi → เลือก HCTZ", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "ACE inhibitor contraindications", "lecture_guess": ["L13"]}}, {"id": "51-MCQ-061", "n": 61, "type": "MCQ", "stem": "61 year old man, suffering from hypertension had been taking hydrochlorothiazide for two months, but the treatment failed to completely control. His hypertension, which of the following drug drugs is suitable to add to his treatment.", "options": [{"key": "A", "text": "Atenolol", "why": "β-blocker ไม่ใช่ add-on ลำดับแรกถ้าไม่มี compelling indication"}, {"key": "B", "text": "Prazosin", "why": "α-blocker เป็นยาลำดับหลัง"}, {"key": "C", "text": "Enarlaphril", "why": "ถูก — ACE inhibitor + thiazide เป็น combination มาตรฐาน (ACEi ลด hypokalemia จาก thiazide)"}, {"key": "D", "text": "Verapamil.", "why": "Verapamil ใช้ได้น้อยกว่า DHP-CCB"}, {"key": "E", "text": "Hydralazine", "why": "Hydralazine ไม่ใช่ add-on ลำดับแรก"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Thiazide คุม BP ไม่ได้ → เพิ่มยา first-line อีกกลุ่ม (ACEi/ARB หรือ CCB)\n• ACEi + thiazide เสริมกัน: thiazide กระตุ้น RAAS ส่วน ACEi ยับยั้ง RAAS และลดการเสีย K⁺", "explanation": "Thiazide ไม่พอ → เพิ่ม ACE inhibitor (enalapril)", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Antihypertensive combination", "lecture_guess": ["L13"]}}, {"id": "51-MCQ-063", "n": 63, "type": "MCQ", "stem": "ยาที่ใช้กับ isolated systolic hypertension", "options": [{"key": "A", "text": "Captopril", "why": "ACEi ใช้ได้ แต่หลักฐานใน ISH ผู้สูงอายุน้อยกว่า"}, {"key": "B", "text": "HCTZ", "why": "เฉลยต้นฉบับ — thiazide เป็น first-line ใน ISH ผู้สูงอายุ"}, {"key": "C", "text": "CCB สักตัว จำไม่ได้", "why": "CCB (DHP) ก็เป็น first-line ใน ISH เช่นกัน (ต้นฉบับจำชื่อยาไม่ได้)"}], "answer": "B", "answer_verified": false, "answer_status": "source_unverified", "explanation_style": "principle", "key_concept": "• Isolated systolic HTN (SBP ≥ 140, DBP < 90) ในผู้สูงอายุเกิดจาก arterial stiffness\n• ยาที่มีหลักฐานดีที่สุดคือ thiazide-like diuretic และ long-acting DHP-CCB (52_MCQ ข้อ 63 ตอบ amlodipine)", "explanation": "ISH ในผู้สูงอายุ: thiazide หรือ DHP-CCB", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Isolated systolic hypertension", "lecture_guess": ["L13"]}}, {"id": "51-MCQ-064", "n": 64, "type": "MCQ", "stem": "A 58-year-old man was diagnosed with hypertension (156/96 mmHg). Past history of this patient was diagnosed with exertion angina and started treatment with nitroglycerine. Which of the following drug classes would be the most appropriate for this patient?", "options": [{"key": "A", "text": "Diuretics", "why": "Diuretic ไม่ช่วย angina"}, {"key": "B", "text": "Beta-blocker", "why": "ถูก — β-blocker ลด HR + contractility → ลด O₂ demand ช่วยทั้ง angina และ HTN"}, {"key": "C", "text": "ACE inhibitors", "why": "ACEi ลด BP แต่ไม่ลดอาการ angina โดยตรง"}, {"key": "D", "text": "Direct acting vasodilators", "why": "Direct vasodilator (hydralazine) → reflex tachycardia ทำ angina แย่ลง"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "Compelling indication: HTN + stable (exertional) angina → β-blocker (atenolol, metoprolol) หรือ CCB เพราะลด myocardial O₂ demand", "explanation": "HTN + exertional angina → β-blocker", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "HTN with angina", "lecture_guess": ["L13", "L08"]}}, {"id": "51-MCQ-065", "n": 65, "type": "MCQ", "stem": "ชายอายุ 53 ปี มีไฮเปอร์เทนชั่น 158/93 มี DM Type 2 มา 5 ปี , gout 3 ปี ได้รับยา insulin, allopurinol ควรให้ยาอะไรเพื่อรักษา hypertension", "options": [{"key": "A", "text": "Prazosin", "why": "α-blocker ไม่ใช่ first-line"}, {"key": "B", "text": "Losartan", "why": "ถูก — ARB เหมาะใน DM (renoprotection) และ losartan ยังลด uric acid ได้เล็กน้อย"}, {"key": "C", "text": "Propranolol", "why": "β-blocker บดบังอาการ hypoglycemia จาก insulin"}, {"key": "D", "text": "Hydralazine", "why": "Hydralazine ไม่ใช่ first-line"}, {"key": "E", "text": "Hydrochlorothiazide", "why": "Thiazide เพิ่ม uric acid → gout กำเริบ"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• เลือกยา HTN ตามโรคร่วม: DM → ACEi/ARB\n• gout → หลีกเลี่ยง thiazide/loop diuretic (uric acid ↑), losartan มี uricosuric effect\n• ใช้ insulin → ระวัง β-blocker (masking hypoglycemia)", "explanation": "HTN + DM + gout → losartan (ARB)", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Choosing antihypertensive by comorbidity", "lecture_guess": ["L13"]}}, {"id": "51-MCQ-069", "n": 69, "type": "MCQ", "stem": "65-year-old man is diagnosed with acute MI. physicians administered tenectaphlase IV. What is the machinism of action of this drug?", "options": [{"key": "A", "text": "Inhibit glycoprotein 2b/3a receptors", "why": "GP IIb/IIIa inhibitor (abciximab, tirofiban)"}, {"key": "B", "text": "Inhibit the ADP receptors of platelets", "why": "P2Y12 (ADP) inhibitor (clopidogrel)"}, {"key": "C", "text": "Inhibit thrombin and coagulation factor", "why": "Heparin/direct thrombin inhibitor"}, {"key": "D", "text": "Prevent clotting factor 2,7,9,10 synthesis", "why": "Warfarin"}, {"key": "E", "text": "Enhance conversion of plasminogen to plasmin", "why": "ถูก — tenecteplase (TNK-tPA) เป็น fibrinolytic เร่ง plasminogen → plasmin"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Tenecteplase (tPA analogue) จับ fibrin ใน clot", {"s": "Plasminogen → plasmin ↑", "answer": true}, "Plasmin สลาย fibrin", "Clot ละลาย → coronary reperfusion (STEMI)"], "key_concept": "• Fibrinolytics (alteplase, tenecteplase, streptokinase) ใช้ใน STEMI เมื่อทำ PCI ไม่ได้ภายในเวลา\n• tenecteplase fibrin-specific กว่าและให้ bolus ครั้งเดียว", "explanation": "Tenecteplase เร่งการเปลี่ยน plasminogen เป็น plasmin", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "recall", "topic": "Fibrinolytic drugs", "lecture_guess": ["CC3"]}}, {"id": "51-MCQ-070", "n": 70, "type": "MCQ", "stem": "Which of the following conditions causes decreased pulmonary vasculature in chest radiograph?", "options": [{"key": "A", "text": "Atrial septal defect", "why": "ASD → L→R shunt pulmonary vasculature ↑"}, {"key": "B", "text": "Mitral valve regurgitation", "why": "MR → pulmonary venous congestion"}, {"key": "C", "text": "Congestive heart failure", "why": "CHF → pulmonary venous congestion"}, {"key": "D", "text": "Parental ductus arteriosus", "why": "PDA → L→R shunt vasculature ↑"}, {"key": "E", "text": "Tetralogy of fallot", "why": "ถูก — TOF: RVOT obstruction เลือดไปปอดน้อย → oligemic lungs"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Pulmonary vasculature ลด (oligemia) = เลือดไปปอดน้อย: TOF, pulmonary atresia, tricuspid atresia, Ebstein\n• เพิ่ม (plethora) = L→R shunt (ASD, VSD, PDA) หรือ TGA", "explanation": "Decreased pulmonary vasculature = Tetralogy of Fallot", "refs": [], "tags": {"discipline": "clinical", "bloom": "understand", "topic": "Pulmonary vascularity on CXR", "lecture_guess": ["L12", "L11"]}}, {"id": "51-MCQ-072", "n": 72, "type": "MCQ", "stem": "หัวใจโตเล็กน้อย ผนังห้องขวาหนา carina กว้าง pulmonary vasculate เพิ่ม เกิดจากอะไร", "options": [{"key": "A", "text": "Mitral valve regurgitation", "why": "ถูก — mitral valve disease: LA โต (carina กว้าง), pulmonary venous HTN (vasculature ↑), RV hypertrophy ตามมา"}, {"key": "B", "text": "Aortic valve stenosis", "why": "AS → LVH, หัวใจรูปร่างปกติ"}, {"key": "C", "text": "tricuspid valve stenosis", "why": "TS → RA โต pulmonary vasculature ลด"}, {"key": "D", "text": "Pulmonary valve stenosis", "why": "PS → main PA โต pulmonary vasculature ปกติ/ลด"}, {"key": "E", "text": "Massive pericardium effusion", "why": "Pericardial effusion → water-bottle heart"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "Mitral configuration บน CXR: LA enlargement (carina กว้าง > 90°, double density, left atrial appendage นูน) + pulmonary venous hypertension + RV enlargement ตามมา — พบใน mitral stenosis/regurgitation", "explanation": "Carina กว้าง + pulmonary vasculature ↑ + RV หนา = mitral valve disease", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "Mitral configuration on CXR", "lecture_guess": ["L12"]}}, {"id": "51-MCQ-076", "n": 76, "type": "MCQ", "stem": "A 56-year-old woman diagnosed with left breast cancer underwent mastectomy with axillary lymph node dissection. Postoperatively, she developed left arm edema 6 months persisted. On physical examination BT 36.9 C. Left arm edema is non-pitting edema. No redness or tenderness. What is the mechanism of this? (ตรงกับข้อ 50 Med49)", "options": [{"key": "A", "text": "Lymphatic obstruction", "why": "ถูก — lymph node dissection → lymphatic obstruction → lymphedema"}, {"key": "B", "text": "Over water intake", "why": "ไม่ทำบวมแขนข้างเดียว"}, {"key": "C", "text": "Increased interstitial oncotic pressure", "why": "เป็นผลตามมา ไม่ใช่สาเหตุต้น"}, {"key": "D", "text": "Increased interstitial hydrostatic pressure", "why": "ไม่ใช่สาเหตุต้น"}, {"key": "E", "text": "Increased vascular permeability", "why": "Permeability ↑ = inflammation (แดง เจ็บ)"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Axillary lymph node dissection", {"s": "Lymphatic obstruction", "answer": true}, "Protein-rich fluid คั่งใน interstitium", "Non-pitting edema แขนซ้าย"], "key_concept": "Edema 4 กลไก: hydrostatic ↑, oncotic ↓, permeability ↑, lymphatic obstruction (ข้อนี้ออกซ้ำทุกปี — 52_MCQ ข้อ 91 และ Med49 ข้อ 50)", "explanation": "แขนบวม non-pitting หลังเลาะต่อมน้ำเหลือง = lymphatic obstruction", "refs": [], "tags": {"discipline": "pathology", "bloom": "apply", "topic": "Mechanisms of edema", "lecture_guess": ["L14", "L07"]}}, {"id": "51-MCQ-081", "n": 81, "type": "MCQ", "stem": "After an acute MI (e.g. LCx occlusion), which complication is the most serious/most common cause of early death?", "options": [{"key": "A", "text": "Pericarditis", "why": "Pericarditis เกิดวันที่ 1–3 ไม่อันตรายเท่า"}, {"key": "B", "text": "Ventricular Fib", "why": "ถูก — ventricular fibrillation เป็นสาเหตุ sudden death ที่พบบ่อยที่สุดช่วงแรกหลัง MI"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "audit_note": "ต้นฉบับจำโจทย์ไม่ครบ ('Most serious side effect ของอะไรสักอย่าง น่าจะประมาณว่า LCX โดน block') — เขียนโจทย์ให้อ่านได้", "key_concept": "• ภาวะแทรกซ้อนของ MI ตามเวลา: ชั่วโมงแรก = arrhythmia (VF) อันตรายที่สุด\n• 1–3 วัน = pericarditis\n• 3–14 วัน = rupture (free wall, septum, papillary muscle)\n• สัปดาห์–เดือน = aneurysm, Dressler (ออกซ้ำใน 52_MCQ ข้อ 86)", "explanation": "ภาวะแทรกซ้อนร้ายแรงที่สุดหลัง MI ระยะแรก = ventricular fibrillation", "refs": [], "tags": {"discipline": "pathology", "bloom": "recall", "topic": "Complications of MI", "lecture_guess": ["L14", "CC3"]}}, {"id": "51-MCQ-083", "n": 83, "type": "MCQ", "stem": "ชาย 60 ปี มาห้องฉุกเฉินด้วย acute chest pain, tiredness, sweating 6 ชั่วโมง เจาะ total CK และ CK-MB mass (reference: total CK 0–190 U/L, CK-MB mass 0–4.87 ng/mL) ผลใดสนับสนุน acute MI มากที่สุด", "options": [{"key": "A", "text": "Total CK 200 , CK mass 5", "why": "Relative index 2.5 (< 3 → skeletal muscle)"}, {"key": "B", "text": "Total CK 220 , CK mass 5", "why": "RI 2.3"}, {"key": "C", "text": "Total CK 250 , CK mass 10", "why": "RI 4 (gray zone)"}, {"key": "D", "text": "Total CK 280 , CK mass 10", "why": "RI 3.6 (gray zone)"}, {"key": "E", "text": "Total CK 320 , CK mass 15", "why": "ถูก — RI 4.7 สูงสุด และค่าสูงชัดที่สุด"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Relative index (RI) = CK-MB mass / total CK × 100:\n• < 3 = skeletal muscle damage\n• 3–5 = gray zone\n• > 5 = myocardial (ใช้ได้เมื่อทั้งสองค่าสูง)\n• ตัวเลือก E ทั้งค่าสูงสุดและ RI สูงสุด (ออกซ้ำทุกคำใน 52_MCQ ข้อ 76)", "explanation": "Total CK และ CK-MB สูงสุด + relative index สูงสุด = สนับสนุน AMI", "refs": [], "tags": {"discipline": "biochem", "bloom": "apply", "topic": "CK-MB relative index", "lecture_guess": ["L16"]}}, {"id": "51-MCQ-084", "n": 84, "type": "MCQ", "stem": "What is the primary hemodynamic consequence of a large VSD in an infant?", "options": [{"key": "A", "text": "Right atrial pressure changes", "why": "ไม่ใช่ผลหลัก"}, {"key": "B", "text": "Right ventricular compliance changes", "why": "ไม่ใช่ผลหลัก"}, {"key": "C", "text": "Obstructive of aortic outflow tract", "why": "VSD ไม่ได้อุด aortic outflow"}, {"key": "D", "text": "Increase Left to right shunt causing pulmonary overcirculation", "why": "ถูก — L→R shunt จำนวนมาก → pulmonary overcirculation → HF ในทารก"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "audit_note": "ตัวเลือก A/B ต้นฉบับไม่แน่ใจว่า ลด/เพิ่ม — ตัดคำว่าลด/เพิ่มออก", "mechanism": ["Large VSD: LV pressure > RV pressure", {"s": "Left-to-right shunt ↑"}, {"s": "Pulmonary overcirculation (Qp > Qs)", "answer": true}, "LA/LV volume overload → CHF (หอบ ดูดนมเหนื่อย เหงื่อออก)", "ระยะยาว pulmonary HTN → Eisenmenger"], "key_concept": "• VSD ใหญ่: อาการ HF ชัดเมื่ออายุ 4–8 สัปดาห์ (PVR ลดลงหลังคลอด shunt เพิ่ม)\n• เป็น volume overload ของปอด, LA และ LV", "explanation": "Large VSD → L→R shunt → pulmonary overcirculation", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "VSD hemodynamics", "lecture_guess": ["L11"]}}, {"id": "51-MCQ-087", "n": 87, "type": "MCQ", "stem": "Newborn, cyanosis dx.TOF Physical examination: oxygen saturation 80-85%, clubbing finger ให้อธิบายกลไกว่าทำไมถึง cyanosis?", "options": [{"key": "A", "text": "Reduce perfussion", "why": "Perfusion ไม่ใช่สาเหตุ (นั่นคือ peripheral cyanosis)"}, {"key": "B", "text": "Reduce volume", "why": "Volume ไม่ใช่กลไกหลัก"}, {"key": "C", "text": "Reduce SVR", "why": "เฉลยต้นฉบับ — SVR ↓ เป็นตัวกระตุ้น tet spell (ทำให้ shunt มากขึ้น) แต่ไม่ใช่กลไกพื้นฐานของ cyanosis เรื้อรัง (SpO₂ 80–85 + clubbing)"}, {"key": "D", "text": "Mix desaturation", "why": "เสนอ — RVOT obstruction → เลือด desaturated จาก RV ไหลผ่าน VSD ไปผสมใน aorta (right-to-left shunt)"}], "answer": "C", "answer_verified": false, "answer_status": "source_disagree", "explanation_style": "sequence", "proposed_answer": "D", "audit_note": "ผู้เฉลยวง C พร้อมโน้ต 'infundibular spasm, RV volume ↓, SVR ↓' ซึ่งเป็นกลไกของ hypercyanotic spell; โจทย์ถามสาเหตุ cyanosis เรื้อรัง (SpO₂ 80–85, clubbing) จึงควรเป็น mixing of desaturated blood", "mechanism": ["TOF: RVOT obstruction (pulmonary stenosis)", "RV pressure ↑ ใกล้/เกิน LV", {"s": "Right-to-left shunt ผ่าน VSD"}, {"s": "เลือด desaturated ผสมเข้า systemic (mixing)", "answer": true}, "SpO₂ 80–85% → chronic hypoxemia → clubbing"], "key_concept": "• Cyanosis ใน TOF เกิดจาก R→L shunt ผ่าน VSD เพราะ RVOT obstruction (เลือดดำผสมเข้า aorta = mixing of desaturated blood)\n• ระดับ cyanosis ขึ้นกับความรุนแรงของ RVOT obstruction และ SVR: SVR ↓ (ร้องไห้ ออกแรง) หรือ infundibular spasm → shunt ↑ → tet spell", "explanation": "TOF เขียวจากเลือดดำผ่าน VSD ไปผสมใน aorta (right-to-left shunt)", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Cyanosis in TOF", "lecture_guess": ["L11"]}}, {"id": "51-MCQ-096", "n": 96, "type": "MCQ", "stem": "A 69-year-old woman with exertional dyspnea in a past week. She is unable to sleep in a supine position, only in upright from night until day. What is her clinical symptoms for her diagnosis?", "options": [{"key": "A", "text": "Rales", "why": "Rales/crackles ก็พบใน left HF (pulmonary congestion)"}, {"key": "B", "text": "S3 Gallop", "why": "เฉลยต้นฉบับ — S3 gallop เป็น sign ที่ specific ต่อ systolic HF"}, {"key": "C", "text": "Cardiac Murmur", "why": "Murmur ไม่ specific"}, {"key": "D", "text": "Lower Extremities Edema", "why": "Leg edema = right-sided/volume overload"}, {"key": "E", "text": "Jugular Venous Distension", "why": "JVD = right-sided/volume overload"}], "answer": "B", "answer_verified": false, "answer_status": "source_unverified", "explanation_style": "principle", "key_concept": "• Orthopnea + exertional dyspnea = left-sided HF\n• Sign ที่สนับสนุน: S3 gallop (specific สูง), crackles, PND, displaced apex\n• JVD/edema/hepatomegaly = right-sided", "explanation": "Orthopnea → left HF; S3 gallop เป็น sign ที่ specific", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "Signs of left heart failure", "lecture_guess": ["CC4"]}}], "guide": null}
