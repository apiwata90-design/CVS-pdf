ticipatory (central command) → onset (central command + mechanoreceptor/proprioceptor feedback) → steady state (metaboreceptor, chemoreceptor, temperature)", "explanation": "ก่อนเริ่มออกกำลังกาย การปรับ CVS มาจาก central command ของ cortex", "source_note": "เปน Central Command สงสัญญาณ เพื่อปรับ Cardiac output ตั้งแตกอนเริ่มขยับตัว", "refs": [], "tags": {"discipline": "physiology", "bloom": "recall", "topic": "Central command", "lecture_guess": ["L17"]}}, {"id": "52-MCQ-048", "n": 48, "type": "MCQ", "stem": "During high-intensity exercise, a subject’s oxygen consumption and CO₂ production rise sharply. Which of the following represents the primary compensatory response to maintain arterial blood gases?", "options": [{"key": "A", "text": "No change in ventilation", "why": "Ventilation ต้องเพิ่ม"}, {"key": "B", "text": "Increased heart rate only", "why": "HR เพิ่มไม่ได้แก้ blood gas เอง"}, {"key": "C", "text": "Increased sympathetic-mediated vasoconstriction", "why": "Vasoconstriction ไม่ได้ปรับ gas"}, {"key": "D", "text": "Compensatory ventilation (increased alveolar ventilation)", "why": "ถูก — alveolar ventilation เพิ่ม (hyperpnea และหลัง ventilatory threshold เพิ่มแบบ non-linear) รักษา PaCO₂/pH"}, {"key": "E", "text": "Activation of baroreceptors to reduce cardiac output", "why": "CO ต้องเพิ่มไม่ใช่ลด"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["High-intensity exercise", "VO₂ ↑, VCO₂ ↑ + lactate → H⁺ ↑ (HCO₃⁻ buffer → CO₂ เพิ่ม)", "Chemoreceptor (carotid body) + central command", {"s": "Alveolar ventilation ↑ (เกิน VCO₂ หลัง ventilatory threshold)", "answer": true}, "PaCO₂ คงที่/ลด ชดเชย metabolic acidosis"], "key_concept": "• ช่วง moderate PaO₂/PaCO₂ แทบคงที่ (ventilation เพิ่มเป็นสัดส่วน)\n• เกิน lactate/ventilatory threshold ventilation เพิ่มแบบ non-linear เพื่อ respiratory compensation", "explanation": "Exercise หนักชดเชยด้วยการเพิ่ม alveolar ventilation", "source_note": "ชวง High-intensity, Alveolar ventilation จะเพิ่มขึ้นแบบ Non-linear เพื่อลด PaCO2 ลงมาชวยชดเชยภาวะ acidosis", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Exercise hyperpnea", "lecture_guess": ["L17"]}}, {"id": "52-MCQ-049", "n": 49, "type": "MCQ", "stem": "During a sudden drop in arterial blood pressure, which mechanism is primarily responsible for the rapid increase in systemic vascular resistance?", "options": [{"key": "A", "text": "Hormonal factor (RAAS-mediated vasoconstriction)", "why": "RAAS ช้ากว่า (นาที–ชั่วโมง)"}, {"key": "B", "text": "Local metabolic factor (adenosine, CO₂)", "why": "Local metabolic ทำ vasodilation ไม่ใช่ constriction"}, {"key": "C", "text": "Endothelial factor (nitric oxide)", "why": "NO ทำ vasodilation"}, {"key": "D", "text": "Neural factor (sympathetic activation of arterioles)", "why": "ถูก — baroreflex → sympathetic → α1 arteriolar constriction ภายในวินาที"}, {"key": "E", "text": "Mechanical factor (passive vessel stretching)", "why": "Passive stretch ไม่เพิ่ม resistance"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Arterial pressure ↓ ทันที", "Baroreceptor firing ↓", {"s": "Sympathetic outflow ↑ ไป arterioles", "answer": true}, "NE → α1 → vasoconstriction", "SVR ↑ ภายในวินาที"], "key_concept": "Neural control เร็วที่สุด (วินาที) > hormonal (Ang II, ADH: นาที) > renal volume (วัน)", "explanation": "SVR เพิ่มเร็วจาก neural (sympathetic) control", "source_note": "เมื่อความดันลดลง กลไกที่เร็วที่สุดคือ baroreceptor reflex → กระตุน sympathetic nervous system → หดตัวของ arterioles → SVR เพิ่มขึ้น", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Neural control of SVR", "lecture_guess": ["L10"]}}, {"id": "52-MCQ-050", "n": 50, "type": "MCQ", "stem": "During dynamic exercise, cardiac output increases to meet the metabolic demands of active skeletal muscles. How is blood flow to splanchnic organs primarily affected, and what is the physiological reason?", "options": [{"key": "A", "text": "Increased due to parasympathetic activation", "why": "Parasympathetic ไม่ได้เพิ่ม splanchnic flow ขณะ exercise"}, {"key": "B", "text": "Decreased due to sympathetic-mediated vasoconstriction", "why": "ถูก — sympathetic vasoconstriction ลด splanchnic flow เพื่อ redistribute ไปกล้ามเนื้อ"}, {"key": "C", "text": "Unchanged due to local autoregulation", "why": "Autoregulation ไม่ชนะ sympathetic drive ระหว่าง exercise"}, {"key": "D", "text": "Increased due to local metabolic vasodilation", "why": "Splanchnic ไม่ได้มี metabolic demand เพิ่ม"}, {"key": "E", "text": "Entirely redirected to the lungs", "why": "ไม่มีการ 'redirect ไปปอด'"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Dynamic exercise", "Sympathetic outflow ↑", {"s": "α1 vasoconstriction ใน splanchnic + renal beds"}, {"s": "Splanchnic blood flow ↓", "answer": true}, "+ venous mobilization → venous return ↑", "เลือดไปกล้ามเนื้อและหัวใจมากขึ้น"], "key_concept": "Redistribution ระหว่างออกกำลังกาย: muscle/heart/skin ↑, splanchnic/renal ↓, brain คงที่", "explanation": "Splanchnic flow ลดจาก sympathetic vasoconstriction", "source_note": "ระหวาง dynamic exercise ระบบ sympathetic ทำใหหลอดเลือดของ splanchnic organs หดตัว → เลือดถูก redistribute ไปเลี้ยง skeletal muscle และหัวใจ", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Splanchnic flow in exercise", "lecture_guess": ["L17"]}}, {"id": "52-MCQ-051", "n": 51, "type": "MCQ", "stem": "In a left ventricular PV loop, an increase in pressure (taller loop) with smaller end- systolic volume is most likely caused by what?", "options": [{"key": "A", "text": "Increased afterload", "why": "Afterload ↑ → loop สูงขึ้นแต่ ESV ↑ (ไม่ใช่เล็กลง)"}, {"key": "B", "text": "Increased preload", "why": "Preload ↑ → loop กว้างไปขวา EDV ↑"}, {"key": "C", "text": "Positive inotropic drug", "why": "ถูก — contractility ↑ → ESPVR ชัน → peak pressure สูงขึ้น ESV เล็กลง"}, {"key": "D", "text": "Dehydration", "why": "Dehydration → preload ↓ loop แคบ/เล็ก"}, {"key": "E", "text": "Mitral stenosis", "why": "Mitral stenosis → filling ลด EDV ↓"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Positive inotrope (เช่น dobutamine, digoxin)", "Intracellular Ca²⁺ ↑ → contractility ↑", {"s": "ESPVR ชันขึ้น"}, {"s": "Peak systolic pressure ↑ + ESV ↓", "answer": true}, "SV ↑, EF ↑"], "key_concept": "• แยก PV loop:\n• preload = เปลี่ยนที่ EDV (มุมขวาล่าง)\n• afterload = ความสูง + ESV ↑\n• contractility = slope ของ ESPVR", "explanation": "Loop สูงขึ้นพร้อม ESV เล็กลง = contractility เพิ่ม (positive inotrope)", "source_note": "การบีบตัวที่แรงขึ้นทำใหสราง Peak Pressure ไดสูงขึ้น", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "PV loop: contractility", "lecture_guess": ["L04"]}}, {"id": "52-MCQ-052", "n": 52, "type": "MCQ", "stem": "In a healthy individual, which primary compensatory adjustment occurs in systemic circulation in response to an increase in blood volume?", "options": [{"key": "A", "text": "Decreased heart rate due to baroreceptor reflex", "why": "HR ลดได้แต่ความเปลี่ยนแปลงหลักคือ sympathetic ลดทั้งระบบ"}, {"key": "B", "text": "Increased cardiac output only", "why": "CO เพิ่มจาก preload ได้ แต่ไม่ใช่ compensatory adjustment"}, {"key": "C", "text": "Increased total peripheral resistance (TPR) to maintain arterial pressure", "why": "ตรงข้าม — TPR จะลด"}, {"key": "D", "text": "Vasodilation of splanchnic vessels", "why": "Splanchnic vasodilation เป็นผลของ sympathetic ลด ไม่ใช่ตัวหลัก"}, {"key": "E", "text": "Decreased sympathetic activity", "why": "ถูก — volume ↑ → baroreceptor/atrial stretch ↑ → sympathetic ↓"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Blood volume ↑", "Venous return/preload ↑ → CO ↑ → MAP ↑", "Baroreceptor + atrial stretch receptor ↑", {"s": "Sympathetic activity ↓", "answer": true}, "TPR ↓, HR ↓, venous capacitance ↑", "+ ANP ↑, ADH ↓ → natriuresis/diuresis"], "key_concept": "Volume overload ถูกชดเชยทั้ง neural (sympathetic ↓) และ hormonal (ANP ↑, RAAS ↓, ADH ↓) → ขับ Na⁺/น้ำ", "explanation": "Volume เพิ่ม → stretch receptor → ลด sympathetic activity", "source_note": "เมื่อ Volume เพิ่มขึ้นจนไปยืด Baroreceptors สมองจะสงสัญญาณให ลด Sympathetic outflow", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Response to volume expansion", "lecture_guess": ["L10"]}}, {"id": "52-MCQ-053", "n": 53, "type": "MCQ", "stem": "During acute moderate blood loss, which of the following is the primary immediate cardiovascular response to maintain arterial blood pressure?", "options": [{"key": "A", "text": "Decreased heart rate", "why": "HR จะเพิ่ม"}, {"key": "B", "text": "Increased venous compliance", "why": "Venous compliance จะลด (venoconstriction)"}, {"key": "C", "text": "Increased total peripheral resistance (TPR) via sympathetic vasoconstriction", "why": "ถูก — sympathetic vasoconstriction → TPR ↑ เร็วที่สุด"}, {"key": "D", "text": "Release of renin and aldosterone", "why": "RAAS เกิดตามมาแต่ช้ากว่า"}, {"key": "E", "text": "Local vasodilation in skeletal muscles", "why": "Skeletal muscle จะ vasoconstrict"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Blood loss → venous return ↓ → CO ↓ → MAP ↓", "Baroreceptor firing ↓", "Sympathetic ↑", {"s": "Arteriolar constriction → TPR ↑", "answer": true}, "+ HR ↑, venoconstriction (compliance ↓) → MAP รักษาไว้"], "key_concept": "• Hemorrhage: compensation ทันที = baroreflex\n• ตามด้วย capillary fluid shift, RAAS, ADH, thirst", "explanation": "เสียเลือดเฉียบพลัน → sympathetic เพิ่ม TPR เป็นกลไกหลักทันที", "source_note": "คือกลไกหลักและรวดเร็วที่สุดในการรักษา MAP โดยการหดตัวของ Arterioles", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Response to hemorrhage", "lecture_guess": ["L10", "CC1"]}}, {"id": "52-MCQ-054", "n": 54, "type": "MCQ", "stem": "During exercise, which of the following increases?", "options": [{"key": "A", "text": "Total peripheral resistance", "why": "TPR ลดลง (vasodilation ในกล้ามเนื้อ)"}, {"key": "B", "text": "Venous return", "why": "ถูก — muscle pump + respiratory pump + venoconstriction → venous return ↑"}, {"key": "C", "text": "End-diastolic volume", "why": "EDV เพิ่มเล็กน้อยหรือคงที่ (diastolic time ลดเมื่อ HR สูง) จึงไม่ใช่คำตอบที่ดีที่สุด"}, {"key": "D", "text": "Parasympathetic tone", "why": "Parasympathetic ลดลง"}, {"key": "E", "text": "Atrial filling time", "why": "Filling time ลดเพราะ HR เพิ่ม"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Exercise", {"s": "Skeletal muscle pump + respiratory pump + venoconstriction"}, {"s": "Venous return ↑", "answer": true}, "Preload ↑ → SV ↑ (Frank–Starling)", "CO ↑"], "key_concept": "• ใน steady state venous return = CO\n• exercise เพิ่ม CO ได้ 4–6 เท่าจาก HR ↑ + SV ↑", "explanation": "ระหว่าง exercise venous return เพิ่ม", "source_note": "Frank-Starling law", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Venous return in exercise", "lecture_guess": ["L17"]}}, {"id": "52-MCQ-055", "n": 55, "type": "MCQ", "stem": "A 45-year-old man suffers a head injury. Imaging shows increased intracranial pressure (ICP). Which of the following is the most likely effect on cerebral blood flow (CBF)?", "options": [{"key": "A", "text": "Cerebral blood flow increases", "why": "ตรงข้าม"}, {"key": "B", "text": "Cerebral blood flow decreases", "why": "ถูก — ICP ↑ → CPP = MAP − ICP ↓ → CBF ↓"}, {"key": "C", "text": "Cerebral blood flow remains unchanged", "why": "Autoregulation มีขีดจำกัด เมื่อ CPP ต่ำ flow ลด"}, {"key": "D", "text": "Cerebral blood flow fluctuates randomly", "why": "ไม่ใช่"}, {"key": "E", "text": "Cerebral blood flow shifts to the spinal cord", "why": "ไม่มีการ shift"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Head injury → ICP ↑", {"s": "CPP ↓", "note": "CPP = MAP − ICP"}, {"s": "CBF ↓", "answer": true}, "ถ้า ischemia รุนแรง → Cushing reflex (HTN + bradycardia + irregular breathing)"], "key_concept": "Cushing reflex: ICP สูง → brain ischemia → sympathetic ↑ (BP ↑) → baroreflex → bradycardia", "explanation": "ICP เพิ่มทำให้ CPP และ CBF ลด", "source_note": "CPP = MAP - ICP", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "Cerebral perfusion pressure", "lecture_guess": ["L15"]}}, {"id": "52-MCQ-056", "n": 56, "type": "MCQ", "stem": "A 65-year-old man with a history of stable angina uses sublingual nitroglycerin for chest pain relief. Recently, he started taking a medication for erectile dysfunction. A few hours after using both drugs, he collapses with severe hypotension. Which of the following drugs is most likely responsible for this adverse event?", "options": [{"key": "A", "text": "Tamsulosin", "why": "Tamsulosin (α1A blocker) ทำ hypotension ได้ แต่ไม่ใช่ยา ED"}, {"key": "B", "text": "Atenolol", "why": "Atenolol ไม่มี interaction รุนแรงกับ nitrate"}, {"key": "C", "text": "Sildenafil", "why": "ถูก — sildenafil (PDE5 inhibitor) + nitrate → cGMP คั่ง → severe hypotension"}, {"key": "D", "text": "Ranolazine", "why": "Ranolazine ไม่ลด BP"}, {"key": "E", "text": "Amlodipine", "why": "Amlodipine ลด BP แต่ไม่ใช่ยา ED"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Nitroglycerin → NO ↑", "Soluble guanylyl cyclase ↑ → cGMP ↑", "Sildenafil ยับยั้ง PDE5 (สลาย cGMP ไม่ได้)", {"s": "cGMP คั่งมาก → profound vasodilation"}, {"s": "Severe hypotension", "answer": true}], "key_concept": "ห้ามใช้ PDE5 inhibitor (sildenafil/vardenafil 24 ชม., tadalafil 48 ชม.) ร่วมกับ nitrate ทุกรูปแบบ", "explanation": "Sildenafil + nitrate → cGMP คั่ง → hypotension รุนแรง", "source_note": "เนื่องจาก sublingual nitroglycerin > เพิ่มNO > กระตุนguanylyl cyclase > เพิ่มcGMP > vasodilation แลว Sildenafil เปน PDE inhibitor ซึ่งจะไปยับยั้งการสลาย cGMP ดังนั้น cGMP ก็จะคั่ง ยิ่งทำใหเกิด vasodilation มากขึ้น ทำใหเกิด severe hypotention ได", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Nitrate–PDE5 inhibitor interaction", "lecture_guess": ["L08"]}}, {"id": "52-MCQ-057", "n": 57, "type": "MCQ", "stem": "A patient with exertional angina is prescribed a drug that dilates coronary arteries and peripheral veins by increasing nitric oxide (NO) in vascular smooth muscle. Which enzyme activity is increased by this drug?", "options": [{"key": "A", "text": "Adenylate cyclase", "why": "Adenylate cyclase → cAMP (β-agonist)"}, {"key": "B", "text": "Guanylyl cyclase", "why": "ถูก — NO กระตุ้น soluble guanylyl cyclase → cGMP"}, {"key": "C", "text": "Myosin kinase", "why": "Myosin light chain kinase ถูกลด activity"}, {"key": "D", "text": "Phosphodiesterase", "why": "PDE สลาย cGMP (ไม่ได้เพิ่ม)"}, {"key": "E", "text": "𝑁𝑎+/𝐾+ATPase", "why": "ไม่เกี่ยว"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Nitrate → NO", {"s": "Soluble guanylyl cyclase ↑", "answer": true}, "cGMP ↑ → PKG", "MLC dephosphorylation", "Venodilation (preload ↓) > arteriolar/coronary dilation", "O₂ demand ↓ → angina ↓"], "key_concept": "Nitrates ออกฤทธิ์หลักที่ veins (ลด preload) ADR: headache, flushing, reflex tachycardia, tolerance (ต้องมี nitrate-free interval)", "explanation": "Nitrate → NO → เพิ่ม guanylyl cyclase", "source_note": "เปนยากลุม nitrate > เพิ่มNO > กระตุนguanylyl cyclase ใหเพิ่มขึ้น เหมือนขอ 56", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "recall", "topic": "Nitrate mechanism", "lecture_guess": ["L08"]}}, {"id": "52-MCQ-058", "n": 58, "type": "MCQ", "stem": "A 62-year-old man presents with recurrent chest discomfort on exertion. He has been taking atenolol and long-acting nitrates, but the symptoms still occur. His heart rate is 58/min and blood pressure is 110/70 mmHg. Which of the following drugs should be added to improve his symptoms without further lowering heart rate or blood pressure?", "options": [{"key": "A", "text": "Amlodipine", "why": "Amlodipine ลด BP เพิ่ม (BP 110/70)"}, {"key": "B", "text": "Ranolazine", "why": "ถูก — ranolazine ยับยั้ง late Na⁺ current ไม่ลด HR/BP"}, {"key": "C", "text": "Verapamil", "why": "Verapamil ลด HR + BP และเสี่ยง bradycardia/heart block กับ atenolol"}, {"key": "D", "text": "Ivabradine", "why": "Ivabradine ลด HR (HR 58 แล้ว)"}, {"key": "E", "text": "Nitroglycerin (sublingual)", "why": "SL NTG ใช้ระงับอาการเฉียบพลัน ไม่ป้องกัน และลด BP"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Ranolazine: block late Na⁺ current (INa,L) → ลด Na⁺/Ca²⁺ overload ในเซลล์ขาดเลือด → diastolic relaxation ดีขึ้น ไม่มีผล hemodynamic (HR/BP) จึงเหมาะใน HR/BP ต่ำ\n• ADR: QT prolongation\n• interaction กับ CYP3A4", "explanation": "HR และ BP ต่ำแล้ว → เพิ่ม ranolazine ที่ไม่มีผลต่อ HR/BP", "source_note": "Ranolazine ยับยั้ง late sodium current > ลด calcium overload ในเซลล กลามเนื้อหัวใจ > การคลายตัวของหัวใจดีขึ้นและลดอาการขาดเลือด โดย ไมมีผลตอ HR และ BP", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Ranolazine", "lecture_guess": ["L08"]}}, {"id": "52-MCQ-059", "n": 59, "type": "MCQ", "stem": "A 32-year-old pregnant woman at 28 weeks of gestation presents with blood pressure of 160/110 mmHg. She has no proteinuria or other signs of preeclampsia. The physician decides to start an antihypertensive drug. Which of the following medications is most appropriate for controlling her blood pressure in new guildline 2025?", "options": [{"key": "A", "text": "Enalapril", "why": "ACE inhibitor ห้ามในครรภ์ (fetal renal toxicity)"}, {"key": "B", "text": "Nifedipine", "why": "ถูก — nifedipine (long-acting) เป็น first-line ร่วมกับ labetalol/methyldopa"}, {"key": "C", "text": "Losartan", "why": "ARB ห้ามในครรภ์"}, {"key": "D", "text": "Propranolol", "why": "Propranolol ไม่ใช่ตัวเลือกแรก (fetal growth restriction)"}, {"key": "E", "text": "Hydrochlorothiazide", "why": "Thiazide ไม่แนะนำเป็นตัวเริ่ม (ลด plasma volume)"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• HTN in pregnancy (severe ≥160/110 ต้องรักษา): first-line = labetalol, nifedipine, methyldopa (hydralazine IV ใน acute)\n• ห้าม ACEi/ARB/direct renin inhibitor (fetopathy: oligohydramnios, renal failure, skull hypoplasia)", "explanation": "ตั้งครรภ์ BP สูง → nifedipine ปลอดภัย; ห้าม ACEi/ARB", "source_note": "เปนยาที่ลด BP ที่ปลอดภัยตอหญิงตั้งครรภ", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "HTN in pregnancy", "lecture_guess": ["L13"]}}, {"id": "52-MCQ-060", "n": 60, "type": "MCQ", "stem": "A patient is started on an antihypertensive medication and develops a persistent dry cough that has lasted for several weeks. Which of the following drugs is most likely responsible for this side effect?", "options": [{"key": "A", "text": "Amlodipine", "why": "Amlodipine → edema, flushing"}, {"key": "B", "text": "Losartan", "why": "Losartan ไม่ทำให้ bradykinin คั่ง"}, {"key": "C", "text": "Enalapril", "why": "ถูก — ACE inhibitor ยับยั้งการสลาย bradykinin → dry cough"}, {"key": "D", "text": "Propranolol", "why": "Propranolol → bronchospasm, bradycardia"}, {"key": "E", "text": "Hydrochlorothiazide", "why": "HCTZ → hypokalemia, hyperuricemia"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Enalapril ยับยั้ง ACE (kininase II)", {"s": "Bradykinin + substance P สะสมในทางเดินหายใจ"}, {"s": "Dry cough", "answer": true}], "key_concept": "ACEi ADR (CAPTOPRIL): Cough, Angioedema, Proteinuria, Taste change, hypOtension, Pregnancy contraindicated, Rash, Increased renin, Lower Ang II + hyperkalemia — ถ้าไอให้เปลี่ยนเป็น ARB", "explanation": "ไอแห้งเรื้อรังจาก bradykinin คั่ง = ACE inhibitor (enalapril)", "source_note": "เปนยากลุม ACE inhibitor มี ADR เชน Hypotension , dry cough , hyperkalemia , acute renal failure , angioneurotic edema", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "recall", "topic": "ACE inhibitor adverse effects", "lecture_guess": ["L13"]}}, {"id": "52-MCQ-061", "n": 61, "type": "MCQ", "stem": "A 45-year-old patient presents with supraventricular tachycardia (SVT). Vagal maneuvers and adenosine provide only transient relief. The physician decides to use an antiarrhythmic drug that slows conduction through the atrial and accessory pathways without major β-blocking activity. Which drug is most appropriate?", "options": [{"key": "A", "text": "Amiodarone", "why": "Amiodarone มีฤทธิ์ β-blocking (class II) ด้วย"}, {"key": "B", "text": "Lidocaine", "why": "Lidocaine (IB) ไม่ได้ผลกับ atrial/accessory pathway"}, {"key": "C", "text": "Procainamide", "why": "ถูก — procainamide (IA) ชะลอ conduction ใน atrium และ accessory pathway โดยไม่มีฤทธิ์ β-blocking หลัก"}, {"key": "D", "text": "Verapamil", "why": "Verapamil (IV) ชะลอ AV node แต่ไม่ช่วย accessory pathway (อาจอันตรายใน pre-excited AF)"}, {"key": "E", "text": "Metoprolol", "why": "Metoprolol เป็น β-blocker"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Antiarrhythmic class: IA (procainamide, quinidine) block Na⁺ ปานกลาง + K⁺ → ใช้ atrial + ventricular + accessory pathway (WPW)\n• IB (lidocaine) ventricular โดยเฉพาะ ischemic tissue\n• IC (flecainide) SVT/AF ในหัวใจปกติ\n• II β-blocker\n• III K⁺ blocker\n• IV non-DHP CCB (AV node)", "image_caption": "ECG lead II: narrow-complex regular tachycardia (SVT)", "explanation": "ชะลอ conduction ใน atrium + accessory pathway โดยไม่ใช่ β-blocker = procainamide", "source_note": "เปน class1-Na+ channel blockade > block การเขาของ Na+ ที่ phase 0 ของ depolarize > prolong phase 0", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Class IA antiarrhythmics", "lecture_guess": ["L09"]}, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCADJAeMDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6SuHtI72O3f7Gs00bGNCBlguM4+mRThDGSuIrbHlf3RXOeKrhLHxVod3cx/6OkFyrNFE0gBITGdoPpXP+Jbu8vNSlmt5pobZrNDYFI5wTJlg2FXALZ28Pxj2zU2NuZndiGMalH+6tv+PU/wAI9RUha1jubaBxaLNLCxRCBltuM4+mRXm9zdag3i+3eNbmOZLpI3UtKwMXygnaAEWM59z756XfC8Zk8Q6FJILx79LS4F99o8wokh2f3vlHIONvGMUkipTbsdncXmnQF45pLJHihTeCOV3nCZ+p4FS6bBH9isiI7bP2Zf4fYVxniS1nk1PV2S33K0em7Sqkg7ZyWxx2HWu30wf6DZfLD/x7L/IUW1HzPlevX/MkhhjPlfurb/V/3R7VVWGP+1LP91bf8er/AMI9Uq7GvMXyw58o/wBKqKP+JpZjbD/x6v8ATqlJocJO716P8mWIoY/3P7q2/wBX/dHtRFBH+5/dW3+rP8P0qSIf6n5Yf9Wf6UkQ/wBT8sP+rP8ASnYjmfcp6PDH/Z+n/urb/j3HVR6LVmKGP9x+6tv9Wf4R7VFo4/4l+n/LD/x7jr9FqzCP9R8sP+rP9KUVoXUk+d69/wBSksMf9o2P7q2/1En8I9UqzDDH/o/7q2+4f4fpUIH/ABMbH5Yf9RJ/NKsxD/j3wsOdh/pQkE5Oy1/q7I44Y8Qfurb7h/hHtVXRYI/7PsCY7b/Vd1HtV6FeIPlhzsP9Kq6KP+JdYfLD/qu/4UW1DmfI9ev+ZPFDH+4/dW33T/D9KrGGP7dp/wC7tvuSfwj2q7EP9R8sP3T/AEqqV/07T/lh+5J/ brosis + hypothyroidism (TSH สูง)"}, {"key": "D", "text": "Flecainide", "why": "Flecainide → proarrhythmia ใน structural heart disease"}, {"key": "E", "text": "Adenosine", "why": "Adenosine ออกฤทธิ์สั้นมาก"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "Amiodarone (class III แต่มีฤทธิ์ I–IV) มี iodine สูง ADR: pulmonary fibrosis, hypo/hyperthyroidism, hepatotoxicity, corneal deposits, blue-gray skin, photosensitivity — ต้องตรวจ PFT, TFT, LFT ก่อนและระหว่างใช้", "explanation": "Interstitial lung disease + TSH สูง หลังรักษา AF = amiodarone", "source_note": "มี ADR คือ hyperthyroidism or hypothyroidism", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Amiodarone toxicity", "lecture_guess": ["L09"]}}, {"id": "52-MCQ-063", "n": 63, "type": "MCQ", "stem": "A 68-year-old patient is diagnosed with isolated systolic hypertension (ISH). Which of the following medications is most appropriate as first-line therapy for this patient?", "options": [{"key": "A", "text": "Propranolol", "why": "β-blocker ไม่ใช่ first-line ใน elderly ISH"}, {"key": "B", "text": "Amlodipine", "why": "ถูก — DHP-CCB (amlodipine) เป็น first-line สำหรับ ISH ในผู้สูงอายุ"}, {"key": "C", "text": "Prazosin", "why": "α-blocker ไม่ใช่ first-line (orthostatic hypotension)"}, {"key": "D", "text": "Losartan", "why": "ARB เป็น first-line ทั่วไปได้ แต่ ISH ในผู้สูงอายุ CCB/thiazide มีหลักฐานดีที่สุด"}, {"key": "E", "text": "Captopril", "why": "ACEi ใช้ได้แต่ไม่ใช่ตัวที่ดีที่สุดใน ISH"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Isolated systolic HTN ในผู้สูงอายุเกิดจาก arterial stiffness\n• ยาที่มีหลักฐานลด stroke/CV events คือ long-acting DHP-CCB และ thiazide-like diuretic (เช่น SYST-EUR, SHEP)", "explanation": "ISH ในผู้สูงอายุ → amlodipine (DHP-CCB) เป็น first-line", "source_note": "เปน CCB > ยับยั้ง L-type Ca2+ channel > Ca เขาเซลลไดลดลง (เปน fisrt-line for Isolated systolic HTN )", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Isolated systolic hypertension", "lecture_guess": ["L13"]}}, {"id": "52-MCQ-064", "n": 64, "type": "MCQ", "stem": "A 65-year-old woman with type 2 diabetes and hypertension presents for follow-up. Labs show urine albumin 120 mg/g and eGFR 68 mL/min/1.73 m². Which drug is most appropriate to lower blood pressure and protect her kidneys?", "options": [{"key": "A", "text": "Hydrochlorothiazide", "why": "Thiazide ลด BP แต่ไม่ลด albuminuria"}, {"key": "B", "text": "Captopril", "why": "Captopril (ACEi) ป้องกันไตได้เช่นกัน แต่ออกฤทธิ์สั้น ต้องกินวันละ 2–3 ครั้ง"}, {"key": "C", "text": "Propranolol", "why": "β-blocker ไม่มี renoprotection"}, {"key": "D", "text": "Amlodipine", "why": "Amlodipine ไม่ลด proteinuria"}, {"key": "E", "text": "Valsartan", "why": "ถูก (ตามเฉลย) — ARB ลด intraglomerular pressure (efferent dilation) ลด albuminuria"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• DM + HTN + albuminuria (UACR ≥ 30 mg/g) → ACEi หรือ ARB (titrate ถึง max tolerated dose) ลด progression ของ diabetic nephropathy\n• ห้ามใช้ ACEi ร่วม ARB", "explanation": "DM + albuminuria → RAAS blockade (ARB) เพื่อป้องกันไต", "source_note": "เปน ARB", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Diabetic nephropathy and HTN", "lecture_guess": ["L13"]}}, {"id": "52-MCQ-065", "n": 65, "type": "MCQ", "stem": "A 58-year-old man is treated for hypertension. After 2 months, he develops bilateral leg edema. Physical examination shows pitting edema on both lower limbs. Which of the following drugs was most likely prescribed?", "options": [{"key": "A", "text": "Valsartan", "why": "Valsartan ไม่ทำ edema"}, {"key": "B", "text": "Captopril", "why": "Captopril → angioedema (ไม่ใช่ pitting edema ขา)"}, {"key": "C", "text": "Propranolol", "why": "Propranolol ไม่ทำ edema"}, {"key": "D", "text": "Amlodipine", "why": "ถูก — DHP-CCB: arteriolar dilation → capillary hydrostatic pressure ↑ → ankle edema"}, {"key": "E", "text": "Hydrochlorothiazide", "why": "HCTZ ลด edema"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Amlodipine → precapillary arteriolar dilation (venule ไม่ขยาย)", {"s": "Capillary hydrostatic pressure ↑"}, "Fluid filtration ออกนอกหลอดเลือด ↑", {"s": "Bilateral pitting ankle edema", "answer": true}], "key_concept": "• Edema จาก DHP-CCB เป็น dose-dependent ไม่ตอบสนองต่อ diuretic\n• แก้ด้วยลด dose หรือเพิ่ม ACEi/ARB (venodilation)", "explanation": "Bilateral pitting leg edema หลังเริ่มยา HTN = amlodipine", "source_note": "ADR : bilateral pitting leg edema", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "recall", "topic": "CCB adverse effects", "lecture_guess": ["L13"]}}, {"id": "52-MCQ-066", "n": 66, "type": "MCQ", "stem": "A 62-year-old man with a history of asthma and vasospastic angina develop chest pain about ten times per week in both exertion and at rest. One sublingual nitroglycerin tablet can control his symptoms; however, an awful headache always occurs. Which of the following is the best option to improve his angina?", "options": [{"key": "A", "text": "Change to nitroglycerin spray", "why": "เปลี่ยนรูปแบบ nitrate ยังปวดหัวเหมือนเดิม"}, {"key": "B", "text": "Add propranolol", "why": "Propranolol ห้ามใน asthma และทำ vasospasm แย่ลง (unopposed α)"}, {"key": "C", "text": "Replace nitroglycerin to Ranolazine", "why": "Ranolazine ไม่ใช่ยาหลักของ vasospastic angina"}, {"key": "D", "text": "Add aspirin", "why": "Aspirin ไม่ช่วย vasospasm (high dose อาจแย่ลง)"}, {"key": "E", "text": "Add amlodipine", "why": "ถูก — CCB เป็นยาหลักป้องกัน vasospastic angina"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Vasospastic (Prinzmetal) angina: เจ็บขณะพัก โดยเฉพาะเช้ามืด ST elevation ชั่วคราว\n• Prevention = CCB (DHP หรือ non-DHP) ± long-acting nitrate\n• หลีกเลี่ยง non-selective β-blocker (unopposed α-mediated coronary spasm) โดยเฉพาะใน asthma", "explanation": "Vasospastic angina + asthma → เพิ่ม CCB (amlodipine)", "source_note": "Vasospastic angina: CCB เปนยาหลัก (DHP/Non-DHP) + nitrate หามให propranolol (nonselective β-blocker ) ใน asthma และอาจทำ spasm แยลงได", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Vasospastic angina", "lecture_guess": ["L08"]}}, {"id": "52-MCQ-067", "n": 67, "type": "MCQ", "stem": "A 68-year-old man with hypertension and benign prostatic hyperplasia (BPH) is currently taking amlodipine 10 mg daily. After 6 weeks, his blood pressure remains 158/96 mmHg. Which of the following is the most appropriate add-on therapy?", "options": [{"key": "A", "text": "Increase amlodipine to 15 mg", "why": "Amlodipine max 10 mg/day"}, {"key": "B", "text": "Add hydrochlorothiazide", "why": "ถูก — combination CCB + thiazide-like diuretic ตาม guideline"}, {"key": "C", "text": "Add prazosin", "why": "Prazosin ช่วย BPH แต่ไม่ใช่ add-on ลำดับแรกสำหรับ HTN (ALLHAT: HF มากขึ้น)"}, {"key": "D", "text": "Add propranolol", "why": "β-blocker ไม่ใช่ add-on ลำดับแรกถ้าไม่มี compelling indication"}, {"key": "E", "text": "Switch to losartan", "why": "เปลี่ยนเป็น monotherapy ไม่ช่วยคุม BP"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• HTN step-up: CCB/ACEi-ARB/thiazide เป็น first-line\n• ถ้าไม่ถึงเป้าให้ใช้ 2-drug combination (ACEi/ARB + CCB หรือ + thiazide)\n• α-blocker เป็นยาลำดับหลัง (resistant HTN) แม้มี BPH", "explanation": "Amlodipine เต็ม dose แล้ว BP ยังสูง → เพิ่ม thiazide", "source_note": "amlodipine max dose 10mg/day, ให thiazide ไปเสริม ตาม guideline", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Antihypertensive combination", "lecture_guess": ["L13"]}}, {"id": "52-MCQ-068", "n": 68, "type": "MCQ", "stem": "A 68-year-old patient suffers a cardiac arrest. The ECG shows ventricular fibrillation (VF). Cardiopulmonary resuscitation (CPR) is initiated. Which of the following drugs is indicated for pharmacological treatment in this scenario?", "options": [{"key": "A", "text": "Digoxin", "why": "Digoxin ไม่ใช้ใน arrest"}, {"key": "B", "text": "Flecainide", "why": "Flecainide ไม่ใช้ใน VF/structural heart"}, {"key": "C", "text": "Procainamide", "why": "Procainamide ใช้ใน stable VT ไม่ใช่ arrest"}, {"key": "D", "text": "Diltiazem", "why": "Diltiazem ไม่ใช้ใน VF"}, {"key": "E", "text": "Amiodarone", "why": "ถูก — amiodarone 300 mg IV หลัง shock ครั้งที่ 3 ใน shockable rhythm"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• ACLS shockable rhythm (VF/pulseless VT): CPR + defibrillation → epinephrine 1 mg ทุก 3–5 นาที (หลัง shock ที่ 2) → amiodarone 300 mg (หลัง shock ที่ 3) แล้ว 150 mg\n• ทางเลือก lidocaine", "explanation": "VF ระหว่าง CPR → amiodarone", "source_note": "Broad-spectrum antiarrhythmic, VF = Shock + CPR + Amiodarone", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "apply", "topic": "Drugs in cardiac arrest", "lecture_guess": ["L09", "CC2"]}}, {"id": "52-MCQ-069", "n": 69, "type": "MCQ", "stem": "A 65-year-old man presents with อาการ. Initial ECG shown below. After 2 defibrillations, what is the most appropriate management? (VF รูปคล้าย ๆ ครอปมาจาก V6 ของอันนี้)", "options": [{"key": "A", "text": "Digoxin", "why": "ไม่ใช้"}, {"key": "B", "text": "Diltiazem", "why": "ไม่ใช้"}, {"key": "C", "text": "Flecainide", "why": "ไม่ใช้ใน VF"}, {"key": "D", "text": "Amiodarone", "why": "ถูก — refractory VF หลัง defibrillation → amiodarone (+ epinephrine)"}, {"key": "E", "text": "Procainamide", "why": "ไม่ใช้ใน pulseless arrest"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "k ารกเขียวรุนแรงตั้งแต่แรกเกิด\n• ท่องเป็นคู่:\n• boot-shaped = TOF\n• egg-on-a-string = TGA\n• snowman = TAPVR\n• box-shaped = Ebstein", "explanation": "Egg-on-a-string = Transposition of the great arteries", "source_note": "egg on string heart (d-TGA)", "refs": [], "tags": {"discipline": "clinical", "bloom": "recall", "topic": "CXR signs of CHD", "lecture_guess": ["L12", "L11"]}}, {"id": "52-MCQ-074", "n": 74, "type": "MCQ", "stem": "A 1-month-old infant presents with tachypnea and cyanosis. CXR shows right atrial enlargement and cardiomegaly. Which is most likely?", "options": [{"key": "A", "text": "Ebstein anomaly", "why": "ถูก — Ebstein: tricuspid leaflets เลื่อนลงใน RV → atrialized RV, RA โตมาก, cardiomegaly (box-shaped)"}, {"key": "B", "text": "Tricuspid atresia", "why": "Tricuspid atresia หัวใจไม่โตมาก ปอดดำ"}, {"key": "C", "text": "TAPVR", "why": "TAPVR → snowman/pulmonary congestion"}, {"key": "D", "text": "ASD", "why": "ASD มักไม่มีอาการในทารก"}, {"key": "E", "text": "Pulmonary stenosis", "why": "PS → PA โต"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Ebstein anomaly: apical displacement ของ septal/posterior tricuspid leaflets → atrialization ของ RV, TR, RA enlargement มาก (box-/balloon-shaped heart), right-to-left shunt ผ่าน PFO/ASD (เขียว), WPW ร่วมได้\n• สัมพันธ์กับ lithium ในครรภ์", "explanation": "RA โต + cardiomegaly + เขียวในทารก = Ebstein anomaly", "source_note": "tricuspid เลื่อนลงไปใน RV ทำให atrialization ของ RV (พื้นที่มากขึ้น)", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "Ebstein anomaly", "lecture_guess": ["L11", "L12"]}}, {"id": "52-MCQ-075", "n": 75, "type": "MCQ", "stem": "A 63-year-old woman with a history of long-standing hypertension presents with exertional dyspnea. Chest X-ray shows a double density along the right cardiac border and elevation of the left main bronchus. Which of the following findings best indicates left atrial enlargement?", "options": [{"key": "A", "text": "Leftward and downward displacement of cardiac apex", "why": "Apex เลื่อนซ้าย-ล่าง = LV enlargement"}, {"key": "B", "text": "Widening of the cardiophrenic angle", "why": "Cardiophrenic angle กว้าง = RA/pericardial effusion"}, {"key": "C", "text": "Fullness beneath the ascending aortic shadow", "why": "Fullness ใต้ ascending aorta ไม่ใช่ sign ของ LA"}, {"key": "D", "text": "Concave left cardiac border", "why": "Left border เว้า = PA เล็ก (เช่น TOF)"}, {"key": "E", "text": "Double density at the left retrocardiac shadow", "why": "ถูก — double density sign (เงา LA ซ้อนใน retrocardiac) ร่วมกับ carina กว้าง/left main bronchus ยกขึ้น"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "LA enlargement บน CXR: double density (double contour) ที่ขอบขวา/retrocardiac, left main bronchus ยก (splaying of carina > 90°), straightening ของ left heart border จาก LA appendage, lateral view: ดัน esophagus ไปหลัง", "explanation": "Double density sign = LA enlargement", "source_note": "LA enlargement = double density + Lt. main bronchus ถูกยกขึ้นและถูกดันไปขางหลังติด spine", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "CXR: chamber enlargement", "lecture_guess": ["L12"]}}, {"id": "52-MCQ-076", "n": 76, "type": "MCQ", "stem": "A 60-year-old man presents to the emergency department with acute chest pain, fatigue, and sweating for 6 hours. Blood tests are sent for total CK and CK-MB mass. Reference values: Total CK: 0-190 U/L, CK-MB mass: 0-4.87 ng/mL. Which of the following results most strongly supports a diagnosis of acute myocardial infarction (AMI)?", "options": [{"key": "A", "text": "Total CK = 200, CK-MB mass = 5", "why": "สูงกว่าปกติเล็กน้อย ไม่ชัดเจน"}, {"key": "B", "text": "Total CK = 220, CK-MB mass = 5", "why": "สูงเล็กน้อย"}, {"key": "C", "text": "Total CK = 250, CK-MB mass = 10", "why": "CK-MB 10 สูงแต่ total CK ยังไม่มาก"}, {"key": "D", "text": "Total CK = 280, CK-MB mass = 10", "why": "สูงขึ้น แต่น้อยกว่า E"}, {"key": "E", "text": "Total CK = 320, CK-MB mass = 15", "why": "ถูก — total CK และ CK-MB สูงชัดเจนที่สุด (CK-MB ~3 เท่าของ upper limit)"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• CK-MB (mass) ขึ้นใน 3–6 ชม\n• peak 12–24 ชม\n• กลับปกติ 48–72 ชม\n• (ใช้ดู reinfarction)\n• ค่าที่สูงชัดเกิน 99th percentile URL และสัดส่วน CK-MB/total CK สูงสนับสนุน myocardial origin ปัจจุบันใช้ troponin เป็นหลัก", "explanation": "ค่าที่สูงชัดที่สุดทั้ง total CK และ CK-MB สนับสนุน AMI มากสุด", "source_note": "สูงชัดสุด", "refs": [], "tags": {"discipline": "biochem", "bloom": "apply", "topic": "CK-MB interpretation", "lecture_guess": ["L16"]}}, {"id": "52-MCQ-077", "n": 77, "type": "MCQ", "stem": "A 58-year-old man presents with chest pain for 3 hours. Which of the following biomarkers is most specific and sensitive for myocardial infarction?", "options": [{"key": "A", "text": "CK-MB", "why": "CK-MB specific น้อยกว่า troponin"}, {"key": "B", "text": "Troponin I", "why": "ถูก — cardiac troponin I/T sensitive และ specific ที่สุด (gold standard)"}, {"key": "C", "text": "Myoglobin", "why": "Myoglobin ขึ้นเร็วแต่ไม่ specific"}, {"key": "D", "text": "LDH", "why": "LDH ขึ้นช้า ไม่ specific"}, {"key": "E", "text": "AST", "why": "AST ไม่ specific"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Cardiac troponin (cTnI/cTnT) เป็น biomarker มาตรฐานของ MI (Fourth Universal Definition: rise/fall ≥ 1 ค่าเกิน 99th percentile URL)\n• ขึ้น 3–4 ชม\n• peak 24–48 ชม\n• อยู่ได้ 7–14 วัน", "explanation": "Troponin I sensitive และ specific ที่สุดสำหรับ MI", "source_note": "spec, sens ดีสุด /gold standard", "refs": [], "tags": {"discipline": "biochem", "bloom": "recall", "topic": "Cardiac biomarkers", "lecture_guess": ["L16", "CC3"]}}, {"id": "52-MCQ-078", "n": 78, "type": "MCQ", "stem": "A 62-year-old man with a history of hypertension and type 2 diabetes mellitus presents to the emergency department with sudden-onset crushing chest pain radiating to the left arm, associated with sweating and nausea. Vital signs: BP 150/85 mmHg, HR 95 bpm, RR 18/min, SpO₂ 98%. Physical examination: No signs of heart failure, lungs clear, heart sounds normal. An ECG shows ST-segment depression in leads V4-V6. The physician orders initial blood tests, including Troponin I, which comes back 0.03 ng/mL (normal <0.04 ng/mL). Which of the following is the most appropriate next step to confirm or rule out acute myocardial infarction?", "options": [{"key": "A", "text": "Measure BNP to assess heart failure", "why": "BNP ใช้กับ HF ไม่ใช่ rule out MI"}, {"key": "B", "text": "Start intravenous diuretics immediately", "why": "ไม่มี HF ไม่ต้องให้ diuretic"}, {"key": "C", "text": "Perform serial Troponin I measurements over the next 6-12 hours", "why": "ถูก — troponin อาจยังไม่ขึ้นในช่วงแรก ต้องเจาะซ้ำ (serial) เพื่อดู rise/fall"}, {"key": "D", "text": "Order D-dimer to rule out pulmonary embolism", "why": "อาการ/ECG ไม่ชี้ไปทาง PE"}, {"key": "E", "text": "Immediate cardiac CT without repeat biomarkers", "why": "ไม่ควรข้ามการวัด biomarker ซ้ำ"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• NSTE-ACS: ECG ST depression + troponin ครั้งแรกปกติ ไม่ rule out MI เพราะ troponin ต้องใช้เวลาขึ้น → serial troponin (hs-cTn 0/1 ชม\n• หรือ 0/3 ชม\n• conventional 6–12 ชม.) เพื่อดู dynamic change", "explanation": "Troponin ครั้งแรกปกติแต่สงสัย ACS → serial troponin", "source_note": "sudden chest pain -> troponin ยังไมขึ้น /Troponin levels usually begin to rise sharply within 3 to 12 hours after the onset of the heart attack symptoms.", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "Serial troponin in ACS", "lecture_guess": ["L16", "CC3"]}}, {"id": "52-MCQ-079", "n": 79, "type": "MCQ", "stem": "A term newborn presents with severe cyanosis, tachypnea, single S2, and no definable murmur. Which of the following best explains the mechanism of cyanosis in this patient?", "options": [{"key": "A", "text": "Inadequate alveolar ventilation", "why": "ปัญหา ventilation ไม่ใช่สาเหตุ (single S2 บ่งบอกปัญหาหัวใจ)"}, {"key": "B", "text": "Poor tissue perfusion", "why": "Poor perfusion → peripheral cyanosis ไม่ใช่ severe central cyanosis"}, {"key": "C", "text": "Parallel circuits of systemic and pulmonary circulations", "why": "ถูก — d-TGA: systemic และ pulmonary circulation ขนานกัน เลือด deoxygenated กลับไป aorta"}, {"key": "D", "text": "Decreased systemic vascular resistance", "why": "ไม่ใช่กลไก"}, {"key": "E", "text": "Poor cardiac pumping", "why": "Pump failure ไม่ใช่สาเหตุของ cyanosis ทันทีหลังคลอด"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["d-TGA: aorta ออกจาก RV, PA ออกจาก LV", {"s": "Systemic และ pulmonary circulation เป็นวงจรขนาน (parallel circuits)", "answer": true}, "Deoxygenated blood จาก RV → aorta วนกลับร่างกาย", "รอดได้จาก mixing (PDA, PFO/ASD, VSD)", "PDA ปิด → severe central cyanosis"], "key_concept": "• d-TGA: severe cyanosis ตั้งแต่แรกเกิด single loud S2 (aorta อยู่หน้า) มักไม่มี murmur\n• รักษา PGE1 ให้ ductus เปิด + balloon atrial septostomy → arterial switch", "explanation": "เขียวรุนแรง + single S2 + ไม่มี murmur = d-TGA จาก parallel circulation", "source_note": "sign ขางตน เปนของ TGA หมดเลย severe นาจะเปน central cyanosis ขอ B E นาจะไปทาง peripheral มากกวา D เลือดนาจะไปงายขึ้น A ทำใหเกิดได แตเหมือนปญหาจะอยูที่หัวใจ เพราะ single S2", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "Transposition of great arteries", "lecture_guess": ["L11"]}}, {"id": "52-MCQ-080", "n": 80, "type": "MCQ", "stem": "A patient has an ASD. Which of the following best describes the direction of blood flow?", "options": [{"key": "A", "text": "RA → LA → LV → Ao → Lung", "why": "ทิศ RA → LA เป็น right-to-left (ไม่ใช่ ASD ปกติ)"}, {"key": "B", "text": "RA → RV → PA → Lung → LA → LV → Ao", "why": "เป็นทางเดินเลือดปกติ ไม่มี shunt"}, {"key": "C", "text": "LA → RA → RV → PA → Lung → LA", "why": "ถูก — left-to-right shunt ระดับ atrium: LA → RA → RV → PA → lung → LA"}, {"key": "D", "text": "LV → Ao → RA → RV → PA → Lung", "why": "ไม่ใช่ ASD"}, {"key": "E", "text": "PV → RA → LA → LV → Ao", "why": "ทางเดินผิด"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["LA pressure > RA pressure + RV compliant กว่า LV", {"s": "Shunt LA → RA (left-to-right)", "answer": true}, "RA → RV → PA volume overload", "Pulmonary flow ↑ → กลับ LA", "Fixed split S2 + pulmonic flow murmur", "ระยะยาว pulmonary HTN → Eisenmenger (กลับเป็น R→L)"], "key_concept": "ASD เป็น acyanotic left-to-right shunt: RA/RV โต, pulmonary plethora, fixed wide split S2", "explanation": "ASD เป็น left-to-right shunt: LA → RA → RV → PA → ปอด → LA", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "ASD hemodynamics", "lecture_guess": ["L11"]}}, {"id": "52-MCQ-081", "n": 81, "type": "MCQ", "stem": "A pediatrician performs the knee-chest maneuver on a child having a hypoxic spell. Which of the following is the main cardiovascular response during this maneuver?", "options": [{"key": "A", "text": "Increase HR", "why": "HR ไม่ใช่กลไกหลัก"}, {"key": "B", "text": "Increase vagal activity", "why": "ไม่ใช่กลไก"}, {"key": "C", "text": "Increase PVR", "why": "PVR ↑ ทำให้ R→L shunt มากขึ้น (แย่ลง)"}, {"key": "D", "text": "Increase SVR", "why": "ถูก — knee-chest กด femoral arteries → SVR ↑ → R→L shunt ลด"}, {"key": "E", "text": "Decrease SVR", "why": "SVR ↓ ทำให้ shunt มากขึ้น"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["TOF hypoxic (tet) spell: RVOT spasm → R→L shunt ผ่าน VSD ↑", "Knee-chest position: กด femoral arteries + venous return จากขาลด", {"s": "SVR ↑", "answer": true}, "LV/aortic pressure ↑ → R→L shunt ↓", "Pulmonary blood flow ↑ → oxygenation ↑ (เขียวลดลง)"], "key_concept": "Tet spell management: knee-chest, O₂, morphine, IV fluid, phenylephrine (เพิ่ม SVR), propranolol (ลด RVOT spasm), bicarbonate", "explanation": "Knee-chest เพิ่ม SVR ลด right-to-left shunt ใน TOF", "source_note": "SVR ↑ → ลด right-to-left shunt → เลือดไปปอดมากขึ้น → เขียวนอยลง", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "Tet spell", "lecture_guess": ["L11"]}}, {"id": "52-MCQ-082", "n": 82, "type": "MCQ", "stem": "A 70-year-old man presents with chronic dyspnea and bilateral leg edema. Laboratory result shows NT-proBNP = 5000 pg/mL (normal <125 pg/mL). Which of the following interpretations is most appropriate?", "options": [{"key": "A", "text": "This result rules out heart failure.", "why": "ค่าสูงมาก ไม่ rule out"}, {"key": "B", "text": "This result is not specific for heart failure.", "why": "NT-proBNP สูงได้จาก AKI/CKD, AF, PE, อายุ — จริงอยู่บ้างแต่ค่า 5000 + อาการ HF บ่งชี้ HF ชัด"}, {"key": "C", "text": "This result confirms heart failure.", "why": "ถูก (ตามเฉลย) — NT-proBNP 5000 + dyspnea + leg edema สนับสนุน HF อย่างมาก"}, {"key": "D", "text": "This result indicates acute myocardial infarction.", "why": "ไม่บ่งบอก MI"}, {"key": "E", "text": "This result suggests chronic kidney disease only.", "why": "CKD อาจทำให้สูงได้ แต่ไม่ใช่ 'only'"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Natriuretic peptides: ค่าต่ำมีประโยชน์ rule out HF (NPV สูง: BNP < 35–100, NT-proBNP < 125 ใน chronic/< 300 ใน acute)\n• ค่าสูงมาก + อาการเข้ากันสนับสนุน HF แต่ต้องยืนยันด้วย echocardiography\n• สาเหตุอื่นที่ทำให้สูง: อายุมาก, ไตเสื่อม, AF, PE, sepsis", "explanation": "NT-proBNP สูงมากร่วมกับอาการ HF สนับสนุนการวินิจฉัย HF", "source_note": "คาสูงมาก → strongly supportive ของ HF", "refs": [], "tags": {"discipline": "biochem", "bloom": "apply", "topic": "NT-proBNP interpretation", "lecture_guess": ["L16", "CC4"]}}, {"id": "52-MCQ-083", "n": 83, "type": "MCQ", "stem": "A 72-year-old man presents with progressive dyspnea, orthopnea, and leg edema. Physical examination shows bibasilar crackles and elevated JVP. Which of the following laboratory tests is most useful to diagnose or rule out heart failure?", "options": [{"key": "A", "text": "Troponin I", "why": "Troponin สำหรับ myocardial injury"}, {"key": "B", "text": "Serum creatinine", "why": "Creatinine ดูไต"}, {"key": "C", "text": "NT-proBNP", "why": "ถูก — NT-proBNP ใช้ diagnose/rule out HF"}, {"key": "D", "text": "D-dimer", "why": "D-dimer สำหรับ VTE"}, {"key": "E", "text": "C-reactive protein", "why": "CRP ไม่ specific"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "ผู้ป่วยสงสัย HF: natriuretic peptide (BNP/NT-proBNP) เป็น lab ที่ช่วยวินิจฉัยและ rule out ได้ดีที่สุด แล้วยืนยันด้วย echocardiography", "explanation": "Lab ที่ใช้ diagnose/rule out HF = NT-proBNP", "source_note": "NT-proBNP ใชตรวจ HF", "refs": [], "tags": {"discipline": "biochem", "bloom": "recall", "topic": "Natriuretic peptides in HF", "lecture_guess": ["L16", "CC4"]}}, {"id": "52-MCQ-084", "n": 84, "type": "MCQ", "stem": "A 68-year-old man presents with progressive dyspnea on exertion and orthopnea. On examination, he has bibasilar crackles and S3 gallop. Which of the following signs is most directly associated with left-sided heart failure?", "options": [{"key": "A", "text": "Jugular venous distension (JVD)", "why": "JVD = right-sided HF/volume overload"}, {"key": "B", "text": "Paroxysmal nocturnal dyspnea (PND)", "why": "ถูก — PND เกิดจาก pulmonary congestion (left-sided)"}, {"key": "C", "text": "Peripheral edema", "why": "Peripheral edema = right-sided"}, {"key": "D", "text": "Hepatomegaly", "why": "Hepatomegaly = right-sided"}, {"key": "E", "text": "Ascites", "why": "Ascites = right-sided"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["LV failure → LVEDP ↑", "LA + pulmonary venous pressure ↑", "นอนราบ: venous return จากขา/edema ↑", {"s": "Pulmonary congestion/interstitial edema", "note": "ตื่นมาหอบหลังหลับ 1–2 ชม."}, {"s": "Paroxysmal nocturnal dyspnea", "answer": true}], "key_concept": "• Left HF → อาการจาก pulmonary congestion: dyspnea, orthopnea, PND, crackles, S3\n• Right HF → systemic venous congestion: JVD, hepatomegaly, ascites, peripheral edema", "explanation": "PND สะท้อน pulmonary congestion จาก left-sided HF", "source_note": "LV failure → pulmonary congestion → เลือดคางในปอด , อื่นๆ เหมือนจะ right side heart failure", "refs": [], "tags": {"discipline": "clinical", "bloom": "understand", "topic": "Left vs right HF", "lecture_guess": ["CC4"]}}, {"id": "52-MCQ-085", "n": 85, "type": "MCQ", "stem": "Which of the following is the most recently discovered neurohormonal-blocking agent shown to improve outcomes in patients with heart failure with reduced ejection fraction (HFrEF)?", "options": [{"key": "A", "text": "SGLT2 receptor blockers", "why": "ถูก (ตามเฉลย) — SGLT2 inhibitor (dapagliflozin, empagliflozin) เป็นยากลุ่มล่าสุดใน GDMT ของ HFrEF"}, {"key": "B", "text": "Aldosterone antagonists", "why": "MRA ใช้มานาน (RALES 1999)"}, {"key": "C", "text": "ACE inhibitors", "why": "ACEi เป็นยาเก่า"}, {"key": "D", "text": "Beta-blockers", "why": "β-blocker เป็นยาเก่า"}, {"key": "E", "text": "Neprilysin inhibitors", "why": "Neprilysin inhibitor (sacubitril/valsartan, PARADIGM-HF 2014) ใหม่ แต่ก่อน SGLT2i (DAPA-HF 2019)"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• GDMT 4 เสาของ HFrEF: ARNI/ACEi/ARB + evidence-based β-blocker + MRA + SGLT2 inhibitor (ลด mortality/HF hospitalization)\n• SGLT2i ไม่ใช่ neurohormonal blocker โดยตรง และชื่อที่ถูกคือ 'SGLT2 inhibitor' ไม่ใช่ 'receptor blocker'", "explanation": "ยาล่าสุดใน GDMT ของ HFrEF คือ SGLT2 inhibitor", "source_note": "most recently discovery -> SGLT2 พึ่งเจอและใหผลได", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "recall", "topic": "GDMT in HFrEF", "lecture_guess": ["CC4"]}}, {"id": "52-MCQ-086", "n": 86, "type": "MCQ", "stem": "A 55-year-old man presents with chest pain radiating to the left shoulder. Serum testing reveals elevated troponin I. Emergency coronary angiography shows 70% narrowing of the proximal circumflex and anterior descending arteries. Which of the following complications is most likely to occur within one hour of this event?", "options": [{"key": "A", "text": "Valvular insufficiency", "why": "Papillary muscle rupture → acute MR เกิดวันที่ 2–7"}, {"key": "B", "text": "Ventricular fibrillation", "why": "ถูก — VF/arrhythmia เป็นสาเหตุตายที่พบบ่อยที่สุดในชั่วโมงแรก"}, {"key": "C", "text": "Pericarditis", "why": "Pericarditis วันที่ 1–3 (หรือ Dressler สัปดาห์)"}, {"key": "D", "text": "Thromboembolism", "why": "Mural thrombus/embolism สัปดาห์ 1–2"}, {"key": "E", "text": "Myocardial rupture", "why": "Free wall rupture วันที่ 3–7"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Timeline ของ MI complications: < 24 ชม. = arrhythmia (VF), cardiogenic shock, HF\n• 1–3 วัน = fibrinous pericarditis\n• 3–14 วัน = free wall rupture, septal rupture, papillary muscle rupture, LV pseudoaneurysm\n• สัปดาห์–เดือน = true aneurysm, mural thrombus, Dressler syndrome", "explanation": "ภายใน 1 ชั่วโมงหลัง MI ภาวะแทรกซ้อนที่พบบ่อยสุดคือ VF", "source_note": "เกิดเร็วที่สุด (minutes–hours) ,myocardial rupture / pericarditis = หลายวันถัดมา", "refs": [], "tags": {"discipline": "pathology", "bloom": "recall", "topic": "Complications of MI", "lecture_guess": ["L14", "CC3"]}}, {"id": "52-MCQ-087", "n": 87, "type": "MCQ", "stem": "A 65-year-old woman with a history of colon cancer is admitted for evaluation of acute chest pain and shortness of breath. Physical examination shows swelling and pitting edema of the left leg. 2 days after admission, she suddenly develops right-sided weakness and slurred speech. Which of the following is the most likely underlying cause of her stroke?", "options": [{"key": "A", "text": "Myocardial infarction", "why": "MI → mural thrombus ได้ แต่ข้อมูลชี้ DVT"}, {"key": "B", "text": "Aortic dissection", "why": "Aortic dissection ไม่เข้ากับ DVT"}, {"key": "C", "text": "Cardiac tamponade", "why": "Tamponade ไม่ทำ stroke"}, {"key": "D", "text": "Pulmonary embolism", "why": "ถูก (ตามเฉลย) — DVT/PE จาก hypercoagulable state (cancer); RV pressure ↑ จาก PE เปิด PFO → paradoxical embolism ไปสมอง"}, {"key": "E", "text": "Tension pneumothorax", "why": "Pneumothorax ไม่ทำ stroke"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Colon cancer → hypercoagulable state", "DVT ขาซ้าย", "Embolus → PE (เจ็บอก หอบ)", {"s": "RA/RV pressure ↑ → right-to-left ผ่าน PFO", "note": "paradoxical embolism"}, {"s": "Embolus เข้า systemic circulation → stroke", "answer": true}], "key_concept": "• Paradoxical embolism: venous thrombus ผ่าน PFO/ASD ไป systemic arterial circulation พบเมื่อ right-sided pressure สูง (PE, Valsalva)\n• Cancer (Trousseau) เพิ่มความเสี่ยง VTE", "explanation": "DVT → PE → right pressure ↑ → paradoxical embolism ผ่าน PFO → stroke", "source_note": "มี colon cancer → hypercoagulable state-> ลื่มเลือดเลือดเกิด งาย,dyspnea → นึกถึง PE,ขา บวม + pitting edema → DVT ซึ่งสามารถไปสมอง และปอด ทำใหตอบ PE ซึ่งจะโยงไปที่ เกิดลื่มเลือดอุดตัน", "refs": [], "tags": {"discipline": "pathology", "bloom": "analyze", "topic": "Paradoxical embolism", "lecture_guess": ["L14"]}}, {"id": "52-MCQ-088", "n": 88, "type": "MCQ", "stem": "What history is most indicative of congestive heart failure (CHF) in an infant?", "options": [{"key": "A", "text": "Frequent episodes of common cold", "why": "หวัดบ่อยอาจพบใน left-to-right shunt แต่ไม่ specific"}, {"key": "B", "text": "Prolonged milk feeding (>5-10 minutes) with sweating", "why": "ถูก — ดูดนมนาน + เหงื่อออก = feeding intolerance จาก HF ในทารก (feeding = exercise ของทารก)"}, {"key": "C", "text": "Able to play and keep up with friends", "why": "เล่นตามเพื่อนได้ = ไม่มี HF"}, {"key": "D", "text": "Good exercise tolerance for age", "why": "Exercise tolerance ดี = ไม่มี HF"}, {"key": "E", "text": "Occasional mild cough without respiratory distress", "why": "ไอเล็กน้อยไม่มี distress ไม่บ่ง HF"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• อาการ CHF ในทารก: ดูดนมเหนื่อย ใช้เวลานาน (> 20–30 นาที หรือหยุดพักบ่อย) เหงื่อออกขณะดูด, tachypnea, failure to thrive, hepatomegaly\n• สาเหตุที่พบบ่อยคือ large left-to-right shunt (VSD, PDA, AVSD)", "explanation": "ทารกดูดนมนานและเหงื่อออก = สัญญาณ CHF", "source_note": "infant = ทารก เลือดไปเลี้ยงไมพอทำใหเหนื่อยงาย + เลือดคั่งในปอด", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "Heart failure in infants", "lecture_guess": ["L11"]}}, {"id": "52-MCQ-089", "n": 89, "type": "MCQ", "stem": "A patient develops a systemic infection and dies shortly afterward. Autopsy reveals Aschoff bodies in the heart. Which of the following clinical manifestations could the patient have experienced before death?", "options": [{"key": "A", "text": "Pulmonary edema", "why": "Pulmonary edema ไม่ใช่ Jones criteria"}, {"key": "B", "text": "Chorea", "why": "ถูก — Sydenham chorea เป็น major Jones criterion ของ acute rheumatic fever"}, {"key": "C", "text": "Myocardial infarction", "why": "MI ไม่เกี่ยวกับ ARF"}, {"key": "D", "text": "Hemoptysis", "why": "Hemoptysis พบใน chronic MS ระยะหลัง"}, {"key": "E", "text": "Peripheral neuropathy", "why": "Peripheral neuropathy ไม่เกี่ยว"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Aschoff body (granuloma + Anitschkow cells) = pathognomonic ของ acute rheumatic carditis\n• Jones criteria major (J♥NES): Joints (migratory polyarthritis), ♥ carditis, Nodules (subcutaneous), Erythema marginatum, Sydenham chorea\n• + หลักฐาน GAS infection (ASO)", "explanation": "Aschoff bodies = rheumatic fever ซึ่งมี chorea เป็น major criterion", "source_note": "Aschoff bodies เปนลักษณะพยาธิสภาพจำเพาะของ acute rheumatic fever ,Jones criteria: carditis, polyarthritis, chorea, erythema marginatum, subcutaneous nodules", "refs": [], "tags": {"discipline": "pathology", "bloom": "apply", "topic": "Rheumatic fever", "lecture_guess": ["L14"]}}, {"id": "52-MCQ-090", "n": 90, "type": "MCQ", "stem": "A 52-year-old man with a history of mitral valve prolapse presents with fever, malaise, and a new systolic murmur. Infective endocarditis (IE) is suspected. Which of the following investigations is most critical for establishing the microbiologic diagnosis?", "options": [{"key": "A", "text": "Chest X-ray", "why": "CXR ไม่ระบุเชื้อ"}, {"key": "B", "text": "Electrocardiogram (ECG)", "why": "ECG ไม่ระบุเชื้อ"}, {"key": "C", "text": "Transthoracic echocardiography (TTE)", "why": "TTE ดู vegetation (major criterion) แต่ไม่ใช่ microbiologic diagnosis"}, {"key": "D", "text": "Blood cultures", "why": "ถูก — blood culture 3 ชุด ก่อนให้ antibiotic"}, {"key": "E", "text": "Urinalysis", "why": "UA ไม่ระบุเชื้อ"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Modified Duke criteria: major = blood culture บวกเชื้อ typical (≥ 2 ชุด) + echocardiographic evidence (vegetation, abscess, new regurgitation)\n• Microbiologic diagnosis ต้องใช้ blood culture 3 ชุด จากคนละตำแหน่ง ห่างกัน ก่อนเริ่มยา", "explanation": "วินิจฉัยเชื้อใน IE ด้วย blood cultures", "source_note": "ควรเจาะเลือดเพาะเชื้อ 3 ชุด จากตำแหนงหลอดเลือดดำคนละจุดทันทีเมื่อสงสัยภาวะ infective endocarditis และควรทำกอนเริ่มใหยาปฏิชีวนะ", "refs": [], "tags": {"discipline": "microbiology", "bloom": "recall", "topic": "Infective endocarditis diagnosis", "lecture_guess": ["L14"]}}, {"id": "52-MCQ-091", "n": 91, "type": "MCQ", "stem": "A 56-year-old woman diagnosed with left breast cancer underwent mastectomy with axillary lymph node dissection. Six months postoperatively, she developed persistent swelling of the left arm. On physical examination: Temperature: 36.9 °C, Non-pitting edema of the left arm, No redness or tenderness. What is the most likely mechanism of her edema?", "options": [{"key": "A", "text": "Lymphatic obstruction", "why": "ถูก — axillary lymph node dissection → lymphatic obstruction → non-pitting lymphedema"}, {"key": "B", "text": "Excessive water intake", "why": "ดื่มน้ำมากไม่ทำ edema แขนข้างเดียว"}, {"key": "C", "text": "Increased interstitial oncotic pressure", "why": "Interstitial oncotic ↑ เป็นผลของ lymphedema (โปรตีนคั่ง) ไม่ใช่กลไกต้นเหตุ"}, {"key": "D", "text": "Increased interstitial hydrostatic pressure", "why": "Interstitial hydrostatic ↑ ไม่ใช่สาเหตุต้น"}, {"key": "E", "text": "Increased vascular permeability", "why": "Vascular permeability ↑ → inflammation (มีแดง/กดเจ็บ)"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Mastectomy + axillary lymph node dissection", {"s": "Lymphatic obstruction", "answer": true}, "Protein-rich interstitial fluid คั่ง", "Interstitial oncotic pressure ↑ + fibrosis", "Non-pitting edema ของแขนข้างเดียวกัน"], "key_concept": "• Edema 4 กลไก (Starling): capillary hydrostatic ↑, plasma oncotic ↓, permeability ↑, lymphatic obstruction\n• Lymphedema = protein-rich, non-pitting ระยะหลัง (fibrosis), ข้างเดียว เช่น post-mastectomy, filariasis", "explanation": "Non-pitting edema แขนหลังเลาะต่อมน้ำเหลืองรักแร้ = lymphatic obstruction", "source_note": "Inguinal or axillary lymph node injury is the most significant risk factor for lymphedema.", "refs": [], "tags": {"discipline": "pathology", "bloom": "apply", "topic": "Mechanisms of edema", "lecture_guess": ["L14", "L07"]}}, {"id": "52-MCQ-092", "n": 92, "type": "MCQ", "stem": "A 12-year-old girl presents with fever, joint pain, and a new heart murmur. Laboratory tests show positive anti-streptolysin O (ASO) titers. Which of the following best explains the mechanism of her heart disease?", "options": [{"key": "A", "text": "Direct bacterial invasion of the myocardium", "why": "ไม่ใช่ direct invasion (เชื้อไม่อยู่ในหัวใจ)"}, {"key": "B", "text": "Autoimmune response via molecular mimicry", "why": "ถูก — molecular mimicry: anti-M protein cross-react กับ myosin/valve"}, {"key": "C", "text": "Endothelial injury from hypertension", "why": "ไม่ใช่ HTN"}, {"key": "D", "text": "Viral infection of the cardiac myocytes", "why": "ไม่ใช่ viral myocarditis"}, {"key": "E", "text": "Atherosclerotic plaque formation", "why": "ไม่ใช่ atherosclerosis"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Group A Streptococcal pharyngitis (2–4 สัปดาห์ก่อน)", "สร้าง antibody/T cell ต่อ M protein", {"s": "Molecular mimicry: cross-react กับ cardiac myosin, valve glycoprotein", "answer": true}, "Type II hypersensitivity → pancarditis", "Fever, migratory polyarthritis, new murmur (MR)"], "key_concept": "• Acute rheumatic fever เป็นโรค autoimmune หลัง GAS pharyngitis (ไม่ใช่ skin infection)\n• ระยะยาว chronic rheumatic heart disease → mitral stenosis", "explanation": "Rheumatic heart disease เกิดจาก molecular mimicry หลังติดเชื้อ GAS", "source_note": "เด็กหญิงมี ไข ปวดขอ murmur + ASO titer positive → ชี้ไปที่ acute rheumatic fever (ARF) หลังติดเชื้อ Group A Streptococcus แอนติเจนของเชื้อ Streptococcus (เชน M protein) มีโครงสรางคลายโปรตีนในหัวใจ (myosin, valvular tissue) รางกายสราง antibody และ T cell มาทำลายเชื้อ แตเกิด cross-reaction กับเนื้อเยื่อตนเอง", "refs": [], "tags": {"discipline": "pathology", "bloom": "understand", "topic": "Pathogenesis of rheumatic fever", "lecture_guess": ["L14"]}}, {"id": "52-MCQ-093", "n": 93, "type": "MCQ", "stem": "A 25-year-old man presents with acute chest pain, fatigue, and dyspnea after a recent viral upper respiratory infection. Which of the following is the most common infectious cause of myocarditis?", "options": [{"key": "A", "text": "Influenza virus", "why": "Influenza ทำได้แต่พบน้อยกว่า"}, {"key": "B", "text": "Epstein-Barr virus", "why": "EBV ไม่ใช่สาเหตุหลัก"}, {"key": "C", "text": "Coxsackieviruses", "why": "ถูก — Coxsackie B (enterovirus) เป็นสาเหตุ viral myocarditis ที่พบบ่อยที่สุด (คลาสสิก)"}, {"key": "D", "text": "Streptococcus pyogenes", "why": "S. pyogenes → rheumatic carditis (ไม่ใช่ direct infection)"}, {"key": "E", "text": "Staphylococcus aureus", "why": "S. aureus → infective endocarditis"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Myocarditis: viral พบบ่อยที่สุด (คลาสสิก Coxsackie B\n• ปัจจุบัน parvovirus B19, HHV-6 พบบ่อยขึ้น), ตามหลัง URI\n• อาการ chest pain, HF, arrhythmia\n• ระยะยาวอาจเป็น dilated cardiomyopathy\n• Pathology: lymphocytic infiltrate + myocyte necrosis", "explanation": "Viral myocarditis หลัง URI ที่พบบ่อยที่สุดเกิดจาก Coxsackievirus", "source_note": "เปน acute viral myocarditis -> Most commonly implicated: enterovirus (e.g., coxsackie B1-B5 virus), parvovirus B19, human herpesvirus 6, adenovirus, HCV, HIV", "refs": [], "tags": {"discipline": "pathology", "bloom": "recall", "topic": "Myocarditis", "lecture_guess": ["L14"]}}, {"id": "52-MCQ-095", "n": 95, "type": "MCQ", "stem": "จาก ECG เป็นโรคอะไร", "options": [{"key": "A", "text": "Mobitz type 1", "why": "ผิด — Mobitz I ต้องเห็น PR ยาวขึ้นเรื่อยๆ จนมี P ที่ไม่มี QRS ตาม แต่ ECG นี้ P ทุกตัวมี QRS"}, {"key": "B", "text": "Mobitz type 2", "why": "ผิด — Mobitz II ต้องมี QRS หายไปเป็นช่วงๆ ซึ่งไม่พบ"}, {"key": "C", "text": "Dilated cardiomyopathy", "why": "ไม่ใช่คำตอบที่ดีที่สุด — DCM ทำให้ ECG ผิดปกติได้หลายแบบ แต่ไม่เฉพาะกับ high voltage"}, {"key": "D", "text": "Hypertension", "why": "ถูก — QRS สูงมาก (LVH voltage) สาเหตุที่พบบ่อยที่สุดคือ hypertension"}, {"key": "E", "text": "Chronic lung disease", "why": "ผิด — chronic lung disease ให้ low voltage + right axis"}], "answer": "D", "answer_verified": true, "answer_status": "corrected", "explanation_style": "principle", "source_answer": "A", "source_answer_note": "ต้นฉบับเฉลย A (Mobitz type 1) โน้ตบรรยายว่า PR ยาวขึ้นจน drop แต่ ECG ของข้อนี้ไม่มีลักษณะนั้น ผู้จำโจทย์อาจใส่รูปผิด", "key_concept": "อ่าน ECG ทีละขั้น: (1) rhythm สม่ำเสมอ P ทุกตัวมี QRS ตาม PR คงที่ → ไม่มี AV block (2) QRS ใน V2–V3 สูงมากจนล้นช่อง → LVH ตาม voltage criteria (Sokolow–Lyon: S ใน V1/V2 + R ใน V5/V6 ≥ 35 mm) (3) LVH พบบ่อยที่สุดจาก hypertension (pressure overload เรื้อรัง).\nTrap: อย่าตอบ AV block ถ้ายังไม่เห็น P ที่ไม่มี QRS ตาม", "image_caption": "12-lead ECG: sinus rhythm, P ทุกตัวตามด้วย QRS, PR คงที่, QRS voltage สูงมากใน V2–V3 (ซ้อนกับ lead ข้างเคียง)", "explanation": "ECG ไม่มี AV block แต่ QRS voltage สูง = LVH → hypertension", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "ECG: LVH vs AV block", "lecture_guess": ["L03", "CC2"]}, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAEQAhoDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqO ", "explanation_style": "principle", "key_concept": "• Vulnerable plaque: thin fibrous cap, large necrotic lipid core, macrophage/T cell infiltration (MMP สลาย collagen), ไม่จำเป็นต้องตีบมาก\n• Rupture → thrombosis → ACS\n• Stable plaque: thick cap, ตีบมาก → stable angina", "explanation": "Plaque ที่ fibrous cap บางแตกง่ายและทำให้เกิด ACS", "source_note": "Unstable plaques are lipid-rich and covered by thin fibrous caps : high risk of rupture and acute coronary syndrome", "refs": [], "tags": {"discipline": "pathology", "bloom": "understand", "topic": "Vulnerable plaque", "lecture_guess": ["L14", "CC3"]}}, {"id": "52-MCQ-097", "n": 97, "type": "MCQ", "stem": "A 60-year-old man presents with acute coronary syndrome and started on an oral antiplatelet prodrug that requires hepatic activation by CYP2C19 to inhibit platelet aggregation. Genetic testing shows he is a CYP2C19 poor metabolizer. Which of the following drugs is being described?", "options": [{"key": "A", "text": "Ticagrelor", "why": "Ticagrelor ไม่ใช่ prodrug (ออกฤทธิ์ตรง reversible)"}, {"key": "B", "text": "Prasugrel", "why": "Prasugrel เป็น prodrug แต่ไม่ขึ้นกับ CYP2C19 มาก"}, {"key": "C", "text": "Warfarin", "why": "Warfarin เป็น anticoagulant (CYP2C9/VKORC1)"}, {"key": "D", "text": "Clopidogrel", "why": "ถูก — clopidogrel เป็น prodrug ต้อง activate ด้วย CYP2C19; poor metabolizer ตอบสนองน้อย"}, {"key": "E", "text": "Rivaroxaban", "why": "Rivaroxaban เป็น factor Xa inhibitor"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• P2Y12 inhibitors: clopidogrel (prodrug 2 ขั้น ขึ้นกับ CYP2C19 — PPI omeprazole ลดฤทธิ์, poor metabolizer ควรเปลี่ยนเป็น ticagrelor/prasugrel), prasugrel (prodrug ขั้นเดียว แรงกว่า ห้ามใน prior stroke), ticagrelor (reversible ไม่ต้อง activate\n• ADR dyspnea)", "explanation": "Antiplatelet prodrug ที่ต้องใช้ CYP2C19 = clopidogrel", "source_note": "Clopidogrel = prodrug + ตองใช CYP2C19", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "recall", "topic": "P2Y12 inhibitors", "lecture_guess": ["CC3"]}}, {"id": "52-MCQ-098", "n": 98, "type": "MCQ", "stem": "A 65-year-old man presents with sudden onset of severe tearing chest pain radiating to the back for 1 hr. Right arm BP 90/60 mmHg, left arm BP 130/80 mmHg, 110 BPM. PE shows new early diastolic murmur at Left sternal border. (CXR Pic). What is the diagnosis?", "options": [{"key": "A", "text": "Acute aortic dissection", "why": "ถูก — tearing chest pain ร้าวไปหลัง + BP แขนสองข้างต่างกัน + AR murmur + widened mediastinum"}, {"key": "B", "text": "Acute cardiac tamponade", "why": "Tamponade: Beck's triad (hypotension, JVD, muffled heart sounds)"}, {"key": "C", "text": "Acute coronary syndrome", "why": "ACS ไม่ทำ BP แขนต่างกันหรือ AR ใหม่"}, {"key": "D", "text": "Acute rupture of Chordae Tendineae", "why": "Chordae rupture → acute MR (holosystolic murmur)"}, {"key": "E", "text": "Acute rupture of abdominal aortic aneurysm", "why": "AAA rupture → ปวดท้อง/หลัง hypotension"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Acute aortic dissection: ปวดฉีก (tearing) ทันทีร้าวไปหลัง, pulse/BP deficit ระหว่างแขน > 20 mmHg, new diastolic murmur (AR จาก dissection ขยายถึง aortic root), widened mediastinum บน CXR\n• Stanford A (ascending) → ผ่าตัดฉุกเฉิน\n• B → medical\n• ปัจจัยเสี่ยง: HTN, Marfan, bicuspid valve", "image_caption": "CXR: widened mediastinum", "explanation": "ปวดฉีกร้าวหลัง + BP แขนต่างกัน + AR + mediastinum กว้าง = aortic dissection", "source_note": "Asymmetrical blood pressure and pulse readings between limbs,Anterior chest (ascending) or back (descending) Interscapular or retrosternal pain Neck and jaw", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "Aortic dissection", "lecture_guess": ["CC5", "L14"]}, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQ cial swelling for 3 months. He has headache, shortness of breath, and facial pain. Chest X-ray shows a homogenous mass at the right lung apex. Neck and chest veins are dilated. Which of the following is the most likely diagnosis?", "options": [{"key": "A", "text": "Pulmonary embolism", "why": "PE ไม่ทำหน้า/แขนบวม"}, {"key": "B", "text": "Deep vein thrombosis", "why": "DVT แขนจะบวมแต่ไม่ทำหน้าบวม + venous distension ที่อก"}, {"key": "C", "text": "Central vein stenosis", "why": "Central vein stenosis มักพบใน dialysis catheter และไม่อธิบาย apical mass"}, {"key": "D", "text": "Superior vena cava (SVC) syndrome", "why": "ถูก — apical lung mass (Pancoast/bronchogenic carcinoma) กด SVC → หน้า แขน คอบวม เส้นเลือดดำโป่ง"}, {"key": "E", "text": "Congestive heart failure", "why": "CHF ทำขาบวม JVD ไม่ใช่หน้า/แขนข้างเดียว"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• SVC syndrome: สาเหตุที่พบบ่อยที่สุดคือ malignancy (lung cancer โดยเฉพาะ small cell, lymphoma)\n• อาการ facial/upper-limb swelling, dilated collateral veins ที่อก/คอ, headache, dyspnea, Pemberton sign", "explanation": "ผู้สูบบุหรี่มีก้อนที่ apex ปอด + หน้า/แขนบวม + เส้นเลือดดำโป่ง = SVC syndrome", "source_note": "Venous congestion of the head, neck, and upper extremities resulting from impaired venous flow through the superior vena cava (SVC) to the right atrium , คนไขมีประวัติสูบบุหรี่ซึ่ง อาจจะทำใหตัว malignant tumour ไปกดทับ SVC ได", "refs": [], "tags": {"discipline": "clinical", "bloom": "apply", "topic": "SVC syndrome", "lecture_guess": ["CC5"]}}, {"id": "52-MCQ-100", "n": 100, "type": "MCQ", "stem": "จากรูปเกิดจากอะไร", "options": [{"key": "A", "text": "Chronic inflammation", "why": "ไม่ใช่ chronic inflammation โดยตรง"}, {"key": "B", "text": "Chronic infection", "why": "ไม่มีลักษณะติดเชื้อ"}, {"key": "C", "text": "Valvular venous incompetence", "why": "ถูก — chronic venous insufficiency จาก venous valve incompetence → stasis dermatitis/hemosiderin/venous ulcer"}, {"key": "D", "text": "Lymphatic obstruction", "why": "Lymphedema: non-pitting ไม่มี hyperpigmentation แบบนี้"}, {"key": "E", "text": "Right-sided heart failure", "why": "Right HF → bilateral pitting edema ไม่ใช่ pigmentation เฉพาะที่"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": [{"s": "Venous valve incompetence", "answer": true}, "Venous reflux → ambulatory venous hypertension ที่ขา", "Capillary leakage ของ RBC + fibrinogen", "Hemosiderin deposition → hyperpigmentation", "Lipodermatosclerosis → venous ulcer (medial malleolus)"], "key_concept": "Chronic venous insufficiency (CEAP): varicose veins → edema → pigmentation/eczema → lipodermatosclerosis → healed/active ulcer ที่ gaiter area (เหนือ medial malleolus) ต่างจาก arterial ulcer ที่ปลายเท้า เจ็บ ชีพจรเบา", "image_caption": "ขาส่วนล่าง/ข้อเท้า: ผิวคล้ำสีน้ำตาล (hemosiderin), ผิวหนังแข็ง และแผลบริเวณ medial malleolus", "explanation": "Hyperpigmentation + ulcer ที่ข้อเท้า = chronic venous insufficiency จาก venous valve incompetence", "source_note": "ลิ้นหลอดเลือดดำเสื่อม (venous valve incompetence) → เลือดคั่งในขา → ความดันในหลอดเลือดดำสูง → เม็ดเลือดแดงรั่ว ออกมา แตกตัว → hemosiderin สะสม → ผิวคลํ้า และอาจเกิดแผลเรื้อรัง", "refs": [], "tags": {"discipline": "pathology", "bloom": "apply", "topic": "Chronic venous insufficiency", "lecture_guess": ["CC5"]}, "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAEcARoDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8Q
