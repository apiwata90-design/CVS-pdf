<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVS Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAFB; --surface:#FFFFFF; --ink:#18202E; --muted:#5B6474; --line:#E2E4EA;
  --artery:#B3202E; --artery-soft:#FBEDEE; --vein:#2C5AA0; --vein-soft:#EDF2FA;
  --ok:#1E7A4F; --ok-soft:#E8F4EE; --partial:#A86400; --partial-soft:#FBF2E2;
  --grid:rgba(179,32,46,.08); --grid-strong:rgba(179,32,46,.17);
  --font:"Anuphan","Leelawadee UI","Segoe UI","Noto Sans Thai","Thonburi",system-ui,sans-serif;
  --r-sm:6px; --r-md:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141B; --surface:#191E28; --ink:#E7E9EF; --muted:#9AA3B2; --line:#2A303C;
    --artery:#E25562; --artery-soft:#38191E; --vein:#77A2E6; --vein-soft:#1B2538;
    --ok:#4DB886; --ok-soft:#15302A; --partial:#E3A443; --partial-soft:#33281A;
    --grid:rgba(226,85,98,.10); --grid-strong:rgba(226,85,98,.22);
  }
}
:root[data-theme="dark"]{
  --paper:#11141B; --surface:#191E28; --ink:#E7E9EF; --muted:#9AA3B2; --line:#2A303C;
  --artery:#E25562; --artery-soft:#38191E; --vein:#77A2E6; --vein-soft:#1B2538;
  --ok:#4DB886; --ok-soft:#15302A; --partial:#E3A443; --partial-soft:#33281A;
  --grid:rgba(226,85,98,.10); --grid-strong:rgba(226,85,98,.22);
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 170px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.65;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--vein);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:12px}
.titlebar .sub{display:block}
.resetbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 12px;font-weight:600;font-size:.9rem;color:var(--ink)}
.resetbtn:hover{border-color:var(--artery);color:var(--artery)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:var(--r-md);padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:20;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.titlebar h1{font-size:1.15rem;font-weight:700;margin:0;letter-spacing:-.01em}
.hublink{display:inline-block;margin-bottom:2px;font-size:.85rem;color:var(--muted);text-decoration:none}
.hublink:hover{color:var(--ink)}
.titlebar .sub{color:var(--muted);font-size:.88rem}
nav.tabs{display:flex;gap:4px;margin-top:8px}
nav.tabs button{background:none;border:0;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--artery)}

/* question number navigator */
.qnav{display:flex;gap:8px;align-items:flex-start;margin:10px 0 4px}
.qrow{display:flex;gap:6px;overflow-x:auto;flex:1;padding:3px 2px 6px;scrollbar-width:thin}
.qnav.open .qrow{flex-wrap:wrap;overflow:visible;max-height:40vh;overflow-y:auto}
.qc{flex:none;min-width:34px;height:34px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem;color:var(--ink)}
.qc.answered{background:var(--line)}
.qc.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qc.wrong{background:var(--artery);border-color:var(--artery);color:#fff}
.qc.partial{background:var(--partial);border-color:var(--partial);color:#fff}
.qc.flag{background:var(--vein);border-color:var(--vein);color:#fff}
.qc.flag-ring{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--vein)}
.qc.cur{outline:2px solid var(--ink);outline-offset:2px}
.qexp{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;padding:0 10px;font-size:.85rem;margin-top:3px}
.qlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);padding-bottom:10px}
.qlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 8px;font-size:.92rem;max-width:100%}
.timer{margin-left:auto;font-weight:600;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:600}
.btn.primary{background:var(--artery);border-color:var(--artery);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* question */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px}
.qnum{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.qnum small{font-size:.9rem;color:var(--muted);font-weight:500}
.flag{background:none;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 10px;font-size:.85rem;color:var(--muted)}
.flag[aria-pressed="true"]{border-color:var(--partial);color:var(--partial);background:var(--partial-soft)}
.stem{margin:10px 0 16px;white-space:normal}
.case{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--vein);border-radius:var(--r-sm);padding:12px 14px;margin:10px 0 18px}
.case .lbl{font-size:.82rem;color:var(--vein);font-weight:600}
figure{margin:12px 0 16px}
.oldkey{margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r-sm);color:var(--muted);font-size:.9rem}
.oldkey b{display:block;margin-bottom:4px}
figure img{display:block;width:100%;max-width:760px;height:auto;max-height:75vh;object-fit:contain;object-position:left top;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;cursor:zoom-in}
figure img.zoom{position:fixed;inset:0;margin:auto;width:auto;max-width:96vw;max-height:96vh;object-position:center;border:0;background:transparent;z-index:1000;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(0,0,0,.8)}
figcaption{font-size:.85rem;color:var(--muted)}

.opts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt[aria-pressed="true"]{border-color:var(--ink)}
.opt[aria-pressed="true"] .k{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--artery);background:var(--artery-soft)}
.opt.wrong .k{background:var(--artery);border-color:var(--artery);color:#fff}
.opt:disabled{cursor:default}

.item{border-top:1px solid var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.item .prompt{font-weight:600;margin-bottom:8px}
.item .hint{font-size:.85rem;color:var(--muted);margin-bottom:6px}
textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:8px 10px;resize:vertical}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px}
.checks label.correct{border-color:var(--ok);background:var(--ok-soft)}
.checks label.wrong{border-color:var(--artery);background:var(--artery-soft)}
.verdict{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:.95rem}
.verdict.ok{background:var(--ok-soft)} .verdict.bad{background:var(--artery-soft)} .verdict.part{background:var(--partial-soft)}
.verdict b{display:block}
.override{display:inline-flex;gap:6px;margin-top:8px}
.override button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:3px 10px;font-size:.85rem}
.override button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.explain{margin-top:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.explain h3{margin:0 0 6px;font-size:1rem}
.disagree{display:inline-block;font-size:.8rem;color:var(--artery);background:var(--artery-soft);padding:1px 8px;border-radius:4px;margin-left:6px}
.unverified{display:inline-block;font-size:.8rem;color:var(--partial);background:var(--partial-soft);padding:1px 8px;border-radius:4px;margin-left:6px}
.refs{margin-top:12px;display:grid;gap:6px}
.ref{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:.93rem}
.ref a{color:var(--vein)}
.hot{font-size:.78rem;padding:1px 8px;border-radius:999px;background:var(--artery-soft);color:var(--artery);font-weight:600}
.tier{font-size:.78rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}

.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:8px 0 4px}
.chain .st{background:var(--vein-soft);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-weight:600;font-size:.93rem}
.chain .st.ans{background:var(--ok-soft);border-color:var(--ok)}
.chain .ar{color:var(--muted);font-weight:700}
ol.steps{margin:6px 0 0;padding-left:22px;font-size:.93rem}
ol.steps li{margin:2px 0}
.explain h4{margin:14px 0 4px;font-size:.95rem}
.answerline{padding:10px 12px;border-left:4px solid var(--ok,#1a7f4b);background:rgba(26,127,75,.07);border-radius:var(--r-sm)}
.answerline p{margin:0 0 2px}
ul.kc,ol.kc{margin:4px 0;padding-left:1.3em}
ul.kc li,ol.kc li{margin:3px 0}
.trap{margin-top:8px;padding:8px 10px;border-radius:var(--r-sm);background:rgba(217,119,6,.10);border-left:4px solid #d97706}
.trap b{display:block;margin-bottom:2px}
.auditnote{color:var(--muted);font-size:.85rem;margin-top:12px}
.why{display:block;font-size:.85rem;color:var(--muted);margin-top:3px}
.opt.correct .why,.opt.wrong .why{color:var(--ink)}
.doubt{margin-top:12px;border:1px dashed var(--line);background:none;border-radius:var(--r-sm);padding:4px 10px;font-size:.85rem;color:var(--muted)}
.doubt[aria-pressed="true"]{border-style:solid;border-color:var(--partial);color:var(--partial);background:var(--partial-soft)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0 40px}

/* guide + summary */
section.panel h2{font-size:1.25rem;margin:22px 0 6px;letter-spacing:-.01em}
section.panel p.lead{color:var(--muted);margin:0 0 14px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:8px 0 10px}
.bar span{display:block;height:100%}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.read{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px}
.read .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.read .where{font-weight:700;color:var(--ink)}
.read a.where{color:var(--vein)}
.read .meta{font-size:.88rem;color:var(--muted);margin-top:4px}
.jump{border:0;background:var(--vein-soft);color:var(--vein);border-radius:4px;padding:0 7px;margin:2px 3px 0 0;font-size:.85rem}
.tierhead{display:flex;align-items:center;gap:10px;margin:20px 0 8px}
.tierhead .dot{width:10px;height:10px;border-radius:50%}
.tierhead h3{margin:0;font-size:1.02rem}
.repbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--vein-soft);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin:16px 0 4px}
.repbar b{font-size:1rem}
.repbar .rp{color:var(--muted);font-size:.9rem}
.repbar .btn{margin-left:auto;padding:5px 12px;font-size:.88rem}
.meter{flex-basis:100%;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok)}
.qc.again{background:var(--artery-soft);border-color:var(--artery);color:var(--artery)}
.lcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);margin:12px 0;overflow:hidden}
.lcard>.lh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.lcard>.lh .ln{font-weight:700;font-size:1.05rem}
.lcard>.lh .lm{color:var(--muted);font-size:.88rem}
.topic{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.topic:first-of-type{border-top:0}
.topic .pg{font-weight:700;font-size:.95rem;line-height:1.4}
.topic .pg a{color:var(--vein)}
.topic .pg .td{display:block;margin-top:6px;width:8px;height:8px;border-radius:50%}
.topic .hd{font-weight:600}
.topic .sm{color:var(--muted);font-size:.9rem}
.topic ul.focus{margin:6px 0 2px;padding-left:18px;font-size:.93rem}
.topic ul.focus li{margin:2px 0}
.topic ul.focus .yr{color:var(--muted);font-size:.82rem;margin-left:4px}
.topic.support .hd,.topic.support .pg{color:var(--muted);font-weight:500}
.topic.other{background:var(--paper)}
.subhead{padding:8px 14px;font-size:.82rem;color:var(--muted);background:var(--paper);border-top:1px solid var(--line)}
.big{font-size:2.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-md);padding:14px}
.hidden{display:none!important}
@media (max-width:560px){ body{font-size:16px} .timer{margin-left:0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="titlebar"><div><a class="hublink hidden" id="hubLink" href="#">← รวมข้อสอบ</a><h1 id="title">CVS Quiz</h1><span class="sub" id="subtitle"></span></div><button class="resetbtn" id="resetBtn" title="ล้างคำตอบทั้งหมดของชุดนี้"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>รีเซ็ต</button></div>
    <nav class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="quiz">ทำข้อสอบ</button>
      <button role="tab" aria-selected="false" data-tab="guide">Guidereader</button>
      <button role="tab" aria-selected="false" data-tab="summary">สรุปผล</button>
    </nav>
    <div class="qnav" id="qnav"><div class="qrow" id="qrow" aria-label="เลขข้อ"></div><button class="qexp" id="qexp" aria-expanded="false">ดูทั้งหมด</button></div>
    <div class="qlegend"><span><i style="background:var(--ok)"></i>ถูก</span><span><i style="background:var(--artery)"></i>ผิด</span><span><i style="background:var(--partial)"></i>ถูกบางส่วน</span><span><i style="background:var(--vein)"></i>ปักธง</span><span><i style="background:var(--line)"></i>ตอบแล้ว รอตรวจ</span><span id="qdone"></span></div>
  </div>
</header>

<main class="wrap">
  <section id="tab-quiz" class="panel">
    <div id="repbar" class="repbar hidden"></div>
    <div class="toolbar" id="toolbar">
      <div class="seg" role="group" aria-label="โหมด">
        <button data-mode="practice" aria-pressed="true">ฝึก (เฉลยทันที)</button>
        <button data-mode="exam" aria-pressed="false">จับเวลา</button>
      </div>
      <select id="filterLecture" aria-label="กรองตาม Lecture"></select>
      <select id="filterStatus" aria-label="กรองตามสถานะ">
        <option value="all">ทุกข้อ</option>
        <option value="wrong">เฉพาะข้อที่ผิด</option>
        <option value="flagged">เฉพาะข้อที่ปักธง</option>
        <option value="blank">ยังไม่ได้ทำ</option>
      </select>
      <span class="timer" id="timer"></span>
    </div>
    <div id="question"></div>
    <div class="nav">
      <button class="btn" id="prev">ข้อก่อนหน้า</button>
      <button class="btn primary hidden" id="submitAll">ส่งคำตอบทั้งหมด</button>
      <button class="btn" id="next">ข้อถัดไป</button>
    </div>
  </section>

  <section id="tab-guide" class="panel hidden"></section>
  <section id="tab-summary" class="panel hidden"></section>
</main>

, "CC1": {"title": "Clinical correlation I: Shock", "file": "Clinical correlation 1_shock อ.วีรพงศ์.pdf"}, "CC2": {"title": "Clinical correlation II: ECG", "file": "Clinical correlation2_ECG_sheet_241068.pdf"}, "CC3": {"title": "Clinical correlation III: CAD", "file": "clinical correlation3_2021.pdf"}, "CC4": {"title": "Clinical correlation IV: Heart failure", "file": "Clinicalcorrelation5_Heart failure.pdf"}, "CC5": {"title": "Clinical correlation V: Vascular disorders", "file": "clinical correlation4_CVS-sectionI 2025.pdf"}, "CCX": {"title": "Clinical: Common congenital heart disease", "file": "clinical_congenital.pdf"}, "SDL1": {"title": "SDL Circulatory shock", "file": "SDL Circulatory shock.pdf"}, "LAB1": {"title": "Talk lab 1: Gross heart & great vessels", "file": "Talk lab1_Gross heart and great vv.pdf"}, "LAB3": {"title": "Talk lab 3: ECG interpretation", "file": "Talk lab3_accurate-electrocardiogram-interpretation-2008.pdf"}, "LAB3M": {"title": "ECG lab manual 2025", "file": "บทปฏิบัติการคลื่นไฟฟ้าหัวใจ-2025 (2).pdf"}, "LAB4": {"title": "Talk lab 4", "file": "TalkLab4 - CVS.pdf"}}, "questions": [{"id": "52-MCQ-001", "n": 1, "type": "MCQ", "stem": "A 60-year-old male, presents with severe chest pain. Coronary angiography shows severe narrowing of circumflex branch of Left coronary artery near its origin. What is the most likely affected part?", "options": [{"key": "A", "text": "Left ventricle", "why": "กว้างเกินไป LCx เลี้ยงเฉพาะผนัง lateral/posterior ของ LV ไม่ใช่ทั้ง LV"}, {"key": "B", "text": "Right ventricle", "why": "RV ได้เลือดจาก RCA (acute marginal)"}, {"key": "C", "text": "Inferior wall of heart", "why": "Inferior wall ส่วนใหญ่เป็นของ RCA (PDA) ใน right-dominant"}, {"key": "D", "text": "Anterior wall of heart", "why": "Anterior wall เป็นของ LAD"}, {"key": "E", "text": "Posterior wall of heart", "why": "ถูก — LCx วิ่งใน AV groove ซ้ายไปด้านหลัง เลี้ยง lateral + posterior wall ของ LV และ LA"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Coronary territory: LAD → anterior wall + anterior 2/3 IVS + apex\n• LCx → lateral และ posterior wall ของ LV + LA (ให้ obtuse marginal)\n• RCA → RA, RV, inferior wall และ posterior 1/3 IVS ผ่าน PDA (right-dominant ~70–80%)\n• โจทย์ตีบที่ proximal LCx → ผนังที่ขาดเลือดคือ lateral/posterior\nTrap: 'Left ventricle' ถูกบางส่วนแต่ไม่เจาะจง ข้อสอบต้องการผนัง (wall) และ inferior wall เป็นของ RCA ไม่ใช่ LCx (ยกเว้น left-dominant)", "explanation": "LCx เลี้ยงผนัง lateral/posterior ของ LV → ตอบ Posterior wall", "source_note": "Circumflex เลี้ยง LA", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Coronary artery territory", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-002", "n": 2, "type": "MCQ", "stem": "A 40-year-old woman was evaluated for her pulmonary stenosis what location is the best auscultation for her valve?", "options": [{"key": "A", "text": "LLSB", "why": "LLSB = tricuspid area"}, {"key": "B", "text": "RLSB", "why": "RLSB ไม่ใช่ตำแหน่งฟัง valve มาตรฐาน"}, {"key": "C", "text": "The left 2nd intercostal space near the lateral border of sternal body", "why": "ถูก — pulmonic area = left 2nd ICS parasternal"}, {"key": "D", "text": "The right 2nd intercostal space near the lateral border of sternal body", "why": "Right 2nd ICS = aortic area"}, {"key": "E", "text": "5th intercostal space just below the nipple", "why": "5th ICS midclavicular (ใต้ nipple) = mitral area/apex"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• จุดฟังเสียงลิ้นหัวใจ (auscultation area) ไม่ตรงกับตำแหน่งกายวิภาคของลิ้น แต่เป็นจุดที่เสียงส่งไปตามทิศการไหล:\n• Aortic = right 2nd ICS\n• Pulmonic = left 2nd ICS\n• Tricuspid = left lower sternal border (4th–5th ICS)\n• Mitral = left 5th ICS midclavicular line (apex)\n• Pulmonary stenosis จึงฟัง murmur ได้ดีที่ left 2nd ICS", "explanation": "Pulmonic area อยู่ที่ left 2nd ICS ชิดขอบ sternum", "source_note": "ตำแหนงของ Pulmonary valve", "refs": [], "tags": {"discipline": "anatomy", "bloom": "recall", "topic": "Valve auscultation areas", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-003", "n": 3, "type": "MCQ", "stem": "A 40-year-old man is brought to the emergency department after a car crash. He sustained a blunt injury to the sternum. Which of the following cardiac structures is most likely to be injured?", "options": [{"key": "A", "text": "Left ventricle", "why": "LV อยู่ด้านหลังซ้าย เห็นแค่ขอบซ้ายจากด้านหน้า"}, {"key": "B", "text": "Right ventricle", "why": "ถูก — RV เป็นส่วนที่อยู่หน้าสุด ติดหลัง sternum มากที่สุด"}, {"key": "C", "text": "Right atrium", "why": "RA เป็นขอบขวา ไม่ใช่ผิวหน้าหลัก"}, {"key": "D", "text": "Inferior vena cava", "why": "IVC อยู่ด้านหลังล่าง"}, {"key": "E", "text": "Ascending aorta", "why": "Ascending aorta อยู่ใน pericardium หลัง sternum ส่วนบน แต่พื้นที่สัมผัสน้อยกว่า RV"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Sternocostal (anterior) surface ของหัวใจส่วนใหญ่เป็น RV, ขอบขวาเป็น RA, ขอบซ้ายเป็น LV/auricle ของ LA\n• Blunt trauma ที่ sternum จึงทำให้ RV บาดเจ็บ (cardiac contusion) บ่อยที่สุด\nTrap: LA อยู่หลังสุด (ติด esophagus)", "explanation": "RV อยู่หน้าสุดและสัมผัส sternum มากสุด จึงบาดเจ็บง่ายสุด", "source_note": "RV อยู anterior สุด + ติด sternum สุด + พื้นที่โดนมาก", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Surfaces of the heart", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-004", "n": 4, "type": "MCQ", "stem": "During surgery on a newborn, a surgeon accidentally damages a structure located near the ductus arteriosus while attempting to ligate it. Which of the following structures is most likely injured?", "options": [{"key": "A", "text": "Phrenic nerve", "why": "Phrenic nerve วิ่งหน้า root of lung ห่างจาก ductus"}, {"key": "B", "text": "Vagus nerve", "why": "Vagus อยู่ใกล้ แต่ที่คล้องใต้ arch ติด ductus คือแขนง recurrent"}, {"key": "C", "text": "Recurrent laryngeal nerve", "why": "ถูก — Left recurrent laryngeal n. คล้องใต้ aortic arch ข้าง ligamentum/ductus arteriosus"}, {"key": "D", "text": "Sympathetic trunk", "why": "Sympathetic trunk อยู่ด้านหลังบน vertebra"}, {"key": "E", "text": "Thoracic duct", "why": "Thoracic duct อยู่หลัง esophagus ห่างจาก ductus"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Left vagus ให้แขนง left recurrent laryngeal nerve ที่วนใต้ aortic arch บริเวณ ligamentum arteriosum (เดิมคือ ductus arteriosus) แล้วขึ้นไปใน tracheoesophageal groove\n• ผ่าตัด ligate PDA จึงเสี่ยงทำให้เสียงแหบ (hoarseness)\nTrap: ขวาวนใต้ subclavian artery ไม่ใช่ arch", "explanation": "Ductus อยู่ติด left recurrent laryngeal nerve ที่วนใต้ aortic arch", "source_note": "Left recurrent laryngeal nerve อยูใต Aortic arch", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Left recurrent laryngeal nerve & ductus arteriosus", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-005", "n": 5, "type": "MCQ", "stem": "A 45-year-old man presented with acute abdominal pain. Thoracic magnetic resonance imaging showed anterior disc herniation at the T8-T9 level. Which of the following nerves or trunks is most likely to be compressed?", "options": [{"key": "A", "text": "The 9th intercostal nerve", "why": "ผิด — intercostal (spinal) nerve ถูกกดเมื่อ disc ยื่นไปด้านหลัง-ข้าง (posterolateral) เข้ารู intervertebral foramen ไม่ใช่ anterior"}, {"key": "B", "text": "Vagus nerve", "why": "ผิด — vagus อยู่หน้า esophagus ห่างจาก vertebral body"}, {"key": "C", "text": "Greater splanchnic nerve", "why": "ถูก — greater splanchnic n. (T5–T9) วางอยู่บนหน้า-ข้างของ vertebral body ระดับนี้ และนำความปวดจากอวัยวะช่องท้อง"}, {"key": "D", "text": "Phrenic nerve", "why": "ผิด — phrenic n. อยู่ข้าง pericardium ด้านหน้า"}, {"key": "E", "text": "Sympathetic trunk", "why": "เป็นไปได้รองลงมา — sympathetic trunk ก็อยู่ข้าง vertebral body แต่ไม่อธิบายอาการปวดท้องได้ดีเท่า splanchnic n."}], "answer": "C", "answer_verified": true, "answer_status": "corrected", "explanation_style": "both", "source_answer": "A", "source_answer_note": "ต้นฉบับเฉลย A (9th intercostal nerve) ซึ่งถูกถ้าเป็น posterolateral herniation ที่กด nerve root ตรง foramen แต่โจทย์ระบุว่า anterior และอาการเป็นปวดท้อง", "mechanism": ["Disc ระดับ T8–T9 ยื่นไปด้านหน้า (anterior)", "กดโครงสร้างที่วางบนหน้า-ข้าง vertebral body", {"s": "Greater splanchnic nerve (T5–T9) ถูกกด", "answer": true}, "Visceral afferent จากช่องท้องส่วนบนถูกระคายเคือง", "ปวดท้อง (visceral pain)"], "key_concept": "• ดูทิศที่ disc ยื่นก่อนเสมอ: ยื่นไปหลัง-ข้าง (พบบ่อยที่สุด) → กด spinal nerve ที่ intervertebral foramen → ปวดรอบอกตาม dermatome\n• ยื่นไปด้านหน้า → ไปชนสิ่งที่วางบน vertebral body คือ sympathetic trunk และ splanchnic nerves\n• Greater splanchnic nerve (จาก T5–T9) นำความรู้สึกปวดจากอวัยวะช่องท้องส่วนบน ผู้ป่วยมาด้วยปวดท้องจึงเข้ากับ C", "explanation": "Anterior disc herniation ที่ T8–T9 + ปวดท้อง → greater splanchnic nerve", "source_note": "disc กด spinal n. ที่ออกจาก intervertebral foramen ไดงาย", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Posterior mediastinum nerves", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-006", "n": 6, "type": "MCQ", "stem": "During a heart transplant procedure, the surgeon inserted his finger through the transverse pericardial sinus. He then pushed backward on the large vessel lying dorsal to his finger. Which of the following vessels is this?", "options": [{"key": "A", "text": "Aorta", "why": "Aorta อยู่หน้านิ้ว (นิ้วสอดผ่านหลัง aorta + pulmonary trunk)"}, {"key": "B", "text": "Subclavian artery", "why": "Subclavian artery อยู่นอก pericardium"}, {"key": "C", "text": "Superior vena cava", "why": "ถูก — หลังนิ้วใน transverse sinus คือ SVC (และ atria)"}, {"key": "D", "text": "Common carotid artery", "why": "Common carotid อยู่นอก pericardium"}, {"key": "E", "text": "Pulmonary vein", "why": "Pulmonary vein อยู่ล่างกว่า เป็นขอบของ oblique sinus"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Transverse pericardial sinus: ช่องระหว่าง arterial reflection (ascending aorta + pulmonary trunk ด้านหน้า) กับ venous reflection (SVC + pulmonary veins/atria ด้านหลัง)\n• ใน CABG/transplant สอดนิ้วผ่านเพื่อ clamp aorta/pulmonary trunk\n• สิ่งที่อยู่หลังนิ้วคือ SVC\nTrap: oblique sinus อยู่หลัง LA ล้อมด้วย pulmonary veins", "explanation": "นิ้วใน transverse sinus มี aorta/PT อยู่หน้า และ SVC อยู่หลัง", "source_note": "SVC อยูหลังนิ้ว / Aorta, Pulmonary Artery อยูหนานิ้ว", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Pericardial sinuses", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-007", "n": 7, "type": "MCQ", "stem": "An 8-year-old boy is found to have a midline tumor of the thymus gland. The mass exerts pressure on a posterior blood vessel. Which of the following vessels is most likely to be affected?", "options": [{"key": "A", "text": "Right superior intercostal vein", "why": "Right superior intercostal vein อยู่ด้านขวาหลัง ห่างจาก thymus"}, {"key": "B", "text": "Left brachiocephalic vein", "why": "ถูก — Left brachiocephalic vein วิ่งขวางหลัง thymus/manubrium"}, {"key": "C", "text": "Right pulmonary artery", "why": "Right pulmonary artery อยู่ลึกกว่า ใต้ arch"}, {"key": "D", "text": "Left pulmonary vein", "why": "Pulmonary vein อยู่ที่ LA ด้านหลัง"}, {"key": "E", "text": "Left bronchial artery", "why": "Bronchial artery อยู่หลัง ติด bronchus"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Superior mediastinum เรียงจากหน้าไปหลัง: thymus → brachiocephalic veins (left วิ่งขวางทแยงจากซ้ายไปขวา) + SVC → aortic arch และแขนง → trachea → esophagus\n• Tumor ของ thymus จึงกดหลอดเลือดที่อยู่หลังมันโดยตรงคือ left brachiocephalic vein", "explanation": "Left brachiocephalic vein อยู่ชิดหลัง thymus ที่สุด", "source_note": "อยูใกล thymus สุด", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Superior mediastinum relations", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-008", "n": 8, "type": "MCQ", "stem": "In the mid-thoracic region, the esophagus is compressed from the anterior side. Which of the following structures is most likely responsible for this compression?", "options": [{"key": "A", "text": "Right atrium", "why": "RA อยู่ขวาหน้า ไม่ติด esophagus"}, {"key": "B", "text": "Right ventricle", "why": "RV อยู่หน้าสุด"}, {"key": "C", "text": "Left atrium", "why": "ถูก — LA เป็นห้องหลังสุด ติดหน้าต่อ esophagus"}, {"key": "D", "text": "Left ventricle", "why": "LV อยู่ซ้ายล่าง ไม่ติด esophagus ระดับกลางอก"}, {"key": "E", "text": "Pulmonary trunk", "why": "Pulmonary trunk อยู่สูงและหน้า"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• LA เป็นห้องที่อยู่ด้านหลังสุดของหัวใจ (base) สัมผัส esophagus โดยตรง\n• LA enlargement (เช่น mitral stenosis) จึงกด esophagus ทำให้กลืนลำบาก (dysphagia) และเห็นใน barium swallow\n• เป็นเหตุผลที่ใช้ transesophageal echo ดู LA/LAA ได้ดี", "explanation": "LA อยู่หน้าต่อ esophagus โดยตรง", "source_note": "esophagus ถูกกดจากดานหนา ซึ่ง LA อยูดานหนา esophagus", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Posterior relations of the heart", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-009", "n": 9, "type": "MCQ", "stem": "During coronary bypass surgery, a surgeon prepared the anterior interventricular artery (left anterior descending artery) to receive a graft. He accidentally ligated the adjacent vein. Which of the following veins did he most likely ligate?", "options": [{"key": "A", "text": "Anterior cardiac vein", "why": "Anterior cardiac veins อยู่บนผิว RV เปิดเข้า RA ตรง"}, {"key": "B", "text": "Coronary sinus", "why": "Coronary sinus อยู่ใน posterior AV groove"}, {"key": "C", "text": "Middle cardiac vein", "why": "Middle cardiac vein คู่กับ PDA ใน posterior IV sulcus"}, {"key": "D", "text": "Small cardiac vein", "why": "Small cardiac vein คู่กับ right marginal artery"}, {"key": "E", "text": "Great cardiac vein", "why": "ถูก — Great cardiac vein วิ่งคู่ LAD ใน anterior IV sulcus"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• คู่ artery–vein ของหัวใจ: LAD ↔ great cardiac vein (anterior interventricular sulcus แล้ววนไปกับ LCx สู่ coronary sinus), PDA ↔ middle cardiac vein, right marginal ↔ small cardiac vein\n• Coronary sinus อยู่ posterior AV groove เปิดเข้า RA", "explanation": "Great cardiac vein วิ่งคู่ LAD", "source_note": "Great cardiac vein วิ่งคู LAD ใน Anterior interventricular sulcus", "refs": [], "tags": {"discipline": "anatomy", "bloom": "recall", "topic": "Cardiac veins", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-010", "n": 10, "type": "MCQ", "stem": "During a thoracic surgery near the superior vena cava (SVC), the surgeon observes a large vein crossing anteriorly from the left to the right side to drain into the SVC. Which of the following vessels is most likely being observed?", "options": [{"key": "A", "text": "Azygos vein", "why": "Azygos vein โค้งจากด้านหลังเข้า SVC ไม่ได้ข้ามจากซ้ายไปขวาด้านหน้า"}, {"key": "B", "text": "Right brachiocephalic vein", "why": "Right brachiocephalic vein ลงตรงแนวดิ่งทางขวา"}, {"key": "C", "text": "Left brachiocephalic vein", "why": "ถูก — Left brachiocephalic vein ข้ามจากซ้ายไปขวาด้านหน้า aortic arch branches มารวมเป็น SVC"}, {"key": "D", "text": "Internal jugular vein", "why": "IJV อยู่ที่คอ"}, {"key": "E", "text": "Subclavian vein", "why": "Subclavian vein อยู่ที่ฐานคอ รวมกับ IJV เป็น brachiocephalic"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• SVC เกิดจาก right + left brachiocephalic veins รวมกันหลัง right 1st costal cartilage\n• Left brachiocephalic vein ยาวกว่าเพราะต้องข้ามจากซ้ายไปขวาด้านหน้า branches ของ aortic arch\n• Azygos เข้า SVC จากด้านหลัง (arch of azygos เหนือ right main bronchus)", "explanation": "หลอดเลือดดำใหญ่ที่ข้ามซ้ายไปขวาเข้า SVC คือ left brachiocephalic vein", "source_note": "large vein วิ่งจากซายไปขวา แลวเขาสู SVC", "refs": [], "tags": {"discipline": "anatomy", "bloom": "recall", "topic": "Formation of SVC", "lecture_guess": ["L01"]}}, {"id": "52-MCQ-011", "n": 11, "type": "MCQ", "stem": "A histological section from a vessel obtained during abdominal surgery shows the following microscopic features: The tunica intima is thin and lined by a simple endothelium. The tunica media contains only a small number of smooth muscle cells, arranged mainly in a longitudinal direction, and is not well developed. The tunica adventitia, however, is relatively thick and composed of collagen and elastic fibers, with vasa vasorum present within it. Based on these histologic characteristics, which of the following vessels is most likely being described?", "options": [{"key": "A", "text": "Pulmonary trunk", "why": "Pulmonary trunk เป็น elastic artery media หนา มี elastic lamellae"}, {"key": "B", "text": "Internal jugular vein", "why": "IJV เป็น large vein ได้ แต่ไม่อยู่ในช่องท้อง"}, {"key": "C", "text": "Brachial vein", "why": "Brachial vein เป็น medium vein มี valve adventitia ไม่หนามาก"}, {"key": "D", "text": "Portal vein", "why": "ถูก — Portal vein เป็น large vein ในช่องท้อง: media บาง, adventitia หนาที่สุด มี longitudinal smooth muscle + vasa vasorum"}, {"key": "E", "text": "Femoral artery", "why": "Femoral artery เป็น muscular artery media หนาสุด มี IEL ชัด"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• แยก vessel ด้วยชั้นที่หนาที่สุด: artery → tunica media หนาสุด (elastic artery มี elastic lamellae, muscular artery มี smooth muscle + IEL ชัด)\n• vein → tunica adventitia หนาสุด\n• Large vein (IVC, portal, SVC) media บาง adventitia หนามากและมี longitudinal smooth muscle bundles + vasa vasorum. 'ได้จาก abdominal surgery' ตัด IJV/brachial vein ออก", "explanation": "Adventitia หนาที่สุด + media บาง + อยู่ในช่องท้อง = large vein เช่น portal vein", "source_note": "เปนหลอดเลือดดำขนาดใหญในชองทอง (Large vein) ซึ่งมีเอกลักษณคือชั้นนอก (Tunica adventitia) หนาที่สุดและมี vasa vasorum", "refs": [], "tags": {"discipline": "anatomy", "bloom": "understand", "topic": "Histology of large veins", "lecture_guess": ["L06"]}}, {"id": "52-MCQ-012", "n": 12, "type": "MCQ", "stem": "A pathologist examines a small blood vessel under the microscope. The tunica intima is thin. The tunica media consists of only 1-5 layers of circularly arranged smooth muscle cells, and there is no distinct internal or external elastic lamina. The tunica adventitia is very thin and poorly developed. Functionally, this vessel is primarily responsible for regulating blood flow into the capillary networks and controlling peripheral vascular resistance. Based on its histological features and function, which type of vessel is this?", "options": [{"key": "A", "text": "Elastic artery (e.g. aorta)", "why": "Elastic artery media หนามากด้วย elastic lamellae"}, {"key": "B", "text": "Muscular artery (e.g. brachial artery)", "why": "Muscular artery มี smooth muscle หลายชั้นและ IEL/EEL ชัด"}, {"key": "C", "text": "Arteriole", "why": "ถูก — Arteriole: smooth muscle 1–5 ชั้น ไม่มี IEL/EEL ชัด เป็น resistance vessel คุม flow เข้า capillary"}, {"key": "D", "text": "Venule", "why": "Venule ผนังบาง ไม่ได้คุม resistance"}, {"key": "E", "text": "Capillary", "why": "Capillary มีแค่ endothelium + basal lamina (± pericyte) ไม่มี media"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Arteriole = resistance vessel: smooth muscle 1–3 (ถึง 5) ชั้น, IEL บาง/ไม่ชัดในตัวเล็ก, adventitia บาง\n• การหด/คลายของ arteriole ควบคุม total peripheral resistance และ flow เข้า capillary bed (R ∝ 1/r⁴)\nTrap: metarteriole/precapillary sphincter มี smooth muscle เป็นวงไม่ต่อเนื่อง", "explanation": "Smooth muscle 1–5 ชั้น + คุม resistance = arteriole", "source_note": "เปนหลอดเลือดแดงขนาดเล็กที่มีกลามเนื้อเรียบ 1-5 ชั้น ทำหนาที่หลักในการ สรางความตานทาน (Resistance) เพื่อคุมความดันและปริมาณเลือดเขาสูเสนเลือดฝอย", "refs": [], "tags": {"discipline": "anatomy", "bloom": "understand", "topic": "Histology of arterioles", "lecture_guess": ["L06"]}}, {"id": "52-MCQ-013", "n": 13, "type": "MCQ", "stem": "A 3-month-old girl has a chest X-ray showed the heart in the right hemithorax, the apex is pointed to the right: which of the heart formation is underdeveloped?", "options": [{"key": "A", "text": "Bulboventricular looping", "why": "ถูก — ความผิดปกติของ bulboventricular (D-)looping ทำให้หัวใจอยู่ทางขวา apex ชี้ขวา (dextrocardia)"}, {"key": "B", "text": "Foramen ovale formation", "why": "Foramen ovale ผิดปกติ → ASD ไม่เปลี่ยนตำแหน่งหัวใจ"}, {"key": "C", "text": "Septation of the heart", "why": "Septation ผิดปกติ → VSD/ASD/AVSD"}, {"key": "D", "text": "Ventral bending of the heart tube", "why": "Ventral bending/folding ผิดปกติ → ectopia cordis"}, {"key": "E", "text": "Atrial trunk moves ventral to atrium", "why": "ไม่ใช่ขั้นตอนที่กำหนดทิศของ apex"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• สัปดาห์ที่ 4 heart tube โค้ง (cardiac looping) ไปทางขวา (D-loop) ทำให้ bulbus cordis ไปอยู่ขวาหน้าและ primitive ventricle ไปซ้าย apex จึงชี้ซ้าย\n• ถ้า loop ไปทางซ้าย (L-loop) หรือ looping ผิดปกติ → dextrocardia (± situs inversus)\n• Ectopia cordis เกิดจาก lateral body folding ผิดปกติ ไม่ใช่ looping", "explanation": "Apex ชี้ขวา = dextrocardia จาก bulboventricular looping ผิดปกติ", "source_note": "ปกติทอหัวใจตองมวนตัวไปทางขวา (D-looping) เพื่อใหยอดหัวใจ (Apex) ชี้ไปทางซาย ความผิดปกติในขั้นตอนนี้จึงทำใหหัวใจสลับไปอยูดานขวา (Dextrocardia)", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Cardiac looping & dextrocardia", "lecture_guess": ["L05", "L11"]}}, {"id": "52-MCQ-014", "n": 14, "type": "MCQ", "stem": "A 50-year-old man presents with fatigue and dyspnea. An ultrasound examination reveals an atrial septal defect located at the opening of the superior vena cava. Which of the following embryonic structures is most likely underdeveloped?", "options": [{"key": "A", "text": "Endocardial cushion", "why": "Endocardial cushion defect → ostium primum ASD/AVSD (ตำแหน่งต่ำใกล้ AV valve)"}, {"key": "B", "text": "Foramen ovale", "why": "Foramen ovale/secundum defect อยู่กลาง septum (fossa ovalis)"}, {"key": "C", "text": "Primitive atrium", "why": "Primitive atrium ไม่ใช่ต้นเหตุของ defect ที่ปาก SVC"}, {"key": "D", "text": "Sinus venosus", "why": "ถูก — Sinus venosus ASD อยู่ที่รอยต่อ SVC–RA จาก sinus venosus ถูก incorporate ไม่สมบูรณ์"}, {"key": "E", "text": "Septum primum", "why": "Septum primum ผิดปกติ → secundum ASD (มีรูมากไป) หรือ primum ASD"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• ชนิดของ ASD ตามตำแหน่ง: Secundum (พบบ่อยสุด, fossa ovalis\n• septum primum resorb มากไป/septum secundum สั้น), Primum (ต่ำ ติด AV valve\n• endocardial cushion), Sinus venosus (ปาก SVC มักร่วมกับ partial anomalous pulmonary venous return ของ right upper PV\n• sinus venosus incorporate เข้า RA ผิดปกติ), Coronary sinus (unroofed)", "explanation": "ASD ที่ปาก SVC = sinus venosus ASD", "source_note": "รอยโรคที่ตำแหนงรูเปด SVC เรียกวา Sinus Venosus ASD ซึ่งเกิดจากการดูดซึม (absorption) ของ Sinus venosus เขาสูหัวใจหองบนขวาไมสมบูรณ", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Types of ASD (embryology)", "lecture_guess": ["L05", "L11"]}}, {"id": "52-MCQ-015", "n": 15, "type": "MCQ", "stem": "A newborn presents with cyanosis and echocardiography shows a single large arterial trunk arising from the heart that gives rise to both aorta and pulmonary arteries. Which embryologic defect best explains this condition?", "options": [{"key": "A", "text": "Aortic sinus", "why": "Aortic sinus ไม่เกี่ยวกับการแบ่ง trunk"}, {"key": "B", "text": "Endocardial cushion fusion", "why": "Endocardial cushion fusion ผิดปกติ → AVSD"}, {"key": "C", "text": "Truncus arteriosus", "why": "ถูก — Persistent truncus arteriosus: aorticopulmonary (conotruncal) septum ไม่เกิด trunk เดียวให้ทั้ง aorta และ PA"}, {"key": "D", "text": "Membranous interventricular septum formation", "why": "Membranous IVS ผิดปกติ → VSD (มักร่วมกับ truncus แต่ไม่ใช่ตัวอธิบาย trunk เดียว)"}, {"key": "E", "text": "Sinus venosus", "why": "Sinus venosus → sinus venosus ASD"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Neural crest cells สร้าง aorticopulmonary (spiral/conotruncal) septum แบ่ง truncus arteriosus เป็น aorta + pulmonary trunk\n• ความผิดปกติของ septum:\n• ไม่เกิดเลย → persistent truncus arteriosus (+VSD เสมอ)\n• ไม่หมุนเกลียว → TGA\n• แบ่งไม่เท่า (เบี่ยง anterior) → Tetralogy of Fallot", "explanation": "Trunk เดียวให้ทั้ง aorta และ PA = persistent truncus arteriosus", "source_note": "ภาวะนี้คือ Persistent Truncus Arteriosus ซึ่งเกิดจากการที่ Aorticopulmonary septum ไมสามารถแบง Truncus arteriosus ใหแยกเปน Aorta และ Pulmonary artery ได", "refs": [], "tags": {"discipline": "anatomy", "bloom": "apply", "topic": "Conotruncal defects", "lecture_guess": ["L05", "L11"]}}, {"id": "52-MCQ-017", "n": 17, "type": "MCQ", "stem": "A patient with chronic stable angina is prescribed ivabradine. What is the primary pharmacological action of this drug?", "options": [{"key": "A", "text": "Increase heart rate", "why": "ตรงข้าม — ivabradine ลด HR"}, {"key": "B", "text": "Decrease heart rate", "why": "ถูก — ยับยั้ง funny current (If) ที่ SA node → phase 4 ช้าลง → HR ลด"}, {"key": "C", "text": "Increase myocardial contractility", "why": "ไม่มีผล inotropic"}, {"key": "D", "text": "Decrease preload", "why": "ไม่ได้ลด preload (นั่นคือ nitrate)"}, {"key": "E", "text": "Prolong QRS duration", "why": "ไม่มีผลต่อ QRS (ไม่ใช่ Na channel blocker)"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "both", "mechanism": ["Ivabradine", {"s": "Block HCN channel (If) ที่ SA node", "note": "funny current = Na⁺ inward ใน phase 4"}, "Slope ของ phase 4 depolarization ↓", "ถึง threshold ช้าลง", {"s": "Heart rate ↓", "answer": true}, "Diastolic time ↑ + O₂ demand ↓", "Angina ↓"], "key_concept": "• Ivabradine เป็น pure HR-lowering agent: block If ใน SA node โดยไม่มีผลต่อ contractility, BP หรือ AV conduction\n• ใช้ใน stable angina/HFrEF ที่ยังมี sinus rhythm HR ≥ 70 แม้ได้ beta-blocker\n• ADR: phosphenes (luminous visual phenomena จาก block HCN ใน retina), bradycardia", "explanation": "Ivabradine ยับยั้ง If ที่ SA node จึงลด heart rate", "source_note": "Ivabradine ออกฤทธิ์ยับยั้งกระแสไฟฟาที่ SA node โดยตรง ทำใหหัวใจเตนชาลง ลดภาระงานและการใชออกซิเจนของหัวใจ", "refs": [], "tags": {"discipline": "pharmacology", "bloom": "recall", "topic": "Ivabradine", "lecture_guess": ["L08"]}}, {"id": "52-MCQ-018", "n": 18, "type": "MCQ", "stem": "If a subject had the common carotid arteries partially compressed, which of the following would immediately occur?", "options": [{"key": "A", "text": "Increased cardiac accelerator center activity", "why": "ถูก — pressure ที่ carotid sinus ลด → baroreceptor firing ลด → cardioaccelerator (sympathetic) center ทำงานมากขึ้น"}, {"key": "B", "text": "Decreased heart rate", "why": "ตรงข้าม HR จะเพิ่ม"}, {"key": "C", "text": "Decreased venous tone", "why": "Venous tone จะเพิ่ม (sympathetic)"}, {"key": "D", "text": "Decreased cerebral blood flow", "why": "Cerebral flow คงที่ด้วย autoregulation + reflex ไม่ใช่ผลทันทีที่โจทย์ต้องการ"}, {"key": "E", "text": "Increased carotid sinus afferent nerve activity", "why": "ตรงข้าม — การกด common carotid (ต่ำกว่า sinus) ทำให้ pressure ใน sinus ลด afferent firing ลด"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["กด common carotid artery (ใต้ต่อ carotid sinus)", "Pressure ที่ carotid sinus ↓", "Stretch ของ baroreceptor ↓", {"s": "Afferent firing (CN IX) ↓"}, "NTS inhibit vasomotor center น้อยลง", {"s": "Cardioaccelerator/vasoconstrictor center activity ↑", "answer": true}, "Sympathetic ↑ / Vagal ↓", "HR ↑, contractility ↑, TPR ↑ → BP ↑"], "key_concept": "กด common carotid (proximal ต่อ sinus) = sinus เห็นความดันต่ำ ต่างจาก carotid sinus massage ที่กดตรง sinus = stretch เพิ่ม → HR ลด", "explanation": "กด common carotid → baroreceptor firing ลด → cardioaccelerator center ทำงานเพิ่ม", "source_note": "การกดหลอดเลือด Carotid ทำใหความดันเลือดที่ Carotid sinus ลดลง รางกายจึงตอบสนองผาน Baroreceptor reflex โดยเพิ่มการทำงานของ ระบบประสาท Sympathetic เพื่อกระตุนหัวใจใหเตนเร็วขึ้นและเพิ่มความดัน", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "Baroreceptor reflex", "lecture_guess": ["L10"]}}, {"id": "52-MCQ-019", "n": 19, "type": "MCQ", "stem": "During the plateau phase (Phase 2) of the ventricular action potential, which of the following ion channels is primarily responsible for sustaining depolarization and initiating excitation-contraction coupling?", "options": [{"key": "A", "text": "Fast voltage-gated 𝑁𝑎+channels", "why": "Fast Na⁺ ทำ phase 0 และ inactivate ไปแล้ว"}, {"key": "B", "text": "T-type 𝐶𝑎2+channels", "why": "T-type Ca²⁺ มีบทบาทใน pacemaker phase 4 ปลาย"}, {"key": "C", "text": "L-type 𝐶𝑎2+channels", "why": "ถูก — L-type Ca²⁺ (DHP receptor) inward ใน phase 2 สมดุลกับ K⁺ efflux และ trigger Ca-induced Ca release"}, {"key": "D", "text": "Delayed rectifier 𝐾+channels", "why": "Delayed rectifier K⁺ ทำ phase 3 repolarization"}, {"key": "E", "text": "Funny current (If) channels", "why": "If อยู่ใน pacemaker cell phase 4"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "both", "mechanism": ["  "bloom": "understand", "topic": "Atrial pressure waveform", "lecture_guess": ["L04"]}}, {"id": "52-MCQ-026", "n": 26, "type": "MCQ", "stem": "Which of the following factors increases the likelihood of blood flow changing from laminar to turbulent?", "options": [{"key": "A", "text": "Increased hematocrit (blood viscosity)", "why": "Viscosity ↑ → Re ↓ → laminar มากขึ้น"}, {"key": "B", "text": "Decreased blood volume", "why": "Blood volume ลดไม่ได้เพิ่ม Re โดยตรง"}, {"key": "C", "text": "Increased vessel cross-sectional area", "why": "Cross-sectional area รวม ↑ → velocity ↓ → Re ↓"}, {"key": "D", "text": "Increased vessel radius", "why": "ถูก — radius/diameter ↑ → Re ↑ (Re = ρvD/η)"}, {"key": "E", "text": "Decreased blood velocity", "why": "Velocity ↓ → Re ↓"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "both", "mechanism": [{"s": "Vessel radius (diameter) ↑", "note": "ที่ velocity เท่าเดิม"}, {"s": "Reynolds number ↑", "note": "Re = ρ·v·D / η"}, {"s": "Re > ~2000 → turbulent flow", "answer": true}], "key_concept": "• Reynolds number Re = ρvD/η: turbulent เมื่อ Re สูง (> 2000–3000)\n• เพิ่ม Re: velocity ↑ (stenosis, high CO), diameter ↑, viscosity ↓ (anemia → flow murmur)\nTrap: hematocrit ↑ ทำให้ viscosity ↑ จึงลด turbulence", "explanation": "Diameter ↑ ทำให้ Reynolds number ↑ จึงมีแนวโน้ม turbulent", "source_note": "การเปลี่ยนจาก laminar → turbulent flow ขึ้นกับ Reynolds number (Re) Re=ρvD/μ (velocity ↑, diameter ↑, viscosity ↓)", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Laminar vs turbulent flow", "lecture_guess": ["L07"]}}, {"id": "52-MCQ-027", "n": 27, "type": "MCQ", "stem": "The third heart sound (S3) is primarily associated with which physiological event?", "options": [{"key": "A", "text": "Closure of the tricuspid and mitral valves", "why": "AV valve ปิด = S1"}, {"key": "B", "text": "Atrial contraction", "why": "Atrial contraction เข้า ventricle แข็ง = S4"}, {"key": "C", "text": "Rapid passive filling of the ventricles from the atria", "why": "ถูก — S3 = rapid passive filling ช่วง early diastole เลือดกระแทกผนัง ventricle"}, {"key": "D", "text": "Ventricular ejection into the aorta and pulmonary artery", "why": "Ejection ไม่มีเสียง (เว้น ejection click)"}, {"key": "E", "text": "Turbulent flow from stenotic semilunar valves", "why": "Stenotic semilunar = systolic murmur"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["S2 (ต้น diastole)", "AV valve เปิด", {"s": "Rapid passive ventricular filling", "answer": true}, "เลือดกระแทกผนัง ventricle ที่ compliance สูง/volume overload", "S3"], "key_concept": "• S3 (early diastole หลัง S2) ปกติได้ในเด็ก/หญิงตั้งครรภ์/นักกีฬา\n• ในผู้ใหญ่ >40 ปี บ่งบอก volume overload/systolic HF\n• S4 (late diastole ก่อน S1) = atrial kick เข้า ventricle แข็ง (LVH, ischemia) ไม่เกิดใน AF", "explanation": "S3 = rapid passive filling ของ ventricle ใน early diastole", "source_note": "หลัง S2 เปน abnormal heartsound ในผูใหญ เกิดใน early diastole", "refs": [], "tags": {"discipline": "physiology", "bloom": "recall", "topic": "S3 heart sound", "lecture_guess": ["L04"]}}, {"id": "52-MCQ-028", "n": 28, "type": "MCQ", "stem": "During late diastole, atrial contraction actively contributes to ventricular filling. Which of the following best describes its primary physiological effect?", "options": [{"key": "A", "text": "Initiates isovolumetric contraction by abruptly increasing ventricular pressure above atrial pressure", "why": "Isovolumetric contraction เริ่มจาก ventricular systole ไม่ใช่ atrial"}, {"key": "B", "text": "Enhances rapid ventricular ejection by increasing systolic pressure", "why": "Atrial kick ไม่ได้เพิ่ม systolic pressure โดยตรง"}, {"key": "C", "text": "Supplies the final 20-30% of ventricular volume prior to systole, increasing end- diastolic volume and stroke volume", "why": "ถูก — atrial kick เติม 20–30% สุดท้าย → EDV ↑ → SV ↑ (Frank–Starling)"}, {"key": "D", "text": "Generates the S2 heart sound by closure of semilunar valves", "why": "S2 เกิดจาก semilunar valves ปิด"}, {"key": "E", "text": "Facilitates closure of AV valves by creating a pressure gradient across the valves", "why": "AV valve ปิดเมื่อ ventricular pressure > atrial pressure ตอน systole"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Late diastole: atrial contraction", {"s": "เติมเลือดเพิ่ม 20–30%"}, {"s": "EDV ↑", "answer": true}, "Preload ↑ → sarcomere stretch ↑", {"s": "SV ↑", "answer": true, "note": "Frank–Starling"}], "key_concept": "• Atrial kick สำคัญมากเมื่อ ventricle แข็ง (LVH, elderly) หรือ HR เร็ว\n• การเสีย atrial kick ใน AF ทำให้ CO ลด 20–30%", "explanation": "Atrial contraction เติม 20–30% สุดท้าย เพิ่ม EDV และ SV", "source_note": "Extra filling เปน active เพื่อเพิ่ม EDV", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Atrial kick", "lecture_guess": ["L04"]}}, {"id": "52-MCQ-029", "n": 29, "type": "MCQ", "stem": "When afterload increases, what happens to the PV loop?", "options": [{"key": "A", "text": "ESV ↓, SV ↑", "why": "ESV ↓ SV ↑ = contractility ↑"}, {"key": "B", "text": "ESV ↑, SV ↓", "why": "ถูก — afterload ↑ → ventricle บีบเลือดออกได้น้อยลง ESV ↑ SV ↓"}, {"key": "C", "text": "EDV ↑, SV ↑", "why": "EDV ↑ SV ↑ = preload ↑"}, {"key": "D", "text": "EDV ↓, SV ↓", "why": "EDV ↓ SV ↓ = preload ↓"}, {"key": "E", "text": "No change", "why": "มีการเปลี่ยนแปลง"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": [{"s": "Afterload ↑", "note": "เช่น aortic pressure/TPR ↑"}, "Aortic valve เปิดที่ pressure สูงขึ้น (loop สูงขึ้น)", "Ejection สั้นลง/ปริมาณน้อยลง", {"s": "ESV ↑", "answer": true}, {"s": "SV ↓", "answer": true, "note": "SV = EDV − ESV"}], "key_concept": "• PV loop: preload ↑ → loop กว้างไปขวา (EDV ↑, SV ↑)\n• afterload ↑ → loop สูงและแคบ (ESV ↑, SV ↓)\n• contractility ↑ → ESPVR ชันขึ้น (ESV ↓, SV ↑)", "explanation": "Afterload เพิ่มทำให้ ESV เพิ่ม SV ลด", "source_note": "บีบออกยาก ทำให ESV เหลือเยอะ -> SV = EDV-ESV -> SV ลด", "refs": [], "tags": {"discipline": "physiology", "bloom": "apply", "topic": "PV loop: afterload", "lecture_guess": ["L04"]}}, {"id": "52-MCQ-030", "n": 30, "type": "MCQ", "stem": "The S4 heart sound is best explained by what?", "options": [{"key": "A", "text": "Turbulent flow through a stenotic valve", "why": "Stenotic valve → murmur"}, {"key": "B", "text": "Closure of the mitral and tricuspid valves", "why": "AV valve ปิด = S1"}, {"key": "C", "text": "Atrial contraction into a stiff ventricle", "why": "ถูก — atrial contraction เข้า ventricle ที่ compliance ต่ำ = S4"}, {"key": "D", "text": "Rapid ventricular filling in early diastole", "why": "Rapid early filling = S3"}, {"key": "E", "text": "Vibration of papillary muscles during systole", "why": "ไม่ใช่กลไกของ S4"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Ventricle แข็ง (LVH, ischemia, HTN)", "Compliance ↓", {"s": "Late diastole: atrial contraction ดันเลือดเข้า ventricle แข็ง"}, {"s": "ผนัง ventricle สั่น → S4", "answer": true}], "key_concept": "• S4 ต้องมี atrial contraction จึงไม่มีใน AF\n• บ่งบอก diastolic dysfunction", "explanation": "S4 = atrial contraction เข้า ventricle ที่แข็ง", "source_note": "Atrial contraction ->Associated with stiff, low compliant ventricle (e.g., ventricular hypertrophy; ischemic ventricle)", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "S4 heart sound", "lecture_guess": ["L04"]}}, {"id": "52-MCQ-033", "n": 33, "type": "MCQ", "stem": "Which of the following is the primary immediate response to an acute drop in systemic arterial pressure?", "options": [{"key": "A", "text": "Increased aldosterone secretion", "why": "Aldosterone เป็นกลไกช้า (ชั่วโมง–วัน)"}, {"key": "B", "text": "Activation of tubuloglomerular feedback", "why": "TGF เป็นกลไก local ของไต ไม่ใช่ systemic response"}, {"key": "C", "text": "Increased parasympathetic tone -> bradycardia", "why": "ตรงข้าม — parasympathetic จะลดลง"}, {"key": "D", "text": "Increased sympathetic activity -> increase HR, contractility, and TPR", "why": "ถูก — baroreceptor reflex เพิ่ม sympathetic ภายในวินาที"}, {"key": "E", "text": "Increased ADH release", "why": "ADH เป็นกลไกระยะกลาง–ยาว"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Arterial pressure ↓ ทันที", "Baroreceptor (carotid sinus, aortic arch) stretch ↓", "Afferent firing ↓ (CN IX, X)", {"s": "Sympathetic ↑ / parasympathetic ↓", "answer": true}, "HR ↑ + contractility ↑ (β1)", "Arteriolar + venous constriction (α1) → TPR ↑", "MAP กลับใกล้ปกติ"], "key_concept": "• การควบคุม BP ตามเวลา: วินาที = baroreceptor/chemoreceptor/CNS ischemic response\n• นาที–ชั่วโมง = RAAS, capillary fluid shift, stress relaxation\n• วัน = renal body fluid–pressure control (aldosterone, ADH)", "explanation": "Response ทันทีต่อ BP ลด = baroreceptor reflex เพิ่ม sympathetic", "source_note": "Baroreceptor reflex -> carotid artery ลด tone parasym", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Short-term BP regulation", "lecture_guess": ["L10"]}}, {"id": "52-MCQ-035", "n": 35, "type": "MCQ", "stem": "Which type of capillaries is typically found in the small intestine and renal glomeruli?", "options": [{"key": "A", "text": "Metarterioles", "why": "Metarteriole ไม่ใช่ชนิดของ capillary"}, {"key": "B", "text": "Sinusoidal capillaries", "why": "Sinusoid อยู่ใน liver, spleen, bone marrow"}, {"key": "C", "text": "Continuous capillaries", "why": "Continuous อยู่ใน muscle, skin, CNS (BBB)"}, {"key": "D", "text": "Lymphatic capillaries", "why": "Lymphatic capillary ไม่ใช่ blood capillary"}, {"key": "E", "text": "Fenestrated capillaries", "why": "ถูก — Fenestrated พบที่ intestinal villi, glomerulus, endocrine glands, choroid plexus"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "ชนิด capillary: Continuous (tight junction, muscle, lung, CNS), Fenestrated (มีรู 60–80 nm, ลำไส้, glomerulus, endocrine, ciliary body), Sinusoidal/discontinuous (ช่องใหญ่ basal lamina ไม่ต่อเนื่อง, liver, spleen, marrow) — เลือกชนิดตามหน้าที่ดูดซึม/กรอง", "explanation": "ลำไส้เล็กและ glomerulus ใช้ fenestrated capillaries", "source_note": "ดูดซึม/กรองไดดี", "refs": [], "tags": {"discipline": "anatomy", "bloom": "recall", "topic": "Types of capillaries", "lecture_guess": ["L06", "L07"]}}, {"id": "52-MCQ-036", "n": 36, "type": "MCQ", "stem": "Which of the following is the primary mechanism by which the heart is protected from the high pressure generated during systole?", "options": [{"key": "A", "text": "High compliance of the coronary sinus", "why": "Coronary sinus เป็นทางระบาย venous ไม่ป้องกัน pressure"}, {"key": "B", "text": "Absence of smooth muscle tone", "why": "Coronary arterioles มี tone และ autoregulate"}, {"key": "C", "text": "Aortic valve closes, causing a pressure drop during diastole", "why": "Aortic valve ปิดเป็นเหตุให้ coronary flow เกิดช่วง diastole แต่ไม่ใช่การป้องกันจาก systolic pressure"}, {"key": "D", "text": "Elastic recoil of the coronary arteries dampening pulse pressure", "why": "ไม่ใช่กลไกหลัก"}, {"key": "E", "text": "Compression of coronary vessels during contraction", "why": "ถูก (ตามเฉลย) — กล้ามเนื้อบีบอัด intramyocardial coronary vessels ช่วง systole flow หยุด/ย้อน"}], "answer": "E", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "principle", "key_concept": "• Coronary flow ของ LV เกิดช่วง diastole เป็นหลัก เพราะช่วง systole กล้ามเนื้อบีบหลอดเลือด intramyocardial (extravascular compression) โดยเฉพาะ subendocardium\n• RV flow ค่อนข้างคงที่\n• Tachycardia ลด diastolic time จึงลด coronary perfusion\n• subendocardium เสี่ยง ischemia ที่สุด", "explanation": "ช่วง systole coronary vessels ถูกบีบ ทำให้ flow ของ LV เกิดใน diastole", "source_note": "หัวใจปองกันตัวเองโดยเมื่อกลามเนื้อหัวใจหดตัวจะไปบีบอัด coronary artery ทำใหเลือดหยุดไหลชั่วคราวในชวง systole ที่มีความดันสูง จึงลดความเสียหายของหลอดเลือด และทำใหการไหลเวียนเลือดไปเลี้ยงหัวใจเกิดขึ้นเปนหลักในชวง diastole", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Coronary circulation", "lecture_guess": ["L15"]}}, {"id": "52-MCQ-037", "n": 37, "type": "MCQ", "stem": "What is the primary mechanism responsible for maintaining a consistent cerebral blood flow across mean arterial pressure ranges from 60 to 169 mmHg?", "options": [{"key": "A", "text": "Intrinsic myogenic mechanism", "why": "ถูก — myogenic autoregulation ของ cerebral arterioles รักษา CBF ที่ MAP ~60–160 mmHg"}, {"key": "B", "text": "Sympathetic innervation of myocardial capillaries", "why": "Myocardial capillaries ไม่เกี่ยวกับสมอง"}, {"key": "C", "text": "High sensitivity of cerebral arterioles causing release of adenosine", "why": "Adenosine เป็น metabolic factor ไม่ใช่ตัวหลักใน range นี้"}, {"key": "D", "text": "High oncotic pressure in cerebral capillaries", "why": "Oncotic pressure ไม่ควบคุม flow"}, {"key": "E", "text": "Pressure gradient between systemic arteries and jugular veins", "why": "Pressure gradient เปลี่ยนตาม MAP จึงไม่ทำให้ flow คงที่"}], "answer": "A", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["MAP ↑", "Cerebral arteriolar wall stretch ↑", "Stretch-activated cation channels → depolarization", "Ca²⁺ influx → smooth muscle contraction", {"s": "Vasoconstriction → resistance ↑", "answer": true}, "CBF คงที่ (MAP ↓ → กลับทิศ = vasodilation)"], "key_concept": "• CBF ~ 750 mL/min ถูกคุมโดย myogenic autoregulation (MAP 60–160), PaCO₂ (ตัวที่แรงที่สุด: CO₂ ↑ → vasodilation), PaO₂ < 50\n• Chronic HTN เลื่อน autoregulation curve ไปทางขวา", "explanation": "CBF คงที่ใน MAP 60–160 ด้วย intrinsic myogenic autoregulation", "source_note": "Decreases in MAP cause vasodilation and increases in MAP trigger precapillary vascular constriction within seconds.", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Cerebral autoregulation", "lecture_guess": ["L15"]}}, {"id": "52-MCQ-038", "n": 38, "type": "MCQ", "stem": "A 55-year-old man is undergoing assessment of renal blood flow. Various mechanisms act to regulate the resistance of the afferent and efferent arterioles to maintain glomerular filtration rate (GFR). Which of the following correctly matches the mechanism with its primary effect on arteriolar resistance?", "options": [{"key": "A", "text": "High vasopressin (ADH)", "why": "ADH มีผลต่อ collecting duct มากกว่าต่อ arteriolar resistance"}, {"key": "B", "text": "Tubuloglomerular feedback", "why": "ถูก (ตามเฉลย) — macula densa ตรวจ NaCl สูง → afferent arteriole หดตัว → GFR ลด"}, {"key": "C", "text": "Increased oncotic pressure in peritubular capillaries", "why": "Peritubular oncotic pressure มีผลต่อ reabsorption ไม่ใช่ arteriolar resistance"}, {"key": "D", "text": "Intrinsic myogenic mechanism", "why": "Myogenic ก็ปรับ afferent resistance แต่ตอบสนองต่อ stretch ไม่ใช่ tubular signal"}, {"key": "E", "text": "Baroreceptor and sympathetic activation", "why": "Sympathetic ทำให้ afferent+efferent หดตัว ลด RBF"}], "answer": "B", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["GFR ↑", "NaCl delivery ไป macula densa ↑", {"s": "Macula densa ส่ง adenosine/ATP", "note": "tubuloglomerular feedback"}, {"s": "Afferent arteriole หดตัว (resistance ↑)", "answer": true}, "GFR กลับปกติ"], "key_concept": "• Renal autoregulation 2 กลไก: myogenic (afferent arteriole ตอบสนองต่อ stretch) และ tubuloglomerular feedback (macula densa ตรวจ NaCl)\n• Angiotensin II หด efferent มากกว่า afferent → รักษา GFR", "explanation": "Tubuloglomerular feedback: NaCl สูงที่ macula densa → afferent arteriole หดตัว", "source_note": "ขอนี้ขอสอบจริงไมมี (นาจะ KUB) Tubuloglomerular feedback ทำงานผาน macula densa ตรวจ NaCl ที่ distal tubule → NaCl สูง → afferent arteriole หดตัว → ลด GFR", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Renal autoregulation", "lecture_guess": ["L15"]}}, {"id": "52-MCQ-039", "n": 39, "type": "MCQ", "stem": "Which vessel in the pulmonary circulation primarily regulates pulmonary vascular resistance in response to local alveolar hypoxia?", "options": [{"key": "A", "text": "Pulmonary capillaries", "why": "Capillaries ไม่มี smooth muscle"}, {"key": "B", "text": "Large elastic pulmonary arteries", "why": "Large elastic arteries ไม่คุม resistance"}, {"key": "C", "text": "Pulmonary veins", "why": "Pulmonary veins ไม่ใช่ตำแหน่งหลักของ HPV"}, {"key": "D", "text": "Pulmonary arterioles", "why": "ถูก — pulmonary arterioles หดตัวเมื่อ alveolar PO₂ ต่ำ (HPV)"}, {"key": "E", "text": "Pulmonary venules", "why": "Venules ไม่ใช่ตำแหน่งหลัก"}], "answer": "D", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Alveolar PO₂ ↓ (regional hypoxia)", "O₂-sensitive K⁺ channels ใน smooth muscle ปิด", "Depolarization → Ca²⁺ influx", {"s": "Pulmonary arteriolar vasoconstriction", "answer": true}, "Blood shunt ไปยังถุงลมที่ ventilate ดี → V/Q matching ดีขึ้น"], "key_concept": "• Hypoxic pulmonary vasoconstriction ตรงข้ามกับ systemic circulation (hypoxia → vasodilation)\n• Global hypoxia (high altitude, COPD) → HPV ทั่วปอด → pulmonary HTN → cor pulmonale", "explanation": "Pulmonary arterioles หดตัวตอบสนองต่อ alveolar hypoxia", "source_note": "เมื่อ alveolar PO₂ ลดลง → จะเกิด vasoconstriction ที่ pulmonary arterioles ใกลถุงลมนั้น", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Hypoxic pulmonary vasoconstriction", "lecture_guess": ["L15"]}}, {"id": "52-MCQ-040", "n": 40, "type": "MCQ", "stem": "What is the primary physiological mechanism  [{"key": "A", "text": "Increased sympathetic stimulation to arterioles", "why": "Sympathetic ทำให้ flow ลด ไม่ได้รักษา organ perfusion ให้คงที่"}, {"key": "B", "text": "Activation of renin-angiotensin-aldosterone system", "why": "RAAS ช้า และเพิ่ม BP ไม่ใช่รักษา flow คงที่"}, {"key": "C", "text": "Afferent arteriole constriction via myogenic response (autoregulation)", "why": "ถูก — myogenic autoregulation: pressure ↑ → afferent/arteriole หดตัว → flow คงที่"}, {"key": "D", "text": "Increased ADH secretion", "why": "ADH ไม่ใช่กลไก local"}, {"key": "E", "text": "Enhanced parasympathetic activity", "why": "Parasympathetic แทบไม่มีผลต่อ arteriole ส่วนใหญ่"}], "answer": "C", "answer_verified": true, "answer_status": "source_agree", "explanation_style": "sequence", "mechanism": ["Systemic arterial pressure ↑ ชั่วคราว", "Arteriolar wall stretch ↑", {"s": "Myogenic arteriolar constriction (resistance ↑)", "answer": true}, "Flow = ΔP/R คงที่", "Organ perfusion คงที่ (autoregulation)"], "key_concept": "Autoregulation: flow คงที่แม้ perfusion pressure เปลี่ยน อาศัย myogenic และ metabolic mechanisms เด่นในไต สมอง หัวใจ", "explanation": "Pressure เพิ่มชั่วคราว → arteriole หดตัวแบบ myogenic → flow คงที่", "source_note": "smooth muscle ของ arteriole หดตัวอัตโนมัติ (autoregulation) resistance ↑ → flow คงที่", "refs": [], "tags": {"discipline": "physiology", "bloom": "understand", "topic": "Autoregulation", "lecture_guess": ["L07", "L15"]}}, {"id": "52-MCQ-042", "n": 42, "type": "MCQ", "stem": "When a healthy adult stands up suddenly, venous pooling in the lower body reduces stroke volume. Which systemic response primarily maintains mean arterial pressure?", "options": [{"key": "A", "text": "Local nitric oxide-mediated vasodilation in skeletal muscles", "why": "NO vasodilation ทำให้ BP ลดเพิ่ม"}, {"key": "B", "text": "Rapid renal sodium and water retention", "why": "Renal retention ช้าเกินไป"}, {"key": "C", "text": "Sympathetic-mediated arteriolar constriction increasing total peri
